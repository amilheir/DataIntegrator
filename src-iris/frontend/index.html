           <label style="flex:1">Driver jar <input class="c_cp" style="width:100%" placeholder="/opt/irisbuild/jdbc/driver.jar"></label>
         </span>
         <span class="c_odbc" style="display:none"><label>DSN <input class="c_dsn" size="18"></label></span>
         <label>User <input class="c_user" size="12"></label>
         <label>Password <input class="c_pwd" type="password" size="12"></label>
         <button class="c_create" style="font-family:var(--font);font-weight:700;font-size:.76rem;background:var(--teal-fill);color:var(--on-teal);border:1.5px solid var(--teal-fill);border-radius:7px;padding:.35rem .8rem;cursor:pointer">Create connection</button>
         <span class="c_msg" style="font-size:.78rem;color:var(--ink-soft)"></span>
       </div>`;
    const applyPreset = () => {
      const p = PRESETS[box.querySelector(".c_preset").value];
      box.querySelector(".c_url").value = p.url;
      box.querySelector(".c_driver").value = p.driver;
      box.querySelector(".c_cp").value = p.cp;
    };
    box.querySelector(".c_preset").onchange = applyPreset;
    // Open on the preset for the source type already picked in Step 2 - the
    // user has said "PostgreSQL"/"IRIS"/"JDBC" once, so asking again is noise.
    const chosen = card.querySelector(".w_srctype").value;
    if (PRESETS[chosen]) box.querySelector(".c_preset").value = chosen;
    applyPreset();
    box.querySelector(".c_kind").onchange = () => {
      const jdbc = box.querySelector(".c_kind").value === "jdbc";
      box.querySelector(".c_jdbc").style.display = jdbc ? "flex" : "none";
      box.querySelector(".c_odbc").style.display = jdbc ? "none" : "inline";
    };
    box.querySelector(".c_create").onclick = async ev => {
      ev.preventDefault();
      const msg = box.querySelector(".c_msg");
      msg.textContent = "creating...";
      const payload = {
        name: box.querySelector(".c_name").value.trim(),
        kind: box.querySelector(".c_kind").value,
        url: box.querySelector(".c_url").value.trim(),
        driver: box.querySelector(".c_driver").value.trim(),
        classpath: box.querySelector(".c_cp").value.trim(),
        dsn: box.querySelector(".c_dsn").value.trim(),
        user: box.querySelector(".c_user").value,
        password: box.querySelector(".c_pwd").value
      };
      const r = await fetch(api("/gateway/create"), { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const j = await r.json();
      if (j.error) { msg.textContent = j.error; return; }
      msg.textContent = j.message;
      box.querySelector(".c_pwd").value = "";
      // refresh the connection dropdown and select the new one
      OPT = await (await fetch(api("/wizard/options"))).json();
      syncMode();
      const sel = card.querySelector(".w_conn");
      if (sel) sel.value = j.name;
      wrecap(`SQL Gateway connection <b>${esc(j.name)}</b> ${esc(j.message)}.`);
    };
  };

  // --- Skip: the foreign server already exists, just discover what's on it
  card.querySelector(".w_skip2").onclick = async e => {
    e.preventDefault();
    wiz.sourceType = card.querySelector(".w_srctype").value;
    wiz.serverName = card.querySelector(".w_server").value.trim();
    const connSel = card.querySelector(".w_conn");
    wiz.connection = connSel ? connSel.value : "";
    try {
      const d = await wpost("/discover", { mode: wiz.mode, serverName: wiz.serverName,
        directory: wiz.csvDir || "" });
      const items = wiz.mode === "csv"
        ? d.files.map(f => f.name)
        : d.rows.map(r => r.table_schema + "." + r.table_name);
      card.querySelectorAll("input,select,button").forEach(x => x.disabled = true);
      card.classList.add("locked");
      wrecap(`Using the existing foreign server <b>ETLWIZARD.${esc(wiz.serverName)}</b> (creation skipped). ` +
        `Found <b>${items.length}</b> ` + (wiz.mode === "csv" ? "file(s)." : "table(s)."));
      wizardStep3(items);
    } catch (err) { /* wpost already alerted */ }
  };
}

/* ---------- REST branch (endpoints landed as JSON, exposed as views) ---------- */
// One endpoint = one table. Each is fetched, its pages landed raw in
// ETLW_LANDING, and a JSON_TABLE view put over them with the column map shown
// here. From the next step on it is indistinguishable from a mounted SQL table,
// so the transform step joins several endpoints into one target unchanged.
const REST_PAGING = [
  ["none",   "Single request"],
  ["offset", "Offset / limit (limit + offset, or _limit + _page)"],
  ["cursor", "Cursor (the response carries the next cursor)"]
];
async function wizardStepRest() {
  wiz.restEndpoints = [];
  wguide("<b>Step 3 &middot; Endpoints.</b> Add each endpoint this ETL reads. <b>Test</b> " +
    "fetches one page and shows the columns it found &mdash; the data path is detected " +
    "for you (a bare array, or the array inside the response) and every column is " +
    "editable. Nothing is stored until you press <b>Save &amp; mount</b>; then each " +
    "endpoint becomes <code>ETLWIZARD.&lt;base&gt;_&lt;name&gt;</code> and the transform " +
    "step joins them like any other tables.");
  const card = stepCard(
    `<label>Table prefix <input class="r_base" size="14" value="api"></label>
     <div class="r_list" style="width:100%;display:flex;flex-direction:column;gap:.5rem"></div>
     <div class="wrow">
       <button class="r_add" style="font-family:var(--font);font-weight:700;font-size:.74rem;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:7px;padding:.32rem .7rem;cursor:pointer">+ Add endpoint</button>
     </div>
     <span class="r_msg" style="font-size:.76rem;color:var(--ink-soft);width:100%"></span>`,
    "Save & mount", async c => {
      const base = c.querySelector(".r_base").value.trim();
      const eps = [...c.querySelectorAll(".r_ep")].map(row => {
        const cols = row._columns || [];
        return {
          name: row.querySelector(".r_name").value.trim(),
          url: wiz.baseUrl + row.querySelector(".r_path").value.trim(),
          dataPath: row.querySelector(".r_datapath").value.trim(),
          headers: wiz.restHeaders,
          pagination: { style: row.querySelector(".r_paging").value,
                        pageSize: +row.querySelector(".r_size").value || 100 },
          columns: cols
        };
      }).filter(e => e.name && e.columns.length);
      if (!eps.length) { alert("Add an endpoint and press Test on it first."); throw new Error("none"); }
      const msg = c.querySelector(".r_msg");
      msg.classList.add("busyspin"); msg.textContent = "fetching and mounting " + eps.length + " endpoint(s)";
      const j = await wpost("/rest-mount", { baseName: base, endpoints: eps });
      msg.classList.remove("busyspin"); msg.textContent = "";
      const mounted = (j.mounted || []).map(m => m.table.replace(/^ETLWIZARD\./, ""));
      wiz.tables = mounted;
      wiz.localName = mounted[0];
      wrecap(`Mounted ${(j.mounted || []).map(m => `<b>${esc(m.table)}</b> (${m.rows} row(s))`).join(", ")}` +
        ((j.failed || []).length ? ` &mdash; failed: ${j.failed.map(f => esc(f.endpoint)).join(", ")}` : "") +
        `. The raw JSON is kept in ETLW_LANDING, so a reload replays without re-fetching.`);
      // Data Sources ends at the mount for every source type — see wizardStep3
      await refreshTables();
      offerAddMore();
    });

  const list = card.querySelector(".r_list");
  const addRow = (path, name) => {
    const row = el(`
      <div class="r_ep" style="border:1px dashed var(--rule);border-radius:7px;padding:.5rem;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center">
        <label>Path <input class="r_path" size="24" value="${esc(path || "")}" placeholder="/path/name"></label>
        <label>As <input class="r_name" size="12" value="${esc(name || "")}" placeholder="name"></label>
        <label>Paging <select class="r_paging" style="font-size:.78rem">${REST_PAGING.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select></label>
        <label>Page size <input class="r_size" type="number" min="1" value="100" style="max-width:6rem"></label>
        <label>Data path <input class="r_datapath" size="12" placeholder="auto"></label>
        <button class="r_test" style="font-family:var(--font);font-weight:700;font-size:.74rem;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:7px;padding:.3rem .7rem;cursor:pointer">Test</button>
        <button class="r_del" title="remove this endpoint" style="font-family:var(--font);font-size:.74rem;background:var(--card);color:#b4552d;border:1.5px solid var(--rule);border-radius:7px;padding:.3rem .6rem;cursor:pointer">&times;</button>
        <div class="r_out w_details" style="flex-basis:100%"></div>
      </div>`).firstElementChild;
    list.appendChild(row);
    // name follows the last path segment until the user types one
    const pathIn = row.querySelector(".r_path"), nameIn = row.querySelector(".r_name");
    pathIn.oninput = () => {
      if (nameIn.dataset.touched) return;
      const seg = pathIn.value.split("?")[0].split("/").filter(Boolean).pop() || "";
      nameIn.value = seg.replace(/[^A-Za-z0-9_]/g, "_").toLowerCase();
    };
    nameIn.oninput = () => nameIn.dataset.touched = "1";
    row.querySelector(".r_del").onclick = e => { e.preventDefault(); row.remove(); };
    row.querySelector(".r_test").onclick = async e => {
      e.preventDefault();
      const out = row.querySelector(".r_out");
      out.classList.add("busyspin"); out.textContent = "calling the endpoint";
      try {
        const j = await wpost("/rest-probe", { url: wiz.baseUrl + pathIn.value.trim(),
          dataPath: row.querySelector(".r_datapath").value.trim(), headers: wiz.restHeaders });
        out.classList.remove("busyspin");
        row._columns = j.columns || [];
        row.querySelector(".r_datapath").value = j.dataPath || "";
        out.innerHTML = `<b>${j.itemsOnPage}</b> item(s) on the first page &middot; data path <code>${esc(j.dataPath)}</code><br>` +
          `<b>columns:</b> ${(j.columns || []).map(cl => esc(cl.name) + " " + esc(cl.type)).join(", ")}<br>` +
          `<b>sample:</b> ${esc(JSON.stringify((j.sample || [])[0] || {}).slice(0, 220))}`;
      } catch (err) {
        out.classList.remove("busyspin");
        out.innerHTML = `<span style="color:#b4552d">could not read that endpoint &mdash; check the path and the data path</span>`;
        row._columns = [];
      }
    };
    return row;
  };
  card.querySelector(".r_add").onclick = e => { e.preventDefault(); addRow(); };
  addRow();
}

/* ---------- ODBC branch (IRIS linked tables) ---------- */
// ODBC sources are mounted as IRIS linked tables exposed as ETLWIZARD.<name>
// views, so the rest of the wizard treats them like any foreign table. Same two
// screens as JDBC — pick a schema, then tick the tables — except discovery walks
// the ODBC driver's catalog (there is no foreign server to query THROUGH) and a
// primary key travels with each table, because a linked table cannot exist
// without one. The driver usually reports it; the field stays editable for the
// (common) case where it reports nothing.

// Step 3a: which schema on the ODBC source?
async function wizardStepOdbc() {
  wiz.odbcLinked = [];
  wguide("<b>Step 3 &middot; Schema.</b> These are the schemas " +
    `<b>${esc(wiz.connection)}</b> exposes over ODBC. Pick the one your tables ` +
    "live in &mdash; you tick the tables themselves on the next step.");
  const d = await wpost("/discover", { mode: "odbc", connection: wiz.connection });
  const schemas = d.schemas || [];
  if (!schemas.length) {
    wrecap("No schemas came back from that ODBC connection &mdash; check the DSN and credentials.");
    return;
  }
  const rows = schemas.map((s, i) => `
    <label style="display:flex;gap:.4rem;align-items:center;width:100%;font-variant:normal;letter-spacing:0">
      <input type="radio" name="odbcschema" class="s_pick" value="${esc(s.schema)}" ${i === 0 ? "checked" : ""} style="width:auto">
      <code style="font-size:.8rem;flex:1">${esc(s.schema)}</code>
      <span style="font-size:.72rem;color:var(--ink-soft)">${s.tables} table${s.tables == 1 ? "" : "s"}</span>
    </label>`).join("");
  const card = stepCard(
    `<div class="wrow" style="max-height:12rem;overflow:auto;display:flex;flex-direction:column;gap:.25rem">${rows}</div>`,
    "Show tables &rarr;", async c => {
      const sch = c.querySelector(".s_pick:checked").value;
      wiz.odbcSchema = sch;
      wrecap(`Schema <b>${esc(sch)}</b> on <b>${esc(wiz.connection)}</b>. Now pick the tables to link.`);
      await wizardStepOdbcTables(sch);
    });
  wrecap(`Found <b>${schemas.length}</b> schema(s) over ODBC connection <b>${esc(wiz.connection)}</b>.`);
  return card;
}

// Step 3b: tick the tables to link — the ODBC twin of wizardStep3
async function wizardStepOdbcTables(schema) {
  wguide("<b>Step 3 &middot; Tables.</b> Tick everything you want to link &mdash; you can " +
    "link several in one go, and edit the name each becomes in IRIS. Nothing is copied: " +
    "a linked table reads the source in place. Each one needs a <b>primary key</b>; " +
    "where the driver reports one it is filled in for you, otherwise type it in. " +
    "Already linked them? <b>Skip</b> &mdash; you pick and profile them on the next step.");
  const d = await wpost("/discover", { mode: "odbc", connection: wiz.connection, schemaName: schema });
  const tables = d.rows || [];
  if (!tables.length) {
    wrecap(`Schema <b>${esc(schema)}</b> has no tables the ODBC driver will show.`);
    return;
  }
  const rows = tables.map(t => {
    const pk = t.primary_key || "";
    return `<label style="display:flex;gap:.4rem;align-items:center;width:100%;font-variant:normal;letter-spacing:0">
       <input type="checkbox" class="m_pick" value="${esc(t.table_name)}" style="width:auto">
       <code style="font-size:.8rem;flex:1">${esc(t.table_schema)}.${esc(t.table_name)}</code>
       <span style="font-size:.72rem;color:${pk ? "var(--ink-soft)" : "#b4552d"}">${pk ? "pk" : "pk?"}</span>
       <input class="m_pk" size="10" value="${esc(pk)}" placeholder="id" title="${pk ? "reported by the driver" : "the driver reports no primary key — type one"}">
       <span style="font-size:.72rem;color:var(--ink-soft)">mount as</span>
       <input class="m_as" size="14" value="odbc_${esc(t.table_name)}">
     </label>`;
  }).join("");
  const card = stepCard(
    `<div class="wrow" style="max-height:12rem;overflow:auto;display:flex;flex-direction:column;gap:.25rem">${rows}</div>
     <span class="o_msg" style="font-size:.76rem;color:var(--ink-soft);width:100%"></span>`,
    "Save & mount", async c => {
      const picked = [...c.querySelectorAll(".m_pick:checked")];
      if (!picked.length) { alert("Tick at least one table."); throw new Error("none"); }
      const missing = picked.filter(cb => !cb.closest("label").querySelector(".m_pk").value.trim());
      if (missing.length) {
        alert("A primary key is required for every linked table (ODBC cannot always detect one): " +
          missing.map(cb => cb.value).join(", "));
        throw new Error("pk");
      }
      const msg = c.querySelector(".o_msg");
      const mounted = [], failed = [];
      for (const cb of picked) {
        const row = cb.closest("label");
        const local = row.querySelector(".m_as").value.trim();
        msg.classList.add("busyspin"); msg.textContent = "linking " + cb.value;
        try {
          await wpost("/mount", { mode: "odbc", connection: wiz.connection,
            schemaName: schema, tableName: cb.value,
            primaryKeys: row.querySelector(".m_pk").value.trim(), localName: local });
          mounted.push(local);
        } catch (e) { failed.push(local); }
      }
      msg.classList.remove("busyspin"); msg.textContent = "";
      if (!mounted.length) throw new Error("nothing linked");
      wiz.odbcLinked = mounted;
      wiz.tables = mounted;              // pre-ticked in the next step
      wiz.localName = mounted[0];
      wrecap(`Linked ${mounted.map(m => "<b>ETLWIZARD." + esc(m) + "</b>").join(", ")} over ODBC` +
        (failed.length ? ` (failed: ${failed.map(esc).join(", ")})` : "") +
        `. The data stays at the source; IRIS queries it in place.`);
      // Data Sources ends at the mount for every source type — see wizardStep3
      await refreshTables();
      offerAddMore();
    });
  wrecap(`Schema <b>${esc(schema)}</b> holds <b>${tables.length}</b> table(s).`);
  // "Skip (already linked)" is gone for the same reason as Step 3's skip: it
  // only existed to jump into the transform step, and Data Sources no longer
  // leads there. Already-linked tables show up on ETL Interop by themselves.
}

/* ---------- File bulk-load branch (CSV / XLSX -> LOAD DATA) ---------- */
// Build the bulk flowchart from wiz state: file source -> Bulk Load -> target
// (+ production hosts once deployed). Same freeze/snapshot machinery as transform.
function syncBulkGraph() {
  if (!wizGraphActive) return;
  nodes.clear(); edges.length = 0;
  const done = !!wiz.deployed;
  const st = done ? "deployed" : "configured";
  const base = wiz.targetBase || "result";
  const fileNode = "wiz:file", loadNode = "wiz:bulk", tgtNode = "wiz:target";
  nodes.set(fileNode, { nodeId: fileNode, name: "file: " + (wiz.bulkFile || "?"), kind: "source", status: st, order: 10 });
  const cfg = [];
  cfg.push(wiz.bulk ? "LOAD BULK DATA" : "LOAD DATA");
  cfg.push(wiz.bulkStrategy === "append" ? "Append" : "Full reload");
  if (wiz.bulkDelim) cfg.push("delimiter: " + (wiz.bulkDelim === "\t" ? "TAB" : wiz.bulkDelim));
  if (wiz.cadence) cfg.push(wiz.cadence);
  nodes.set(loadNode, { nodeId: loadNode, name: base + "_bulk", kind: "bulk_load", status: st,
    detail: cfg.join("|"), order: 25 });
  edges.push({ from: fileNode, to: loadNode, label: wiz.bulk ? "LOAD BULK DATA" : "LOAD DATA" });
  // The file is ingested into a SOURCE table, not an ETL target - and no
  // production is created, so the three host nodes this used to draw would be
  // a picture of something that does not exist.
  nodes.set(tgtNode, { nodeId: tgtNode, name: "ETLWIZARD.ext_" + base, kind: "source_table",
    status: done ? "succeeded" : "configured", order: 40 });
  edges.push({ from: loadNode, to: tgtNode, label: wiz.bulkStrategy === "append" ? "Append" : "Full reload" });
  renderGraph();
}

async function wizardStepBulk() {
  wizGraphActive = true; graphFrozen = false; wiz.deployed = false;
  wguide("<b>Bulk load a file.</b> Upload a <b>CSV</b> or <b>XLSX</b> (converted to CSV on the server). " +
    "The rows are ingested <b>once</b> with IRIS <b>LOAD DATA / LOAD BULK DATA</b> into a source table " +
    "<b>ETLWIZARD.ext_&lt;name&gt;</b>, beside the sources you mounted &mdash; ready to build an ETL from, " +
    "or to embed on the Knowledge Base tab. No production and no schedule: an uploaded file does not " +
    "change on its own. To import again, upload again.");
  const card = stepCard(
    `<div class="wrow" style="display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;width:100%">
       <label class="b_drop" style="flex:1;min-width:14rem;display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;border:1.5px dashed var(--teal);border-radius:8px;background:color-mix(in srgb,var(--teal) 6%,transparent);cursor:pointer;transition:background .2s ease">
         <span style="font-size:1.3rem;line-height:1">&#128193;</span>
         <span style="display:flex;flex-direction:column;line-height:1.25">
           <span style="font-family:var(--font);font-weight:600;font-size:.9rem;color:var(--ink)">Choose a file&hellip;</span>
           <span class="b_fname" style="font-size:.74rem;color:var(--ink-soft)">CSV or XLSX &middot; drag &amp; drop or click</span>
         </span>
         <input class="b_file" type="file" accept=".csv,.xlsx" style="display:none">
       </label>
       <button class="b_up" style="font-family:var(--font);font-weight:700;font-size:.78rem;background:var(--teal-fill);color:var(--on-teal);border:1.5px solid var(--teal-fill);border-radius:7px;padding:.5rem 1rem;cursor:pointer;box-shadow:var(--shadow)">Upload &amp; inspect</button>
     </div>
     <span class="b_msg" style="font-size:.76rem;color:var(--ink-soft);width:100%"></span>
     <div class="b_form" style="display:none;width:100%">
       <label title="The file is ingested into ETLWIZARD.ext_&lt;this name&gt;">Source name <input class="b_base" size="16" value="bulk_data"></label>
       <span class="w_details b_dest">will create <b>ETLWIZARD.ext_bulk_data</b></span>
       <label>Strategy <select class="b_strat"><option value="full">Full reload</option><option value="append">Append</option></select></label>
       <label title="LOAD BULK DATA is faster but non-atomic">Bulk <input class="b_bulk" type="checkbox" checked style="width:auto"></label>
       <label>Header row <input class="b_header" type="checkbox" checked style="width:auto"></label>
       <label>Delimiter <input class="b_delim" size="3" value=","></label>
       <div class="w_details b_cols"></div>
     </div>`,
    "Deploy & load", async c => {
      if (!wiz.bulkFile) { alert("Upload a file first."); throw new Error("no file"); }
      const base = c.querySelector(".b_base").value.trim();
      // No schedule, and no production. A bulk load is a ONE-OFF import of a
      // file someone uploaded by hand: there is nothing for a poller to poll,
      // and a business service firing every 300s would re-import the same file
      // forever. Re-importing is a deliberate act - upload again.
      wiz.cadence = "";
      const j = await wpost("/bulk-deploy", {
        baseName: base, csvFile: wiz.bulkFile,
        columnDefs: c.querySelector(".b_cols").dataset.defs || wiz.bulkDefs,
        strategy: c.querySelector(".b_strat").value,
        bulk: c.querySelector(".b_bulk").checked ? 1 : 0,
        header: c.querySelector(".b_header").checked ? 1 : 0,
        separator: c.querySelector(".b_delim").value || ",",
        pipelineName: wiz.pipelineName });
      const load = j.load || {};
      // finalize the flowchart (kept + snapshotted, like the transform path)
      wiz.targetBase = base; wiz.bulkStrategy = c.querySelector(".b_strat").value;
      wiz.bulk = c.querySelector(".b_bulk").checked; wiz.bulkDelim = c.querySelector(".b_delim").value;
      wiz.deployed = true; wizGraphActive = true; syncBulkGraph(); wizGraphActive = false;
      graphFrozen = true; snapshotGraph($("pipeid").value);
      // On an append, rowsLoaded is the table TOTAL, not what this file added -
      // reporting it as "moved N rows" reads as though the file had N rows.
      const moved = load.appended
        ? `Appended <b>${load.rowsAdded}</b> row(s) onto ${load.rowsBefore} already there ` +
          `(<b>${load.rowsLoaded}</b> in total) in `
        : `Moved <b>${load.rowsLoaded !== undefined ? load.rowsLoaded : "?"}</b> row(s) into `;
      wrecap(`<b>Ingested.</b> ${moved}` +
        `<b>${esc(load.target || "ETLWIZARD.ext_" + base)}</b> via ${wiz.bulk ? "LOAD BULK DATA" : "LOAD DATA"}` +
        (j.note ? `.<br><span class="w_details">${esc(j.note)}</span>` : "") +
        `.<br>It is now a source like any other: build an ETL from it on <b>ETL Interop</b>, ` +
        `or embed it on <b>Knowledge Base</b>. To import again, upload the file again.`);
      $("runbanner").innerHTML = "File ingested as a source &middot; no production was created.";
      // No index step. It optimises an ETL TARGET - a table that gets reloaded
      // on a schedule and queried repeatedly - and reads ETLW_TARGET.<base>
      // directly, so against an ingested source it failed with "target table
      // ETLW_TARGET.<base> not found" after the data had already loaded fine.
      // An ingested source is finished when it is loaded; index it from the ETL
      // that consumes it, where the query pattern is actually known.
      await0(refreshTables(""));
    });

  // Show the real table name as it is typed: "Source name" alone does not say
  // where the data lands, and the prefix is not the user's to remember.
  const baseInp = card.querySelector(".b_base");
  const dest = card.querySelector(".b_dest");
  const showDest = () => {
    const v = (baseInp.value || "").trim().replace(/^ext_/i, "");
    dest.innerHTML = v ? `will create <b>ETLWIZARD.ext_${esc(v)}</b>` : "";
  };
  baseInp.oninput = showDest;

  const msg = card.querySelector(".b_msg");
  // filename display + drag & drop
  const inp = card.querySelector(".b_file");
  const drop = card.querySelector(".b_drop");
  const fnameEl = card.querySelector(".b_fname");
  const showName = () => {
    const f = inp.files[0];
    fnameEl.innerHTML = f
      ? esc(f.name) + " &middot; " + (f.size < 1024 ? f.size + " B" : (f.size / 1024).toFixed(0) + " KB")
      : "CSV or XLSX &middot; drag &amp; drop or click";
  };
  inp.onchange = showName;
  ["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.style.background = "color-mix(in srgb, var(--teal) 18%, transparent)";
  }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.style.background = "color-mix(in srgb, var(--teal) 6%, transparent)";
  }));
  drop.addEventListener("drop", e => {
    if (e.dataTransfer.files.length) { inp.files = e.dataTransfer.files; showName(); }
  });
  card.querySelector(".b_up").onclick = async e => {
    e.preventDefault();
    const f = card.querySelector(".b_file").files[0];
    if (!f) { alert("Choose a file."); return; }
    msg.classList.add("busyspin");
    msg.textContent = /\.xlsx$/i.test(f.name) ? "uploading & converting xlsx" : "uploading";
    try {
      // stream the raw bytes (no size cap); name travels in a header
      const r = await fetch(wapi("/upload"), {
        method: "POST",
        headers: { "X-Filename": f.name, "Content-Type": "application/octet-stream" },
        body: f
      });
      const j = await r.json();
      msg.classList.remove("busyspin");
      if (j.error) { msg.textContent = j.error; return; }
      wiz.bulkFile = j.csvFile; wiz.bulkDefs = j.columnDefs || "";
      // Sanitise here, not just at submit: the field is what the user sees and
      // edits, so it has to hold a name the server will actually accept.
      wiz.targetBase = sqlSafeName((j.csvFile || "bulk_data").replace(/\.csv$/i, "")) || "bulk_data";
      card.querySelector(".b_base").value = wiz.targetBase;
      const cols = card.querySelector(".b_cols");
      cols.dataset.defs = wiz.bulkDefs;
      cols.innerHTML = `<b>columns:</b> ${esc(wiz.bulkDefs)}` + (j.note ? `<br>${esc(j.note)}` : "");
      card.querySelector(".b_form").style.display = "block";
      msg.textContent = "ready - review columns and deploy.";
      // seed the live flowchart
      wiz.bulk = true; wiz.bulkStrategy = "full"; wiz.bulkDelim = ",";
      syncBulkGraph();
    } catch (err) { msg.classList.remove("busyspin"); msg.textContent = "upload failed."; }
  };
  // keep the graph live as options change
  const bulkSync = () => {
    wiz.targetBase = card.querySelector(".b_base").value.trim();
    wiz.bulkStrategy = card.querySelector(".b_strat").value;
    wiz.bulk = card.querySelector(".b_bulk").checked;
    wiz.bulkDelim = card.querySelector(".b_delim").value;
    wiz.cadence = scheduleSummary(card);
    if (wiz.bulkFile) syncBulkGraph();
  };
  ["b_base", "b_strat", "b_bulk", "b_header", "b_delim"].forEach(cl =>
    card.querySelector("." + cl).addEventListener("input", bulkSync));
  // No wireSchedule: this card has no schedule controls to wire, and calling it
  // threw on the first missing element - which happens before the form is
  // usable at all, so the whole step was dead.
}

function wizardStep3(items) {
  wguide("<b>Step 3 &middot; " + (wiz.mode === "csv" ? "Files" : "Tables") + ".</b> Tick everything " +
    "you want to mount &mdash; you can mount several in one go, and edit the name each " +
    "becomes in IRIS. Nothing is copied: a foreign table reads the source in place. " +
    "This is the last step here: mounted tables stay available to every ETL, and you " +
    "build the ETL itself on the <b>ETL Interop</b> tab.", "tables", "mount");
  const rows = items.map((it, i) => {
    // an IRIS table name is letters/digits/underscore only, so a file like
    // "Online Retail.csv" must not become "ext_Online Retail" — the mount would
    // be rejected with "invalid local table name"
    const raw = wiz.mode === "csv" ? it.replace(/\.csv$/i, "") : it.split(".").pop();
    const base = raw.replace(/[^A-Za-z0-9_]/g, "_").replace(/_+/g, "_").replace(/^_|_$/g, "");
    return `<label style="display:flex;gap:.4rem;align-items:center;width:100%;font-variant:normal;letter-spacing:0">
       <input type="checkbox" class="m_pick" value="${esc(it)}" style="width:auto">
       <code style="font-size:.8rem;flex:1">${esc(it)}</code>
       <span style="font-size:.72rem;color:var(--ink-soft)">mount as</span>
       <input class="m_as" size="16" value="ext_${esc(base)}">
     </label>`;
  }).join("");
  const card = stepCard(
    // No "Skip (already mounted)" here any more: it existed to jump straight
    // into the transform step, and mounting no longer leads there. Tables that
    // are already mounted show up on the ETL Interop tab on their own.
    `<div class="wrow" style="max-height:12rem;overflow:auto;display:flex;flex-direction:column;gap:.25rem">${rows}</div>`,
    "Save & mount", async c => {
      const picked = [...c.querySelectorAll(".m_pick:checked")];
      if (!picked.length) { alert("Tick at least one " + (wiz.mode === "csv" ? "file" : "table") + "."); throw new Error("none"); }
      const mounted = [], failed = [];
      for (const cb of picked) {
        const src = cb.value;
        const local = cb.closest("label").querySelector(".m_as").value.trim();
        try {
          if (wiz.mode === "csv") {
            const det = await wpost("/table-details", { mode: "csv", fileName: src,
              directory: wiz.csvDir || "" });
            await wpost("/mount", { mode: "csv", localName: local, serverName: wiz.serverName,
              fileName: src, columnDefs: det.types.columnDefs });
          } else {
            const [sch, tbl] = src.split(".");
            await wpost("/mount", { mode: "jdbc", localName: local, serverName: wiz.serverName,
              schemaName: sch, tableName: tbl });
          }
          mounted.push(local);
        } catch (e) { failed.push(local); }
      }
      if (!mounted.length) throw new Error("nothing mounted");
      wiz.tables = mounted;              // pre-ticked in the next step
      wiz.localName = mounted[0];
      wrecap(`Mounted ${mounted.map(m => "<b>ETLWIZARD." + esc(m) + "</b>").join(", ")}` +
        (failed.length ? ` (failed: ${failed.map(esc).join(", ")})` : "") +
        `. The data stays at the source; IRIS queries it in place.`);
      // Data Sources ends here. Mounting is standing configuration, not the
      // first step of building an ETL, so there is nothing to continue into.
      await refreshTables();
      offerAddMore();
    });
}

/* Close out the Data Sources flow: the mounted tables are listed on the tab's
   own dropdown from here on, and "Add more..." restarts the tab from the
   source picker so several sources can be configured in one sitting. */
function offerAddMore() {
  const card = wmsg("formcard",
    // reuse .wsave so it matches every other card button
    `<div class="wrow"><button class="wsave s_more">Add more...</button></div>`);
  card.querySelector(".s_more").onclick = () => {
    // full restart of the tab, so the source dropdown is rebuilt and picks up
    // any connection or foreign server created since the page loaded
    OPT = null;
    resetTab("sources");
    activeTab = null;
    showTab("sources");
  };
  return card;
}

/* ---------- Indexes (last step: how the target gets read back) ---------- */
// The pipeline is deployed and loaded by the time we get here, so the target
// table's real shape and row counts are available to profile. The server
// applies the IRIS index-type rules and lets the local model revise them
// against what the column names mean; nothing is built until the user ticks it.
const IDX_TYPES = [
  ["none",     "None &mdash; build nothing for this column"],
  ["standard", "Standard &mdash; equality + range lookups, ORDER BY"],
  ["bitmap",   "Bitmap &mdash; low-cardinality columns, ANDed filters"],
  ["bitslice", "Bitslice &mdash; numeric measures aggregated with SUM/AVG"],
  ["columnar", "Columnar &mdash; analytic scans over one wide column"]
];

// Transient "working on it" line. The advisor profiles the table and then waits
// on the local model, which takes tens of seconds — long enough that silence
// reads as a hang. Returns a remove() handle.
function wbusy(text) {
  return wmsg("recap", `<span class="busyspin">${text}</span>`);
}

async function wizardStepIndexes(base, pk, wm) {
  wguide("<b>Optimise the target (advanced).</b> The target is loaded, so I profiled it and " +
    "asked the model which indexes are worth building &mdash; the ticked rows are " +
    "its picks and each says why. Every column of the target is listed, so you can " +
    "disagree freely: untick, change a type, tick a column it passed over, or " +
    "<b>+ Add index</b> for one of your own (several columns, comma-separated, make a " +
    "composite). Every index costs write time and space. For an analytic target you " +
    "can also store the <b>whole table</b> column-wise instead of indexing single columns.", "indexes");
  let j;
  const busy = wbusy(`Index advisor is profiling <b>ETLW_TARGET.${esc(base)}</b> and weighing the column types`);
  try {
    j = await wpost("/index-recommend", { baseName: base, pkColumns: pk, watermarkColumn: wm });
  } catch (e) {
    // Say what actually went wrong. "Advisor unavailable" is reserved for the
    // model not answering; a failure here is usually the target table missing.
    busy.remove();
    const why = String(e && e.message || e).replace(/^ERROR:\s*/, "");
    wrecap(`Indexes skipped &mdash; ${esc(why)}. The pipeline is deployed and running regardless.`);
    return;
  }
  busy.remove();
  const existing = ((j.existing || {}).rows) || [];
  const tc = j.tableColumnar || {};
  // When the model did not answer, do not pass its absence off as advice:
  // list every column set to "none" and let the user pick, keeping whatever the
  // rules noticed as a hint in the reason line.
  const advised = j.advisor === "agent";
  const rec = {};
  (j.recommendations || []).forEach(r => rec[r.column] = r);
  // One row per column of the target — the advisor's picks come pre-ticked with
  // their reason, everything else sits at "None" with its profile so the user
  // can index a column the advisor passed over.
  const cols = (j.profile || {}).columns || [];
  const recs = cols.map(c => {
    const r = rec[c.column];
    const stats = `${c.type}, ${c.distinct} distinct value(s)` + (c.nulls ? `, ${c.nulls} null` : "");
    if (r && advised) {
      return { column: c.column, type: r.type, name: r.name, exists: r.exists || 0,
               reason: r.reason || stats };
    }
    return { column: c.column, type: "none", name: (r || {}).name || "", exists: (r || {}).exists || 0,
             reason: r
               ? "suggestion (rules, not the model): " + r.type + " - " + r.reason
               : stats };
  });
  const rows = recs.map((r, i) => `
    <label style="display:flex;gap:.4rem;align-items:center;width:100%;font-variant:normal;letter-spacing:0;flex-wrap:wrap">
      <input type="checkbox" class="x_pick" value="${esc(r.column)}" ${(r.exists || r.type === "none") ? "" : "checked"} style="width:auto">
      <code style="font-size:.8rem;min-width:9rem">${esc(r.column)}</code>
      <select class="x_type" style="font-size:.78rem;max-width:12rem" title="${esc(IDX_TYPES.map(t => t[1]).join(" | "))}">
        ${IDX_TYPES.map(([v, lbl]) => `<option value="${v}" ${v === r.type ? "selected" : ""}>${esc(lbl.split(" &mdash; ")[0])}</option>`).join("")}
      </select>
      <input class="x_name" size="22" value="${esc(r.name)}" placeholder="index name" style="font-size:.76rem">
      <span class="w_details" style="flex-basis:100%;margin-left:1.4rem">${esc(r.reason || "")}${r.exists ? " <b>(already exists)</b>" : ""}</span>
    </label>`).join("");
  const card = stepCard(
    `${advised ? "" : `<div class="wrow w_details">No automatic index suggestions this time &mdash;
        every column is listed for you to choose. Where the built-in rules noticed something,
        it is quoted as a suggestion.</div>`}
     <div class="wrow x_rows" style="max-height:15rem;overflow:auto;display:flex;flex-direction:column;gap:.35rem">
       ${rows || `<span class="w_details">No index is worth building on this target &mdash; it is small, or every column is already covered.</span>`}
     </div>
     <div class="wrow" style="border:1px dashed var(--teal);border-radius:7px;padding:.5rem">
       <label style="font-variant:normal;letter-spacing:0">
         <input type="checkbox" class="x_tablecol" ${tc.suggested ? "checked" : ""} style="width:auto">
         Store the whole table column-wise (columnar storage)
       </label>
       <div class="w_details">${esc(tc.reason || "")}<br><code style="font-size:.74rem">${esc(tc.ddl || "")}</code></div>
     </div>
     ${existing.length ? `<div class="w_details wrow">Already on this table: ${existing.map(e => esc(e.index_name) + " (" + esc(e.index_type) + ")").join(", ")}</div>` : ""}
     <div class="wrow" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
       <button class="x_add" style="font-family:var(--font);font-weight:700;font-size:.74rem;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:7px;padding:.32rem .7rem;cursor:pointer" title="Index something the advisor did not propose - one column, or several for a composite">+ Add index</button>
       <button class="x_skip" style="font-family:var(--font);font-weight:700;font-size:.74rem;background:var(--card);color:var(--ink-soft);border:1.5px dashed var(--rule);border-radius:7px;padding:.32rem .7rem;cursor:pointer" title="Leave the target as it is">Skip &amp; finish</button>
     </div>
     <span class="x_msg" style="font-size:.76rem;color:var(--ink-soft);width:100%"></span>`,
    "Create indexes & finish", async c => {
      const picked = [...c.querySelectorAll(".x_pick:checked")].map(cb => {
        const row = cb.closest("label");
        const custom = row.querySelector(".x_cols");
        // "a, b" -> "a,b": the server splits a composite on commas
        const column = (custom ? custom.value : cb.value).split(",").map(x => x.trim()).filter(Boolean).join(",");
        return { column, type: row.querySelector(".x_type").value,
                 name: row.querySelector(".x_name").value.trim() };
      }).filter(p => p.type !== "none" && p.column);
      const blank = [...c.querySelectorAll(".x_pick:checked")].filter(cb => {
        const custom = cb.closest("label").querySelector(".x_cols");
        return custom && !custom.value.trim();
      });
      if (blank.length) { alert("Give the added index a column (or untick it)."); throw new Error("no column"); }
      const tableColumnar = c.querySelector(".x_tablecol").checked ? 1 : 0;
      if (!picked.length && !tableColumnar) { finishWizard(base, null); return; }
      const msg = c.querySelector(".x_msg");
      msg.classList.add("busyspin"); msg.textContent = "building indexes over the loaded rows";
      const res = await wpost("/index-apply", { baseName: base, tableColumnar, indexes: picked });
      msg.classList.remove("busyspin"); msg.textContent = "";
      finishWizard(base, res);
    });
  // "none" means build nothing, and columnar storage makes a per-column
  // columnar index redundant — both states are shown, not just enforced on save
  const suffix = t => ({ bitmap: "_bmi", bitslice: "_bsi", columnar: "_cmi" })[t] || "_idx";
  const sync = () => {
    const whole = card.querySelector(".x_tablecol").checked;
    card.querySelectorAll(".x_type").forEach(sel => {
      const row = sel.closest("label");
      const pick = row.querySelector(".x_pick");
      const nameIn = row.querySelector(".x_name");
      const none = sel.value === "none";
      const dup = whole && sel.value === "columnar";
      row.style.opacity = (none || dup) ? .5 : 1;
      pick.disabled = none || dup;
      nameIn.disabled = none;
      if (none) { pick.checked = false; }
      else if (!nameIn.value.trim()) {
        nameIn.value = (base + "_" + row.querySelector("code").textContent.trim() + suffix(sel.value)).slice(0, 60);
      }
    });
  };
  // "+ Add index": a row whose columns are typed in rather than fixed, so the
  // user can index anything — including a composite the advisor never considered
  const colNames = cols.map(c => c.column);
  card.querySelector(".x_add").onclick = e => {
    e.preventDefault();
    const list = card.querySelector(".x_rows");
    const row = el(`
      <label style="display:flex;gap:.4rem;align-items:center;width:100%;font-variant:normal;letter-spacing:0;flex-wrap:wrap">
        <input type="checkbox" class="x_pick" value="" checked style="width:auto">
        <input class="x_cols" list="x_collist" size="22" placeholder="column, or col_a, col_b" style="font-size:.78rem">
        <select class="x_type" style="font-size:.78rem;max-width:12rem">
          ${IDX_TYPES.filter(t => t[0] !== "none").map(([v, lbl]) => `<option value="${v}">${esc(lbl.split(" &mdash; ")[0])}</option>`).join("")}
        </select>
        <input class="x_name" size="22" placeholder="index name" style="font-size:.76rem">
        <span class="w_details" style="flex-basis:100%;margin-left:1.4rem">your own index &mdash; several columns, comma-separated, build a composite in that order</span>
      </label>`).firstElementChild;
    list.appendChild(row);
    // name follows the columns until the user types one
    const colsIn = row.querySelector(".x_cols"), nameIn = row.querySelector(".x_name"), typeIn = row.querySelector(".x_type");
    const autoName = () => {
      if (nameIn.dataset.touched) return;
      const first = colsIn.value.split(",")[0].trim().replace(/[^A-Za-z0-9_]/g, "_");
      nameIn.value = first ? (base + "_" + first + suffix(typeIn.value)).slice(0, 60) : "";
    };
    colsIn.oninput = autoName;
    typeIn.onchange = () => { autoName(); sync(); };
    sync();
    nameIn.oninput = () => nameIn.dataset.touched = "1";
    colsIn.focus();
  };
  // a datalist so the typed column names are picked, not guessed
  if (!$("x_collist")) {
    const dl = document.createElement("datalist");
    dl.id = "x_collist";
    dl.innerHTML = colNames.map(n => `<option value="${esc(n)}">`).join("");
    document.body.appendChild(dl);
  } else {
    $("x_collist").innerHTML = colNames.map(n => `<option value="${esc(n)}">`).join("");
  }

  card.querySelector(".x_tablecol").onchange = sync;
  card.querySelectorAll(".x_type").forEach(s => s.onchange = () => {
    // picking a real type is the user saying yes to that index
    const row = s.closest("label");
    if (s.value !== "none") row.querySelector(".x_pick").checked = true;
    sync();
  });
  sync();
  card.querySelector(".x_skip").onclick = e => {
    e.preventDefault();
    card.querySelectorAll("input,select,button").forEach(x => x.disabled = true);
    card.classList.add("locked");
    finishWizard(base, null);
  };
  wrecap(`Profiled <b>ETLW_TARGET.${esc(base)}</b> (${j.rowCount} row(s)). ` +
    (advised
      ? (recs.length ? `The advisor suggested <b>${recs.length}</b> index(es).` : "The advisor found nothing worth indexing.")
      : `No automatic suggestions this time &mdash; <b>${recs.length}</b> column(s) listed for you to choose.`));
}

/* ---------- UX-2 / BS-2: the terminal step is the RESULT ------------------
   Indexing used to run unconditionally at the end of the deploy handler, so
   the last thing anybody saw was one checkbox row per column - and, when the
   advisor did not answer, an orange warning. It is now an explicit optional
   action, invoking wizardStepIndexes() unchanged.

   Order on screen: results panel -> "Optimise (advanced)" offer -> closing
   before/after. If the user does take the optimise path, the closing panel is
   lifted out and re-rendered after it, so the flow still ends on the close. */
let closingCard = null;

function elapsedPhrase() {
  if (!wiz.startedMs) return "";
  const secs = (Date.now() - wiz.startedMs) / 1000;
  if (secs < 60) return Math.round(secs) + " seconds";
  if (secs < 5400) return Math.round(secs / 60) + " minutes";
  return (secs / 3600).toFixed(1) + " hours";
}

async function wizardStepResults(base, pk, wm) {
  const pid = $("pipeid").value;
  if (pid) await0(renderResultsPanel(pid));
  wguide("<b>Done.</b> The target is built, loaded and scheduled. The panel on the right " +
    "reads its figures straight from the database every time it draws &mdash; row count, how " +
    "current the data is, how the last run went, and how many rows were rejected rather " +
    "than silently dropped.", "results");
  const card = stepCard(
    `<div class="wrow w_details">The target can also be tuned for the queries you will run ` +
     `against it &mdash; index types per column, or columnar storage for the whole table. ` +
     `Optional, and it changes nothing about the data.</div>`,
    "Optimise this target (advanced)", async () => {
      if (closingCard) { closingCard.remove(); closingCard = null; }
      await wizardStepIndexes(base, pk, wm);
    });
  card.classList.add("techOnly");   // Executive view gets it as one recap line
  closeOutWizard(base);
}

function closeOutWizard(base) {
  renderClosingPanel(base, elapsedPhrase());
  closingCard = $("convo").lastElementChild;
}

// Closing recap — the ETL is complete either way; indexes are optional polish.
function finishWizard(base, res) {
  let line = "";
  if (res && (res.applied || []).length) {
    const names = res.applied.map(a => a.type === "table_columnar"
      ? "<b>columnar storage</b> on the whole table"
      : `<b>${esc(a.name)}</b> (${esc(a.type)})`);
    line = " Built " + names.join(", ") + ". " + esc(res.built || "");
    const bad = (res.failed || []).filter(f => f.error);
    if (bad.length) line += " Skipped: " + bad.map(f => esc(f.name) + " - " + esc(f.error)).join("; ") + ".";
  } else if (res) {
    line = " No index was built.";
  } else {
    line = " Indexes skipped.";
  }
  wrecap(
    `<b>ETL complete.</b>${line} <b>ETLW_TARGET.${esc(base)}</b> is loaded and the ` +
    `production hosts run it on the cadence you chose. Use the <b>Run</b> button for an ad-hoc run.`,
    "The target was also tuned for the queries you'll run against it.");
  $("runbanner").innerHTML = "Pipeline complete &middot; deployed, loaded and indexed.";
  // figures moved (indexes are built on the target), and the flow must still
  // end on the close rather than on the index grid
  if (resultsPid) await0(renderResultsPanel(resultsPid));
  closeOutWizard(base);
}

/* ---------- Strategy & deploy (how the SQL result is loaded) ---------- */
async function wizardStepStrategy() {
  // Scored recommendation from the deterministic rules engine (spec §9)
  let recs = [];
  try {
    const rec = await wpost("/recommend", {
      rowCount: wiz.rowCount || 0,
      hasPK: wiz.pk ? 1 : 0,
      hasReliableTimestamp: (wiz.wmCandidates || []).some(c => (c.dataType || "").startsWith("timestamp")) ? 1 : 0,
      historyPolicy: "latest_state", frequency: "daily", sourceType: wiz.mode || "jdbc"
    });
    recs = rec.recommendations || [];
  } catch (e) { /* advisory only */ }
  const top = recs[0];

  // The watermark must be a column of the SQL result: the delta filters etl_t.<col>.
  // Split columnDefs on top-level commas only — types like NUMERIC(19,6) carry a
  // comma inside the parens, which a naive split would surface as a bogus "6)".
  const cols = splitTopLevel(wiz.columnDefs || "").map(d => d.trim().split(/\s+/)[0]).filter(Boolean);
  const wmOpts = `<option value="">(none - recompute everything)</option>` +
    cols.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

  wguide("<b>How should it load?</b>" +
    (top ? ` The rules engine suggests <b>${esc(top.strategy)}</b> (score ${top.score})` +
           (top.reason ? ` &mdash; <i>${esc(top.reason)}</i>` : "") +
           (recs[1] ? `<br>Alternatives: ${recs.slice(1, 3).map(r => `${esc(r.strategy)} (${r.score})`).join(", ")}` : "")
         : "") +
    "<br><b>Merge/Upsert</b> keeps one row per key &middot; <b>Full reload</b> replaces the target " +
    "each run &middot; <b>Append-only</b> keeps adding rows (no primary key) &middot; " +
    "<b>Snapshot</b> writes a new dated table per run." +
    "<br>Set a <b>watermark</b> (a timestamp or increasing id in your result) to load only what " +
    "changed since the last run &mdash; that is the Incremental Timestamp / Numeric Watermark load. " +
    "The <b>call interval</b> is how often the production polls the source.", "strategy");

  const card = stepCard(
    `<label>Target base name <input class="s_base" size="14" value="${esc(wiz.etlName || (wiz.suggestBase ? wiz.suggestBase + "_v" : "result_v"))}"></label>
     <label>Primary key <input class="s_pk" size="14" placeholder="e.g. customer_id" value="${esc(wiz.pk || '')}">
        <span class="s_pkhint" style="font-size:.72rem;color: var(--teal-text);font-variant:normal;letter-spacing:0"></span></label>
     <label>Strategy <select class="s_strat">
        <option value="incremental">Merge/Upsert (needs PK)</option>
        <option value="full">Full reload</option>
        <option value="append">Append-only</option>
        <option value="snapshot">Snapshot (dated table per run)</option></select></label>
     <label title="A timestamp or increasing numeric column of the result. Loads only newer rows and remembers how far it got.">Watermark
        <select class="s_wm">${wmOpts}</select></label>
     ${scheduleHtml(300)}
`,
    "Deploy & run first load", async c => {
      const base = c.querySelector(".s_base").value.trim();
      const strategy = c.querySelector(".s_strat").value;
      wiz.cadence = scheduleSummary(c);
      const j = await wpost("/transform-deploy", Object.assign({
        baseName: base, sql: wiz.sql,
        pkColumns: c.querySelector(".s_pk").value.trim(),
        strategy,
        watermarkColumn: c.querySelector(".s_wm").value,
        pipelineName: wiz.pipelineName,
        sources: (wiz.tables || []).map(t => "ETLWIZARD." + t) }, readWhen(c)));
      // Keep the faithful preview as the FINAL flowchart (tables node included)
      // and enrich it with the deployed staging + production hosts, marking every
      // part deployed. We do NOT swap to the server graph, which omits the sources.
      wiz.deployed = true;
      wiz.targetBase = base;
      wizGraphActive = true;
      syncWizGraph();
      wizGraphActive = false;   // freeze the final picture
      graphFrozen = true;       // ignore late server node/edge events (no duplicates)
      snapshotGraph($("pipeid").value);   // save it exactly as drawn, for load-by-id
      const load = j.load || {};
      const n = load.rowsLoaded !== undefined ? load.rowsLoaded : "?";
      const prodOk = j.production && !String(j.production).startsWith("ERROR");
      {
        // What was achieved, in the values actually chosen - not a restatement
        // of the object names the platform created.
        let line = (n === "?") ? "<b>Live.</b> Target built and loaded"
                               : `<b>Live.</b> <b>${n}</b> rows loaded`;
        if (load.newWatermark) line += `, current to <b>${esc(fmtTsMin(String(load.newWatermark)))}</b>`;
        line += ".";
        if (prodOk) {
          const strat = STRATPHRASE[c.querySelector(".s_strat").value] || "refreshing on its schedule";
          line += `<br>An <b>Interoperability Production</b> now owns it &mdash; refreshing ` +
                  `<b>${esc(cadencePhrase(readWhen(c)))}</b>, ${strat}.`;
        }
        // the server's deploy string does not terminate itself, so the next
        // sentence used to run straight on from it
        const deployed = String(j.deploy || "").replace(/\s+$/, "");
        const stop = (deployed === "" || /[.!?]$/.test(deployed)) ? "" : ".";
        const techLine =
          `<b>Deployed and loaded.</b> ${esc(deployed)}${stop} First load moved <b>${n}</b> row(s) into ` +
          `<b>ETLW_TARGET.${esc(base)}</b>` +
          (load.newWatermark ? `; watermark set to <b>${esc(load.newWatermark)}</b> (next run loads only newer rows)` : "") +
          (prodOk
            ? `.<br>&#127981; Added to the shared production as <b>${esc(base)}_Extract &rarr; ${esc(base)}_Orchestrate &rarr; ${esc(base)}_Load</b>`
            : "") +
          `. The exact SQL is stored on the pipeline and re-runs with <b>no AI</b> (Run button / schedule).`;
        wrecap(techLine, line);
      }
      $("runbanner").innerHTML = "Pipeline deployed &middot; use the Run button for subsequent runs.";
      // UX-2: the flow ends on the RESULT, not on a grid of index checkboxes.
      // Indexing is unchanged and one click away.
      await wizardStepResults(base, c.querySelector(".s_pk").value.trim(), c.querySelector(".s_wm").value);
    });

  // Append-only accumulates rows, so a primary key would clash on the next run.
  // Snapshot writes its own dated table, so the PK is irrelevant there too.
  const strat = card.querySelector(".s_strat");
  const pkIn = card.querySelector(".s_pk");
  const baseIn = card.querySelector(".s_base");
  const wmSel = card.querySelector(".s_wm");
  const pkHintEl = card.querySelector(".s_pkhint");
  const syncPk = () => {
    const noPk = (strat.value === "append") || (strat.value === "snapshot");
    pkIn.disabled = noPk;
    if (noPk) {
      pkIn.value = ""; pkIn.placeholder = "not used for " + strat.value;
      if (pkHintEl) pkHintEl.textContent = "";
      return;
    }
    pkIn.placeholder = "e.g. customer_id";
    // Prefill only when the field is empty, so a key the user typed - or one
    // carried over from the transform step - is never overwritten by a guess.
    if (!pkIn.value.trim()) {
      const g = guessPk(cols);
      if (g) {
        pkIn.value = g;
        wiz.pk = g;
        if (pkHintEl) pkHintEl.textContent = "suggested - first identifier column in the result";
      }
    }
  };
  // Push the target/strategy choices into the live flowchart.
  const pushStrategy = () => {
    wiz.strategy = strat.value;
    wiz.watermark = wmSel.value;
    wiz.targetBase = baseIn.value.trim();
    wiz.pk = pkIn.disabled ? "" : pkIn.value.trim();
    wiz.cadence = scheduleSummary(card);
    syncWizGraph();
  };
  strat.onchange = () => { syncPk(); pushStrategy(); };
  wmSel.onchange = pushStrategy;
  baseIn.oninput = pushStrategy;
  pkIn.oninput = pushStrategy;
  wireSchedule(card, pushStrategy);
  syncPk();

  // Preselect whatever the rules engine recommended
  if (top) {
    const s = top.strategy.toLowerCase();
    if (s.indexOf("snapshot") >= 0) strat.value = "snapshot";
    else if (s.indexOf("append") >= 0) strat.value = "append";
    else if (s.indexOf("full") >= 0) strat.value = "full";
    else strat.value = "incremental";
    syncPk();
  }
  // Default the watermark to a timestamp-looking column if the result has one
  const guess = cols.find(c => /(updated|modified|created|changed|_at$|At$|date|time|stamp)/i.test(c));
  if (guess) wmSel.value = guess;

  // syncPk() below fills the key when the strategy needs one. If the transform
  // step already carried a key over on wiz.pk, that wins and syncPk leaves it.
  const pkHint = card.querySelector(".s_pkhint");
  if (pkHint && wiz.pk && wiz.pkReason && !pkIn.disabled) {
    pkHint.textContent = "suggested - " + wiz.pkReason;
  }
  pushStrategy();   // draw the target node with the initial strategy/watermark
}

/* ---------- Custom transform branch (multi-source join + SQL cleansing) ---------- */
async function offerTransformChoice() {
  let tables = [];
  try {
    // No ETL yet -> /mountable, the pipeline-free twin of /mounted. Same
    // payload, nothing pre-ticked. Browsing this tab must not create a pipeline.
    const url = wiz.etlRunId ? wapi("/mounted") : api("/mountable");
    const m = await (await fetch(url)).json();
    tables = m.foreignTables || [];
  } catch (e) { /* fall back to just the mounted one */ }
  if (!tables.length && wiz.localName) tables = [{ name: wiz.localName, own: 1, columns: [] }];

  wguide("<b>Which tables does this ETL use?</b> Give the ETL a <b>name</b> &mdash; it " +
    "identifies this ETL in the picker and the flowchart, and it is the base for the " +
    "staging and target tables and the production hosts it generates. Then tick every " +
    "table it draws on. Tick several and I will work out how they join. The first ticked " +
    "table is profiled below (columns, row count, watermark candidates). On the next step " +
    "you get the SQL for the load, which you can refine in plain words or edit by hand.", "tables", "picktables");

  const rows = tables.map(t =>
    `<label style="display:flex;gap:.4rem;align-items:center;width:100%;font-variant:normal;letter-spacing:0" title="${esc((t.columns || []).join(', '))}">
       <input type="checkbox" class="t_pick" value="${esc(t.name)}" ${(t.own || t.name === wiz.localName || (wiz.tables || []).indexOf(t.name) >= 0) ? "checked" : ""} style="width:auto">
       <code style="font-size:.8rem">ETLWIZARD.${esc(t.name)}</code>
       <span style="font-size:.72rem;color:var(--ink-soft)">${esc((t.columns || []).slice(0, 6).join(", "))}${(t.columns || []).length > 6 ? ", ..." : ""}</span>
     </label>`).join("");

  const card = stepCard(
    `<label style="width:100%">ETL name
       <input class="e_name" size="24" value="${esc(wiz.etlName || defaultEtlName())}"
              title="Identifies this ETL in the picker and flowchart; also the base for its staging/target tables and production hosts">
     </label>
     <div class="wrow" style="max-height:12rem;overflow:auto;display:flex;flex-direction:column;gap:.25rem">${rows || "<i>no foreign tables found</i>"}</div>
     <div class="w_details"></div>`,
    "Save", async c => {
      const picked = [...c.querySelectorAll(".t_pick:checked")].map(x => x.value);
      if (!picked.length) { alert("Tick at least one table."); throw new Error("no table"); }
      const name = sqlSafeName(c.querySelector(".e_name").value);
      if (!name) { alert("Give the ETL a name."); throw new Error("no name"); }
      // The pipeline already exists (created on the first tick so profiling had
      // a run); apply the final name to it before anything is derived from it.
      await renameEtl(name);
      wiz.tables = picked;
      if (picked.length === 1) wiz.localName = picked[0];
      wrecap(`ETL <b>${esc(name)}</b> &mdash; tables: ${picked.map(t => "<b>" + esc(t) + "</b>").join(", ")}.` +
        (picked.length > 1 ? " I will work out how they join." : ""));
      await wizardStepTransform();
    });

  // Profile the first ticked foreign table HERE (not at mount time): its columns,
  // row count and watermark candidates. Reads the mounted ETLWIZARD table directly,
  // so it works for tables mounted just now AND ones that already existed (Skip).
  // Feeds wiz.rowCount / wiz.wmCandidates / wiz.suggestBase to the strategy step.
  const details = card.querySelector(".w_details");
  const wmType = /^(timestamp|datetime|date|time|integer|int|bigint|smallint|tinyint|numeric|decimal|double|float|real)/;
  const profileFirst = async () => {
    const first = card.querySelector(".t_pick:checked");
    if (!first) { details.textContent = ""; return; }
    const t = first.value;
    wiz.suggestBase = t;
    details.textContent = "profiling ETLWIZARD." + t + "...";
    try {
      // first real action in this tab — now the ETL needs a pipeline of its own
      await ensureEtlSession();
      const prev = await wpost("/transform-preview", { sql: "SELECT * FROM ETLWIZARD." + t, maxRows: 3 });
      const parsed = splitTopLevel(prev.columnDefs || "").map(d => {
        const p = d.trim().split(/\s+/);
        return { column: p[0], dataType: (p[1] || "").toLowerCase() };
      }).filter(c => c.column);
      wiz.wmCandidates = parsed.filter(c => wmType.test(c.dataType));
      wiz.pk = "";   // foreign tables carry no PK metadata — the agent suggests it later
      let rowCount = 0;
      try {
        const rc = await wpost("/transform-preview", { sql: "SELECT COUNT(*) AS row_count FROM ETLWIZARD." + t, maxRows: 1 });
        rowCount = +((((rc.sample || {}).rows || [{}])[0] || {}).row_count || 0);
      } catch (e) { /* count is advisory */ }
      wiz.rowCount = rowCount;
      details.innerHTML = `<b>ETLWIZARD.${esc(t)}</b>: ${parsed.length} columns &middot; ~${rowCount} rows &middot; ` +
        `watermark candidates: ${esc(wiz.wmCandidates.map(x => x.column).join(", ") || "none")}`;
    } catch (e) {
      details.textContent = "could not profile ETLWIZARD." + t;
    }
  };
  // Live flowchart: reflect exactly the tables ticked right now, updating as the
  // user changes the selection (faithful to step 3).
  wizGraphActive = true;
  graphFrozen = false;
  wiz.deployed = false;   // authoring a (re)new pipeline preview
  const syncPicked = () => {
    wiz.tables = [...card.querySelectorAll(".t_pick:checked")].map(x => x.value);
    if (wiz.tables.length === 1) wiz.localName = wiz.tables[0];
    syncWizGraph();
  };
  card.querySelectorAll(".t_pick").forEach(cb => cb.onchange = () => { await0(profileFirst()); syncPicked(); });
  await0(profileFirst());
  syncPicked();
}

/// Starting point for a multi-table transform. The join keys are left blank on
/// purpose: the SQL agent only runs when the user prompts it (Generate SQL), so
/// this is a skeleton to edit by hand or to hand to the model.
function joinScaffold(tables) {
  const al = i => String.fromCharCode(97 + i);
  const cols = tables.map((t, i) => `${al(i)}.*`).join(", ");
  let sql = `SELECT ${cols}\nFROM ETLWIZARD.${tables[0]} ${al(0)}`;
  for (let i = 1; i < tables.length; i++) {
    sql += `\nJOIN ETLWIZARD.${tables[i]} ${al(i)} ON /* working out the key... */`;
  }
  return sql;
}

async function wizardStepTransform(prefillSql) {
  const picked = wiz.tables && wiz.tables.length ? wiz.tables : (wiz.localName ? [wiz.localName] : []);
  const first = picked[0] || "ext_table";
  const multi = picked.length > 1;
  const template = prefillSql ? prefillSql
    : (multi ? joinScaffold(picked)
    : `SELECT
    a.*                                                 -- start from every column
FROM ETLWIZARD.${first} a
-- cleansing:      UPPER(a.col), COALESCE(a.col,'n/a'), TRIM(a.col), CASE ...
-- derivation:     (a.x - a.y) AS margin
-- aggregation:    COUNT(*) AS n, SUM(a.amount) AS total  + GROUP BY
-- filtering:      WHERE a.status = 'paid'`);
  wguide("<b>The load SQL.</b> Tables in this ETL: " +
    (picked.length ? picked.map(t => `<code>ETLWIZARD.${esc(t)}</code>`).join(", ") : "<i>none selected</i>") +
    (multi ? "<br>The join keys are left blank &mdash; fill them in, or press <b>Generate SQL</b> and the model works them out." : "") +
    "<br>You can describe any transformation in plain words (cleansing, standardization, " +
    "derivation, aggregation, filtering) and the model rewrites the SQL, or edit it by hand. " +
    "<b>Preview</b> checks the columns and a sample; the target table is built to match. " +
    "Save it and the next step picks the load strategy and watermark.", "transform");
  const card = stepCard(
    `<div class="wrow" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;padding:.5rem;border:1px dashed var(--teal);border-radius:7px">
       <span style="font-variant:small-caps;letter-spacing:.1em;font-size:.72rem;color: var(--teal-text);width:100%">&#10024; describe the transformation in plain words &mdash; the local model writes the SQL</span>
       <input class="w_ai" style="flex:1;min-width:16rem" placeholder="e.g. total spent and order count per customer, only paid orders, names uppercase">
       <button class="w_gen" style="font-family:var(--font);font-weight:700;font-size:.76rem;background:var(--teal-fill);color:var(--on-teal);border:1.5px solid var(--teal-fill);border-radius:7px;padding:.35rem .85rem;cursor:pointer">Generate SQL</button>
       <span class="w_amsg" style="font-size:.76rem;color:var(--ink-soft);width:100%"></span>
     </div>
     <textarea class="w_tsql" spellcheck="false" style="width:100%;min-height:11rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;line-height:1.45;resize:vertical">${esc(template)}</textarea>
     <div class="wrow" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
       <button class="w_prev" style="font-family:var(--font);font-weight:700;font-size:.78rem;background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:7px;padding:.4rem .9rem;cursor:pointer;box-shadow:var(--shadow)">Preview</button>
       <span class="w_pmsg" style="font-size:.78rem;color:var(--ink-soft)"></span>
     </div>
     <div class="wrow w_pcols"></div>`,
    "Save SQL & continue", async c => {
      const sql = c.querySelector(".w_tsql").value.trim();
      if (!sql) { alert("Write or generate the SQL first."); throw new Error("empty"); }
      // resolve the real result columns now, so the next step can offer them
      const j = await wpost("/transform-preview", { sql, maxRows: 1 });
      wiz.sql = sql;
      wiz.columnDefs = j.columnDefs || "";
      syncWizGraph();   // transform node now shows what the SQL does + column count
      // names only: the types belong to the preview table above, and a wall of
      // "VARCHAR(4000), NUMERIC(19,6)" buries the answer to "what did I just build?"
      const names = pvwSplitDefs(wiz.columnDefs).map(c => c.name).join(", ");
      const savedTech = `Select Transformation saved &mdash; it compiles and produces: <b>${esc(names)}</b>.` +
        (j.note ? `<br>${esc(j.note)}` : "");
      wrecap(savedTech, savedTech);
      await wizardStepStrategy();
    });
  // --- NL -> SQL with the local model. The request returns immediately; the
  // --- generated SQL arrives on the event stream (sqlgen.result) and is
  // --- dropped into the editor. Prompt again to refine the current SQL.
  const aiInput = card.querySelector(".w_ai");
  const aiMsg = card.querySelector(".w_amsg");
  const genBtn = card.querySelector(".w_gen");
  sqlGenTarget = { textarea: card.querySelector(".w_tsql"), msg: aiMsg, btn: genBtn };
  const generate = async (explicitInstruction) => {
    const instruction = explicitInstruction || aiInput.value.trim();
    if (!instruction) return;
    // spinner + animated dots (CSS handles the trailing "..."; keep the text still)
    sqlGenBusy(true, "the model is writing the SQL (local model, this can take a minute)");
    if (!explicitInstruction) aiInput.value = "";
    try {
      const r = await fetch(wapi("/transform-generate"), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ instruction, currentSql: sqlGenTarget.textarea.value,
                               tables: (wiz.tables || []).join(",") })
      });
      const j = await r.json();
      // the finished SQL lands on the event stream (sqlgen.result), which clears
      // the spinner; only stop it here if the request itself was rejected.
      if (j.error) { sqlGenBusy(false); aiMsg.textContent = j.error; }
    } catch (e) { sqlGenBusy(false); aiMsg.textContent = String(e); }
  };
  card.querySelector(".w_gen").onclick = e => { e.preventDefault(); generate(); };
  aiInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); generate(); } });

  // Several tables picked: the model can discover the join keys, but it only
  // runs when the user asks it to. Entering this step used to fire a generate()
  // on its own, which spent a minute of local-model time before anyone had said
  // what they wanted. Pre-fill the prompt instead - one click, still the user's.
  if (multi) {
    aiInput.value = "Join these tables into one result and select all columns from each. " +
      "Work out the join keys yourself from the columns they have in common.";
  }

  card.querySelector(".w_prev").onclick = async () => {
    const sql = card.querySelector(".w_tsql").value.trim();
    card.querySelector(".w_pmsg").textContent = "previewing...";
    try {
      const j = await wpost("/transform-preview", { sql, maxRows: 5 });
      wiz.columnDefs = j.columnDefs || "";
      card.querySelector(".w_pmsg").textContent = j.note ? j.note : "columns OK";
      renderPreviewTable(card.querySelector(".w_pcols"), j);
    } catch (e) {
      card.querySelector(".w_pmsg").textContent = "preview failed (see alert)";
    }
  };
}

/* ---------- Event transport ----------
   Polling (GET /runs/:id/events?after=seq, spec §14.1 SSE fallback) is the
   RELIABLE path — it works even when the WebSocket upgrade is blocked by the
   web gateway. The WebSocket is an optional low-latency accelerator; both feed
   the same handler and are de-duplicated by monotonic seq. */
let pollTimer = null;

function feed(ev) {
  // apply only events newer than what we've seen (dedupes WS + poll overlap)
  if (typeof ev.seq === "number" && ev.seq <= lastSeq) return;
  applyEvent(ev);   // applyEvent bumps lastSeq
}

async function pollOnce() {
  if (!runId) return;
  try {
    const r = await fetch(api(`/runs/${runId}/events?after=${lastSeq}`));
    const j = await r.json();
    (j.events || []).forEach(feed);
  } catch (e) { /* transient; next tick retries */ }
}

function connect() {
  runId = $("runid").value.trim();
  if (!runId) return alert("runId required");
  // reliable transport: poll immediately, then every 1.2s
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollOnce, 1200);
  pollOnce();
  setStatus(`connected &middot; run ${runId}`);
  // best-effort WebSocket for instant push (silent if unavailable)
  try {
    if (ws) { ws.onclose = null; ws.onerror = null; ws.close(); }
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/etlwizard/ETLWizard.WS.Hub.cls`);
    ws.onopen = () => { setStatus(`connected &middot; run ${runId} &middot; live`); ws.send(JSON.stringify({ runId, lastSeq })); };
    ws.onmessage = m => {
      const ev = JSON.parse(m.data);
      if (ev.type === "subscribed" || ev.type === "error") return logEvent({ seq: "-", ...ev });
      feed(ev);
    };
    ws.onclose = () => {};   // polling covers it — no noisy reconnect loop
    ws.onerror = () => {};
  } catch (e) { /* WS unsupported; polling handles everything */ }
}

/* ---------- Header controls ---------- */
// The picker is the single source of truth for "which pipeline"; the hidden
// pipeid/runid fields the wizard already writes to stay in step with it.
function selectedPipeline() {
  const v = $("pipelist").value;
  return v ? v : "";
}
function syncPipeButtons() {
  const has = !!selectedPipeline();
  ["loadchart", "delpipe", "runpipe"].forEach(id => $(id).disabled = !has);
}
async function refreshPipelines(selectId) {
  const sel = $("pipelist");
  // undefined = keep whatever is selected; "" = start blank again
  const keep = selectId !== undefined ? selectId : sel.value;
  try {
    const j = await (await fetch(api("/pipelines"))).json();
    const list = j.pipelines || [];
    // nothing is chosen until the user chooses: the placeholder carries no id,
    // which is also what keeps the three buttons greyed out
    sel.innerHTML = `<option value="">${list.length ? "&mdash; select a pipeline &mdash;" : "no pipelines yet"}</option>` +
      list.map(p => `<option value="${esc(p.id)}">${esc(p.name)} &middot; ${esc(p.status)}${p.deployed ? "" : " (draft)"}</option>`).join("");
    sel.value = (keep && list.some(p => String(p.id) === String(keep))) ? keep : "";
  } catch (e) {
    sel.innerHTML = `<option value="">could not load pipelines</option>`;
  }
  $("pipeid").value = selectedPipeline();
  syncPipeButtons();
}
$("pipelist").onchange = () => { $("pipeid").value = selectedPipeline(); syncPipeButtons(); };

// Second picker: the tables the wizard built. Deleting a pipeline leaves its
// data behind on purpose, so this is how the data itself gets cleaned up.
async function refreshTables(keepValue) {

async function refreshMcpTools(keepValue) {

  try {
    const j = await (await fetch(api("/mcp/published"))).json();

                      Object.keys(t.parameters.properties).length)

        return `<option value="${esc(t.name)}">${esc(t.name)}${tbl}${args}</option>`;

// Wipe everything. Two confirms on purpose: the first says what will go, the
// second is the "yes, really" — this drops tables, not just definitions.
$("clearall").onclick = async () => {
  const pipes = [...$("pipelist").options].filter(o => o.value).length;
  const tables = [...$("tablelist").options].filter(o => o.value).length;
  if (!pipes && !tables) return alert("Nothing to clear.");
  if (!confirm(`Clear all?\n\n${pipes} pipeline(s) and ${tables} table(s) will be deleted:\n` +
               `  - pipeline definitions, runs, event history and production items\n` +
               `  - landing / staging / target tables AND their rows\n` +
               `  - foreign tables and linked views (remote sources keep their data)\n\n` +
               `SQL Gateway connections, foreign servers and the sample-data feed are kept.`)) return;
  if (!confirm("This cannot be undone. Delete everything?")) return;
  const btn = $("clearall");
  btn.disabled = true; setStatus("clearing&hellip;");
  try {
    const j = await (await fetch(api("/clear-all"), { method: "POST" })).json();
    if (j.error) { alert(j.error); return; }
    nodes.clear(); edges.length = 0; renderGraph();
    $("runhistory").innerHTML = ""; $("events").innerHTML = ""; $("convo").innerHTML = "";
    $("runid").value = ""; $("pipeid").value = "";
    $("runbanner").innerHTML = `Cleared <b>${j.pipelines}</b> pipeline(s), <b>${j.runs}</b> run(s) ` +
      `and <b>${j.tablesDropped}</b> table(s)` +
      ((j.failed || []).length ? ` &middot; ${j.failed.length} could not be dropped` : "") +
      (j.mcpCleared ? " &middot; MCP tools unpublished" : "") +
      (j.kgCleared ? ` &middot; ${j.kgCleared} knowledge base(s) deleted` : "");
    await refreshPipelines("");
    await refreshTables("");
    await refreshMcpTools("");
    await kgRefreshPresenter("");
    // both tabs' sessions referred to pipelines that no longer exist
    wiz.sourcesRunId = null; wiz.etlRunId = null;
    resetTab("sources"); resetTab("etl"); resetTab("mcp"); resetTab("kg");
    activeTab = null; showTab("sources");
    // A full wipe is the one moment where reloading costs nothing and settles
    // everything: in-memory wizard state, cached panes, and - the reason this
    // is here - the JavaScript itself, which a long-open tab may have been
    // holding from before the last change.
    setTimeout(() => location.reload(), 1200);

    btn.disabled = false; setStatus("disconnected");
  }
};
