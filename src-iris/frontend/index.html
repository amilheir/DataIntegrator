/* ---- Presenter tools menu ----------------------------------------------
   A menu with flyouts, built on the pickers above rather than beside them:
   each submenu is read from its <select> the moment it opens, so it is never
   staler than the picker, and choosing an entry selects that option and
   clicks the real button. Every confirm() and refresh is the original one. */
function ptClose() {
  const menu = $("ptMenu");
  if (!menu || menu.hidden) return;
  menu.hidden = true;
  $("ptBtn").setAttribute("aria-expanded", "false");
  menu.querySelectorAll(".ptOpen").forEach(el => el.classList.remove("ptOpen"));
}
function ptOpen() {
  const menu = $("ptMenu");
  menu.hidden = false;
  $("ptBtn").setAttribute("aria-expanded", "true");
  menu.querySelectorAll(":scope > .ptItem[data-sel]").forEach(ptFill);
}
function ptFill(item) {
  const sub = item.querySelector(".ptSub");
  const opts = [...$(item.dataset.sel).options].filter(o => o.value);
  const attr = s => esc(s).replace(/"/g, "&quot;");
  sub.innerHTML = opts.length
    ? opts.map(o => `<div class="ptItem" role="menuitem" tabindex="-1" data-value="${attr(o.value)}" title="${attr(o.textContent)}">${esc(o.textContent)}</div>`).join("")
    : `<div class="ptEmpty">${esc(item.dataset.empty)}</div>`;
}
function ptRun(item, value) {
  const btn = $(item.dataset.btn);
  ptClose();
  if (value === undefined) { btn.click(); return; }
  const sel = $(item.dataset.sel);
  // the pipeline picker is also the main toolbar's selection; put it back
  // afterwards so a cancelled delete does not change what is on screen
  const prev = sel.value;
  sel.value = value;
  sel.onchange && sel.onchange();
  btn.click();             // confirm() runs synchronously inside the click
  if (sel.id === "pipelist" && [...sel.options].some(o => o.value === prev)) {
    sel.value = prev;
    sel.onchange && sel.onchange();
  }
}
$("ptBtn").onclick = e => { e.stopPropagation(); $("ptMenu").hidden ? ptOpen() : ptClose(); };
$("ptMenu").addEventListener("click", e => {
  e.stopPropagation();
  const leaf = e.target.closest(".ptSub .ptItem");
  if (leaf) return ptRun(leaf.closest(".ptSub").parentElement, leaf.dataset.value);
  const top = e.target.closest("#ptMenu > .ptItem");
  if (!top) return;
  if (!top.dataset.sel) return ptRun(top);
  // touch / click: toggle the flyout, since there is no hover to open it
  const was = top.classList.contains("ptOpen");
  $("ptMenu").querySelectorAll(".ptOpen").forEach(el => el.classList.remove("ptOpen"));
  if (!was) top.classList.add("ptOpen");
});
// hovering a row closes whichever flyout a click left pinned open elsewhere
$("ptMenu").addEventListener("mouseover", e => {
  const top = e.target.closest("#ptMenu > .ptItem");
  if (top) $("ptMenu").querySelectorAll(".ptOpen").forEach(el => el !== top && el.classList.remove("ptOpen"));
});
document.addEventListener("click", ptClose);
document.addEventListener("keydown", e => { if (e.key === "Escape") ptClose(); });

/* ================= Results panel (UX-3 / DM-1) =========================
   The outcome surface: how much, how fresh, did it work, what does it say.

   Every figure is read live from GET /pipeline/:id (row count, watermark,
   quarantine count and the top rows of the target come back on that response)
   and GET /pipeline/:id/runs. NOTHING here is hardcoded, and a field that
   cannot be read is omitted rather than filled with a placeholder that could
   be mistaken for a real number.
*/
let resultsPid = null;          // pipeline the panel is currently showing

// The instance clock is UTC (see the schedule control). Parse the IRIS
// %TimeStamp "YYYY-MM-DD HH:MM:SS.mmm" as UTC rather than as browser-local,
// or every relative phrase is wrong by the presenter's timezone offset.
function tsMs(s) {
  if (!s) return NaN;
  return Date.parse(String(s).trim().replace(" ", "T") + "Z");
}
function relPhrase(s) {
  const ms = tsMs(s);
  if (isNaN(ms)) return "";
  let d = (Date.now() - ms) / 1000;
  const ago = d >= 0;
  d = Math.abs(d);
  const n = d < 60 ? "moments" :
            d < 3600 ? Math.round(d / 60) + " minute" + (Math.round(d / 60) === 1 ? "" : "s") :
            d < 86400 ? Math.round(d / 3600) + " hour" + (Math.round(d / 3600) === 1 ? "" : "s") :
            Math.round(d / 86400) + " day" + (Math.round(d / 86400) === 1 ? "" : "s");
  return n === "moments" ? "moments ago" : (ago ? n + " ago" : "in " + n);
}
/* An elapsed number of seconds, said the way a person reads it. Sub-second
   matters here: a small pipeline finishes in tens of milliseconds, and "0.0s"
   would read as "did not run". */
function secsPhrase(secs) {
  const n = Number(secs);
  if (!isFinite(n) || n < 0) return "";
  if (n < 1) return `${Math.round(n * 1000)} ms`;
  if (n < 90) return `${n.toFixed(n < 10 ? 2 : 1)} s`;
  return `${Math.floor(n / 60)}m ${Math.round(n % 60)}s`;
}

function durPhrase(a, b) {
  const s = tsMs(a), e = tsMs(b);
  if (isNaN(s) || isNaN(e) || e < s) return "";
  const secs = (e - s) / 1000;
  return secs < 90 ? `${secs.toFixed(secs < 10 ? 1 : 0)}s` : `${Math.round(secs / 60)}m`;
}
function num(n) { return (n === undefined || n === null || n === "") ? "" : Number(n).toLocaleString("en-GB"); }
// status by shape AND colour - never colour alone
const RUN_MARK = { succeeded: ["&#9679;", "rpok"], failed: ["&#10006;", "rpbad"],
                   warning: ["&#9650;", "rpwarn"], running: ["&#9673;", "rprun"],
                   cancelled: ["&#9711;", "rpwarn"] };
function runMark(status) { return RUN_MARK[String(status || "").toLowerCase()] || ["&#9711;", ""]; }

function rerenderResults() { if (resultsPid) await0(renderResultsPanel(resultsPid)); }

async function renderResultsPanel(pid) {
  if (!pid) return;
  resultsPid = pid;
  const box = $("results");
  let p;
  try { p = await (await fetch(api(`/pipeline/${pid}`))).json(); } catch (e) { return; }
  if (!p || p.error) { box.innerHTML = ""; return; }
  let runs = [], prod = null;
  try { const j = await (await fetch(api(`/pipeline/${pid}/runs`))).json(); runs = j.runs || []; } catch (e) { /* omit */ }
  try { const j = await (await fetch(api(`/pipeline/${pid}/production`))).json(); if (!j.error) prod = j; } catch (e) { /* omit */ }

  const t = p.target || {}, wm = p.watermark || null, last = runs[0];
  const figs = [];
  if (t.rowCount !== undefined) {
    figs.push(`<div class="rpfig"><div class="k">Rows in target</div><div class="v">${num(t.rowCount)}</div>` +
      `<div class="s">${esc(t.table || "")}</div></div>`);
  }
  /* How long one pass through the production takes, end to end: the Extract
     service creating the session's first message to the Load operation
     finishing. This is the figure a presenter is asked about ("and how long
     does that take?"), which is why it takes the prominent slot; the watermark
     freshness it replaced is kept as the caption rather than dropped.

     Falls back to the old freshness figure when the pipeline has never run
     through a production - there is no measured duration to show, and an
     empty tile in its place would read as a failure. */
  const fresh = wm && (wm.lastValue || wm.updatedAt);
  const freshShown = fresh
    ? (wm.type === "timestamp" && wm.lastValue ? wm.lastValue : (wm.updatedAt || wm.lastValue))
    : null;
  const ig = p.integration || null;
  if (ig) {
    const avg = ig.sampled > 1
      ? ` &middot; ${esc(secsPhrase(ig.averageSeconds))} average of ${ig.sampled}` : "";
    const asOf = freshShown ? ` &middot; data as of ${esc(fmtTs(String(freshShown)))}` : "";
    figs.push(`<div class="rpfig" title="Measured from the Extract service creating the first message ` +
      `of session ${esc(String(ig.sessionId))} to the Load operation finishing the last one">` +
      `<div class="k">Integration time</div>` +
      `<div class="v" style="font-size:1.05rem">${esc(secsPhrase(ig.seconds))}</div>` +
      `<div class="s">extract &rarr; load${avg}${asOf}</div></div>`);
  } else if (fresh) {
    const rel = relPhrase(freshShown);
    figs.push(`<div class="rpfig"><div class="k">Data current as of</div>` +
      `<div class="v" style="font-size:1.05rem">${esc(fmtTs(String(freshShown)))}</div>` +
      `<div class="s">${rel ? esc(rel) + " &middot; " : ""}watermark on ${esc(wm.column || "")} (UTC)</div></div>`);
  }
  if (last) {
    const [mark, cls] = runMark(last.status);
    const d = durPhrase(last.startedAt, last.finishedAt);
    figs.push(`<div class="rpfig"><div class="k">Last run</div>` +
      `<div class="v" style="font-size:1.05rem"><span class="rpdot ${cls}">${mark}</span>${esc(last.status)}</div>` +
      `<div class="s">${d ? "took " + esc(d) + " &middot; " : ""}${esc(relPhrase(last.startedAt))}</div></div>`);
  }
  // A visible 0 is a stronger governance statement than an absent field - but
  // only when a quarantine table actually exists to have counted.
  if (t.quarantineRows !== undefined) {
    figs.push(`<div class="rpfig"><div class="k">Rejected</div><div class="v">${num(t.quarantineRows)}</div>` +
      `<div class="s">isolated, not dropped</div></div>`);
  }

  const recent = runs.slice(0, 7).reverse();
  const okCount = recent.filter(r => r.status === "succeeded").length;
  const strip = recent.length
    ? `<div class="rpstrip"><b style="font-variant:small-caps;letter-spacing:.12em">Recent runs</b> ` +
      `<span class="b">${recent.map(r => { const [m, c] = runMark(r.status);
        return `<span class="${c}" title="run ${esc(r.id)} &middot; ${esc(r.status)}">${m}</span>`; }).join(" ")}</span>` +
      ` &nbsp; ${okCount} of ${recent.length} succeeded</div>`
    : "";

  // The business result itself, not only counts. Executive view leads with the
  // headline figures, so the sample sits below them either way; in Technical
  // view it stays expanded because that is the detail an engineer wants.
  let table = "";
  if (t.sample && t.sample.rows && t.sample.rows.length) {
    const cols = t.sample.columns || [];
    table = `<div class="rptable"><table><thead><tr>` +
      cols.map(c => `<th>${esc(c)}</th>`).join("") + `</tr></thead><tbody>` +
      t.sample.rows.map(r => `<tr>${r.map(v => `<td>${esc(fmtTs(v))}</td>`).join("")}</tr>`).join("") +
      `</tbody></table></div>`;
  }

  const running = prod && (prod.actuallyRunning || prod.status === "running");
  const sched = prod
    ? `<span class="rpsched"><span class="rpdot ${running ? "rpok" : ""}">${running ? "&#9679;" : "&#9711;"}</span>` +
      `production ${running ? "running" : "stopped"}${prod.config && prod.config.summary ? " &middot; " + esc(prod.config.summary) : ""}</span>`
    : "";

  box.innerHTML =
    `<div class="rp">
       <div class="rphead">
         <div class="rptitle">${esc(p.name || "")}<small>pipeline result</small></div>
         ${sched}
       </div>
       <div class="rpfigs">${figs.join("") || `<div class="rpfig"><div class="s">This pipeline has not produced a target yet.</div></div>`}</div>
       ${strip}
       ${table}
       <div class="rpact">
         <button class="rpdocs" title="Generate the pipeline document: metadata, watermark, production class and every artifact with its exact DDL">Download documentation</button>
         <button class="rprefresh" title="Re-read every figure from the database">Refresh</button>
       </div>
     </div>`;

      // The page is served as ISO-8859-1; the document is plain markdown, so
      // hand it over as a Blob rather than as a data: URL.
      const url = URL.createObjectURL(new Blob([j.markdown || ""], { type: "text/markdown" }));

    } catch (err) {
      wfail("The documentation could not be generated.", String(err && err.message || err));
      btn.textContent = "Download documentation";
    } finally {
      btn.disabled = false;
    }
  };
}

/* ======================= tabs ==========================================
   Two workflows that no longer share a pipeline:

   Data Sources  - standing configuration. Connections and mounted tables are
                   global IRIS objects, so this tab has no ETL of its own and
                   no flowchart. Its mounts are recorded against one reusable
                   hidden pipeline (see /sources/session) purely because the
                   mount endpoints need a run to hang events on.
   ETL Interop   - builds one ETL from tables that already exist. Creates the
                   pipeline lazily, on the first real action, so simply
                   clicking the tab does not litter the picker with empty ETLs.
*/
let activeTab = null;

/* Each tab keeps its DOM. Detaching nodes from #convo does not destroy them or
   their listeners, so a half-filled form card comes back exactly as it was
   left — switching tabs to check something must never discard work in
   progress. paneCache[tab] holds the detached nodes; empty means "never
   rendered", which is the only time a tab builds itself from scratch. */
const paneCache = { sources: null, etl: null, ml: null, mcp: null, kg: null };

/* The right-hand chart is per-tab too, and the two show different things:
     ETL Interop  - the LIVE graph of the ETL being built, driven by the
                    nodes/edges globals as the wizard advances.
     Data Sources - a VIEWER for a saved pipeline, loaded by the Flowchart
                    button.
   loadPipelineChart() clears nodes/edges and freezes the graph, so without
   snapshotting the authoring state, viewing a saved pipeline would wipe the
   ETL you are in the middle of building. */
const chartCache = { sources: null, etl: null, ml: null, mcp: null, kg: null };

function saveChart(tab) {
  const snap = {
    flow: $("flow").innerHTML,
    banner: $("runbanner").innerHTML,
    history: $("runhistory").innerHTML,
    // the results panel is per-tab like everything else in the right column;
    // keep the pipeline id, not the markup, so it re-reads live figures
    resultsPid: resultsPid
  };
  // the ETL tab's chart is generated, not static: keep the model, not the HTML
  if (tab === "etl") {
    snap.graph = { nodes: new Map(nodes), edges: edges.slice(),
                   active: wizGraphActive, frozen: graphFrozen };
  }
  chartCache[tab] = snap;
}

function restoreChart(tab) {
  const snap = chartCache[tab];
  $("charttitle").innerHTML =
    tab === "etl" ? "Pipeline flowchart <small>&middot; the logic you are building</small>"
    : tab === "ml" ? "Model flowchart <small>&middot; derived from INFORMATION_SCHEMA</small>"
    : tab === "mcp" ? "Published tools <small>&middot; what an MCP client can call</small>"
    : tab === "kg" ? "Knowledge graph <small>&middot; entities mined from the text</small>"
    : "Pipeline flowchart <small>&middot; a saved pipeline</small>";
  if (!snap) {
    $("flow").innerHTML = ""; $("runbanner").innerHTML = ""; $("runhistory").innerHTML = "";
    $("results").innerHTML = ""; resultsPid = null;
    if (tab === "sources") {
      $("runbanner").innerHTML =
        "Pick a pipeline above and press <b>Flowchart</b> to view it here.";
    } else if (tab === "ml") {
      $("runbanner").innerHTML =
        "Create or pick a model to see its flowchart here.";
    } else if (tab === "mcp") {
      $("runbanner").innerHTML =
        "Publish a table to see the tools it exposes here.";
    } else if (tab === "kg") {
      $("runbanner").innerHTML =
        "Embed a text column to see its knowledge graph here.";
    } else {
      renderGraph();
    }
    return;
  }
  $("runbanner").innerHTML = snap.banner;
  $("runhistory").innerHTML = snap.history;
  $("results").innerHTML = ""; resultsPid = snap.resultsPid || null;
  if (resultsPid) await0(renderResultsPanel(resultsPid));
  if (tab === "etl" && snap.graph) {
    // rebuild from the model so later live events keep working
    nodes.clear(); snap.graph.nodes.forEach((v, k) => nodes.set(k, v));
    edges.length = 0; snap.graph.edges.forEach(e => edges.push(e));
    wizGraphActive = snap.graph.active; graphFrozen = snap.graph.frozen;
    renderGraph();
  } else {
    $("flow").innerHTML = snap.flow;
  }
}

function showTab(name) {
  if (activeTab === name) return;
  // The right pane carries a title, a results panel, a run history and an event
  // log - all of which describe a pipeline RUN. The Knowledge Base pane shows a
  // graph instead, so on that tab they are permanently empty boxes that still
  // take their margins. One class turns the pane over to the graph.
  $("right").classList.toggle("kgmode", name === "kg");
  if (name !== "kg") {
    document.body.classList.remove("kgchat");
    const lg = $("kglegend");
    if (lg) lg.innerHTML = "";
  }
  const convo = $("convo");
  if (activeTab) { paneCache[activeTab] = Array.from(convo.childNodes); saveChart(activeTab); }
  activeTab = name;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === name));
  // Each tab drives its own run. Without this, an action taken after switching
  // back would post to whichever run the OTHER tab last opened.
  // ML addresses models by name and needs no run of its own.
  const owned = name === "sources" ? wiz.sourcesRunId : name === "etl" ? wiz.etlRunId : "";
  if (owned) { runId = owned; $("runid").value = owned; }
  restoreChart(name);
  convo.replaceChildren();
  if (paneCache[name] && paneCache[name].length) {
    convo.append(...paneCache[name]);
    scrollConvo();
  } else if (name === "sources") {
    renderSourcesTab();
  } else if (name === "ml") {
    renderMlTab();
  } else if (name === "mcp") {
    renderMcpTab();
  } else if (name === "kg") {
    renderKgTab();
  } else {
    renderEtlTab();
  }
}
// Discard a tab's kept DOM so it rebuilds on next show (after Clear all, or
// when "Add more..." deliberately restarts the Data Sources flow).
function resetTab(name) { paneCache[name] = null; }
document.querySelectorAll(".tab").forEach(t => { t.onclick = () => showTab(t.dataset.tab); });

// The sources the user can pick from are the connections IRIS already holds
// (JDBC + ODBC in %Library.sys_SQLConnection) plus the CSV dropzone.
function configuredSources() {
  const out = [];
  // · rather than a literal middot: this file is served as ISO-8859-1, so
  // raw UTF-8 punctuation reaches the browser as mojibake ("A-hat middot")
  // plain ASCII separator on purpose: this file is served as ISO-8859-1, so a
  // literal UTF-8 middot here reaches the browser as mojibake
  const SEP = " - ";
  // Foreign servers, NOT connections: /discover reads a server, and a server's
  // name has nothing to do with the connection it wraps. Listing connections
  // here is what produced "Foreign server 'ETLWIZARD.pg_crm_connection' not
  // found" - that name is a connection, and no server of that name exists.
  (OPT.foreignServers || []).forEach(s => out.push({
    id: "fs:" + s.name, mode: s.mode, server: s.name, conn: s.via,
    label: s.name + SEP + s.mode.toUpperCase() + (s.via ? SEP + s.via : "")
  }));
  // ODBC linked tables bypass foreign servers entirely - they go straight
  // through the gateway connection, so those are listed as-is.
  (OPT.odbcConnections || []).forEach(c => out.push({
    id: "odbc:" + c.name, label: c.name + SEP + "ODBC", mode: "odbc", server: "", conn: c.name
  }));
  return out;
}

    null);

        (pick.mode === "csv" ? "file(s)." : "table(s)."));

/* ---- ML Models ---------------------------------------------------------
   IntegratedML CREATE / TRAIN / VALIDATE, with a PREDICT preview. Nothing is
   stored by us: the model list, status, metrics and the flowchart are all read
   back from INFORMATION_SCHEMA.ML_* on demand (see ml-models-tab-plan.md).

   Two shapes of the engine drive this whole tab:

   * PREDICTING takes exactly ONE column. "PREDICTING (a, b)" is a parse error
     and AutoML's train() is singular (label_column). Predicting several columns
     therefore means several models, one per column, named <base>_<column>.

   * Everything adjustable is a USING clause - a JSON object on CREATE (stored
     as the model definition's defaults) and/or on TRAIN (that run only). The
     builders below write that JSON rather than making the user type it, with a
     raw box underneath for anything not covered. */
const ML = {};                       // the model(s) being worked on, and their table

// USING parameters, straight from the AutoML documentation. Kept as data so the
// form, the tooltips and the JSON all come from one place and cannot drift.
const ML_TRAIN_PARAMS = [
  { key: "seed", label: "seed", type: "number", placeholder: "None",
    hint: "Seed for the random number generator - set it for reproducible runs." },
  { key: "verbosity", label: "verbosity", type: "select", options: ["", "0", "1", "2"],
    hint: "How much output the run writes to ML_TRAINING_RUNS. 0 minimal, 1 moderate, 2 full (default)." },
  { key: "TrainMode", label: "TrainMode", type: "select", options: ["", "SCORE", "BALANCE", "TIME"],
    hint: "Model selection metric for classification. SCORE ignores training time (default), TIME favours fast models, BALANCE weighs both." },
  { key: "MaxTime", label: "MaxTime", type: "number", placeholder: "14400",
    hint: "Minutes allotted for starting training runs. Only applies when TrainMode is TIME." },
  { key: "MinimumDesiredScore", label: "MinimumDesiredScore", type: "number", placeholder: "0",
    hint: "Lowest acceptable score, 0 to 1. Only applies when TrainMode is TIME." }
];

// Time-series-only USING parameters. backward is listed because the clause
// accepts it, with the documentation's own caveat that AutoML ignores it.
const ML_TS_PARAMS = [
  { key: "forward", label: "forward", type: "number", placeholder: "e.g. 7",
    hint: "How many timesteps ahead to predict. Rows appear after the latest date in the data." },
  { key: "backward", label: "backward", type: "number", placeholder: "e.g. 7",
    hint: "How many timesteps before the earliest date to predict. The AutoML provider ignores this." },
  { key: "frequency", label: "frequency", type: "text", placeholder: "e.g. 1d",
    hint: "Size and unit of a timestep: a number then y/m/w/d/h/t/s (t = minute). Defaults to the most common gap in the data." }
];

async function mlPost(path, payload) {
  const r = await fetch(api("/ml/" + path), {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload || {})
  });
  const text = await r.text();
  // EH-1: inline, non-blocking. A native alert() here once stalled an entire
  // training batch behind a dialog nobody was watching (ml-models-tab-plan 11).
  if (!text.trim()) {
    const why = `The server returned an empty response (HTTP ${r.status}).`;
    wfail(why, `/ml/${path} -> HTTP ${r.status}, empty body`); throw new Error(why);
  }
  let j;
  try { j = JSON.parse(text); }
  catch (e) {
    const why = `The server answered with something that is not JSON (HTTP ${r.status}).`;
    wfail(why, text.slice(0, 600)); throw new Error(why);
  }
  if (j.error) {
    wfail(j.error, j.detail ? `${j.detail}\n\n/ml/${path} -> HTTP ${r.status}` : `/ml/${path} -> HTTP ${r.status}`);
    throw new Error(j.error);
  }
  return j;
}

// Render one group of USING fields. `scope` namespaces the classes so a card can
// carry more than one group without their inputs colliding.
function mlUsingFields(params, scope) {
  return params.map(p => {
    const cls = `u_${scope}_${p.key}`;
    const input = p.type === "select"
      ? `<select class="${cls}" data-key="${p.key}">` +
        p.options.map(o => `<option value="${esc(o)}">${o === "" ? "(default)" : esc(o)}</option>`).join("") +
        `</select>`
      : `<input class="${cls}" data-key="${p.key}" size="8" placeholder="${esc(p.placeholder || "")}">`;
    return `<label title="${esc(p.hint)}">${esc(p.label)} ${input}</label>`;
  }).join("");
}

// Collect one group of USING fields into a plain object, skipping blanks so an
// untouched form produces {} and the DDL stays clean.
function mlReadUsing(card, params, scope) {
  const out = {};
  params.forEach(p => {
    const el = card.querySelector(`.u_${scope}_${p.key}`);
    if (!el) return;
    const v = String(el.value || "").trim();
    if (v === "") return;
    out[p.key] = p.type === "number" && v !== "" && !isNaN(v) ? Number(v) : v;
  });
  return out;
}

// The free-text escape hatch: anything the guided fields do not cover. Invalid
// JSON is a hard stop rather than something silently dropped.
function mlReadRawUsing(card, scope) {
  const el = card.querySelector(`.u_raw_${scope}`);
  if (!el) return {};
  const text = String(el.value || "").trim();
  if (!text) return {};
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { alert("The extra USING JSON is not valid JSON: " + e.message); throw e; }
  if (typeof parsed !== "object" || Array.isArray(parsed) || parsed === null) {
    const why = "The extra USING JSON must be an object, e.g. {\"seed\": 3}";
    alert(why); throw new Error(why);
  }
  return parsed;
}

function mlRawUsingField(scope, label) {
  return `<label style="width:100%">${esc(label)}
    <textarea class="u_raw_${scope}" rows="2" placeholder='{"seed": 3}'
      style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:.74rem"></textarea></label>`;
}

// Show the clause that will actually be sent, so USING is never a black box.
function mlUsingPreview(using) {
  const keys = Object.keys(using || {});
  if (!keys.length) return "<i>no USING clause</i>";
  return `<code>USING ${esc(JSON.stringify(using))}</code>`;
}

// Redraw the right-hand chart from the derived graph, reusing renderGraph() by
// loading the model's nodes/edges into the same globals the ETL chart uses.
async function mlDrawGraph(name) {
  try {
    const g = await mlPost("graph", { name });
    nodes.clear(); edges.length = 0;
    (g.nodes || []).forEach(n => nodes.set(n.id, {
      nodeId: n.id, name: n.name, kind: n.kind, status: n.status,
      detail: n.detail || "", order: n.order
    }));
    (g.edges || []).forEach(e => edges.push(e));
    graphFrozen = true; wizGraphActive = false;
    renderGraph();
    $("runbanner").innerHTML = `Model <b>${esc(name)}</b> &middot; ${nodes.size} nodes`;
  } catch (e) { /* mlPost already alerted */ }
}

// Tables available to model over - the same pipeline-free list the ETL tab uses.
/* Tables a model can learn from.
   Mounted foreign tables AND the ETLW_TARGET tables the ETL Interop flow
   builds. The targets come first: a curated, loaded result is the thing worth
   training on, and it is what the demo's prediction step is supposed to select
   ("the target table just built"). Reading only /mountable meant the output of
   the whole wizard could not be used here at all.

   Landing, staging and quarantine are deliberately excluded - they are
   plumbing, not answers: staging holds only the last delta, so a model trained
   on it learns from whatever happened to arrive in the most recent run. */
async function mlTables() {
  const out = [], seen = {};
  const add = n => { if (n && !seen[n]) { seen[n] = 1; out.push(n); } };
  // the wizard's own results first
  try {
    const t = await (await fetch(api("/tables"))).json();
    (t.tables || []).filter(x => x.kind === "target").forEach(x => add(x.full));
  } catch (e) { /* fall through to the mounted sources */ }
  try {
    const j = await (await fetch(api("/mountable"))).json();
    (j.foreignTables || []).forEach(t => add("ETLWIZARD." + t.name));
  } catch (e) { /* nothing mounted, or not signed in */ }
  return out;
}

  try { return (await (await fetch(api("/ml/custom"))).json()).models || []; }
  catch (e) { return []; }
}

    `</select></label>
     <button class="m_new" style="font-family:var(--font);font-weight:700;font-size:.76rem;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:7px;padding:.32rem .7rem;cursor:pointer">+ New model</button>
     <button class="m_custom" style="font-family:var(--font);font-weight:700;font-size:.76rem;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:7px;padding:.32rem .7rem;cursor:pointer">Custom models...</button>`,
    null);
  card.querySelector(".m_new").onclick = e => { e.preventDefault(); mlStepCreate(); };
  card.querySelector(".m_custom").onclick = e => { e.preventDefault(); mlStepCustom(); };
  card.querySelector(".m_pick").onchange = async e => {
    const name = e.target.value;
    if (!name) return;
    const m = models.find(x => x.name === name);
    ML.name = name;
    ML.models = [name];
    ML.table = ((m && m.trainingQuery) || "").replace(/^.* FROM /i, "").replace(/\s+/g, "");
    await mlDrawGraph(name);
    mlStepExisting(m);
  };
}

// Step 2, for a model picked off the list. Selecting an existing model used to
// drop straight into Train, so retraining was the only thing the UI offered to
// do with a model that was already trained - validating or just looking at its
// predictions meant training it again first to get past this step. What happens
// next is the user's call.
async function mlStepExisting(m) {
  const trained = !!(m && m.trained);
  const validated = !!(m && m.validated);
  wguide("<b>Step 2 &middot; What next?</b> This model already exists, so there is nothing " +
    "to create. <b>Train</b> fits it again &mdash; on a different table, or on the same one " +
    "now that it holds more rows &mdash; and replaces what it learned before. " +
    "<b>Validate</b> scores it against a table and reads the metrics back; run it on data " +
    "the model was not trained on if you want the numbers to mean anything. " +
    "<b>Test</b> skips straight to predictions: a plain <code>SELECT</code> with the model " +
    "applied as extra columns, writing nothing. " +
    (trained ? "" : "It has not been trained yet, so validating and testing are not available " +
      "until it has been."), "", "mlexisting");
  const bstyle = (primary, on) =>
    `font-family:var(--font);font-weight:700;font-size:.78rem;` +
    `background:${on ? (primary ? "var(--teal-fill)" : "var(--card)") : "var(--card)"};` +
    `color:${on ? (primary ? "var(--on-teal)" : "var(--ink)") : "var(--ink-soft)"};` +
    `border:1.5px solid ${on ? (primary ? "var(--teal-fill)" : "var(--ink)") : "var(--rule)"};` +
    `border-radius:7px;padding:.4rem .9rem;cursor:${on ? "pointer" : "not-allowed"};` +
    `${on ? "box-shadow:var(--shadow);" : "opacity:.55;"}`;
  const card = stepCard(
    `<div style="width:100%;font-size:.82rem">` +
       `<code>${esc(ML.name)}</code> &middot; ` +
       (trained ? (validated ? "trained and validated" : "trained, not validated yet")
                : "<b>not trained yet</b>") +
       (ML.table ? ` &middot; from <code>${esc(ML.table)}</code>` : "") +
     `</div>
     <div class="wrow" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
       <button class="m_xtrain" style="${bstyle(!trained, true)}">${trained ? "Train again" : "Train"}</button>
       <button class="m_xval" ${trained ? "" : "disabled"} style="${bstyle(trained, trained)}">${validated ? "Validate again" : "Validate"}</button>
       <button class="m_xtest" ${trained ? "" : "disabled"} style="${bstyle(false, trained)}">Test predictions</button>
     </div>`,
    null);
  card.querySelector(".m_xtrain").onclick = e => { e.preventDefault(); mlStepTrain(m); };
  card.querySelector(".m_xval").onclick = e => { e.preventDefault(); if (trained) mlStepValidate(); };
  card.querySelector(".m_xtest").onclick = e => { e.preventDefault(); if (trained) mlStepPredict(); };
}

// Step 1 - CREATE MODEL.
//
// `preset` lets the custom-models step come straight here with a model already
// chosen, which is what makes "add a file, then use it" one continuous flow.
async function mlStepCreate(preset) {
  const tables = await mlTables();
  const customs = await mlCustomModels();
  wguide("<b>Step 1 &middot; Model.</b> Give the model a name, pick the table it learns " +
    "from and the <b>columns</b> to predict &mdash; tick as many as you need. " +
    "<code>PREDICTING</code> takes one column, so each ticked column gets its own model, " +
    "named <code>&lt;name&gt;_&lt;column&gt;</code>, and they are created and trained together. " +
    "<b>Kind</b> sets <code>IsRegression</code> in the " +
    "USING clause; leave it on <i>Let AutoML decide</i> to let AutoML work the task out " +
    "from the data. For a <b>time series</b> also pick the time column &mdash; it must be a " +
    "date/time column with one row per period, or AutoML cannot work out the interval.", "", "mlmodel");

  const card = stepCard(
    `<label>Name <input class="m_name" size="16" value="${esc((preset && preset.name) || ("model_" + Date.now().toString().slice(-6)))}"></label>
     <label>Kind <select class="m_kind">
       <option value="auto">Let AutoML decide</option>
       <option value="classification">Classification</option>
       <option value="regression">Regression</option>
       <option value="ts">Time series</option>
     </select></label>
     <label>Table <select class="m_table">${tables.map(t => `<option>${esc(t)}</option>`).join("")}</select></label>
     <label class="m_bywrap" style="display:none">Time column <select class="m_by"></select></label>
     <div style="width:100%">
       <div style="font-variant:small-caps;letter-spacing:.12em;color:var(--ink-soft);font-size:.72rem;margin:.3rem 0 .15rem">predicting &mdash; columns</div>
       <div class="m_targets" style="max-height:8.5rem;overflow:auto;border:1px solid var(--rule);border-radius:6px;padding:.35rem .5rem"></div>
     </div>
     <label style="width:100%" title="Restricts the model to these feature columns (the WITH clause). Leave blank to use every other column.">Features (WITH) <input class="m_with" style="width:100%" placeholder="optional: col1, col2 - blank uses all columns"></label>
     <label>Custom model <select class="m_cust"><option value="">(let AutoML choose)</option></select></label>
     <div class="m_custnote w_details"></div>
     <div style="width:100%">
       <div style="font-variant:small-caps;letter-spacing:.12em;color:var(--ink-soft);font-size:.72rem;margin:.4rem 0 .15rem">USING &mdash; stored on the model definition</div>
       <div class="m_tsparams" style="display:none">${mlUsingFields(ML_TS_PARAMS, "cts")}</div>
       ${mlUsingFields(ML_TRAIN_PARAMS, "ccr")}
       ${mlRawUsingField("create", "Extra USING JSON")}
     </div>
     <div class="m_preview w_details"></div>
     <div class="w_details m_hint"></div>`,
    "Create model", async c => {
      const base = sqlSafeName(c.querySelector(".m_name").value);
      const table = c.querySelector(".m_table").value;
      const kind = c.querySelector(".m_kind").value;
      const isTs = kind === "ts";
      const by = isTs ? c.querySelector(".m_by").value : "";
      const targets = Array.from(c.querySelectorAll(".m_targets input:checked")).map(x => x.value);
      if (!base) { alert("Give the model a name."); throw new Error("no name"); }
      if (!targets.length) { alert("Pick at least one column to predict."); throw new Error("no target"); }
      if (isTs && !by) { alert("Pick the time column."); throw new Error("no by"); }
      if (isTs && targets.length > 1) {
        alert("A time series model predicts one column. Pick a single column, or create them one at a time.");
        throw new Error("ts multi");
      }
      const using = mlBuildCreateUsing(c, kind, customs);
      const withCols = c.querySelector(".m_with").value.trim();
      const j = await mlPost("create", {
        name: base, table, targets, withColumns: withCols, timeColumn: by, using
      });
      const made = (j.models || []).filter(m => m.ok);
      const failed = (j.models || []).filter(m => !m.ok);
      ML.models = made.map(m => m.name);
      ML.name = ML.models[0];
      ML.table = table; ML.kind = kind; ML.timeSeries = isTs;
      wmsg("wrecap",
        `<b>${made.length} model(s) created</b> over <b>${esc(table)}</b>.` +
        `<table style="width:100%;border-collapse:collapse;font-size:.8rem;margin-top:.25rem">` +
        made.map(m => `<tr><td style="padding:.1rem 0"><code>${esc(m.name)}</code></td>` +
          `<td style="color:var(--ink-soft)">predicts ${esc(m.target)}</td></tr>`).join("") +
        failed.map(m => `<tr><td style="padding:.1rem 0"><code>${esc(m.name)}</code></td>` +
          `<td style="color:var(--danger,#a33)">${esc(m.error)}</td></tr>`).join("") +
        `</table>` +
        `<div style="margin-top:.25rem">${mlUsingPreview(using)}</div>`);
      await mlDrawGraph(ML.name);
      mlStepTrain();
    });

  const kindSel = card.querySelector(".m_kind");
  const tableSel = card.querySelector(".m_table");
  const custSel = card.querySelector(".m_cust");

  // only models of the matching problem type can be candidates, so the picker
  // follows the kind rather than offering a regressor for a classification
  const syncCustom = () => {
    const kind = kindSel.value;
    const want = kind === "regression" ? "regression" : "classification";
    const usable = kind === "ts" ? [] : customs.filter(m => m.kind === want);
    custSel.innerHTML = `<option value="">(let AutoML choose)</option>` +
      usable.map(m => `<option value="${esc(m.slug)}">${esc(m.modelName)} &middot; ${esc(m.slug)}</option>`).join("");
    custSel.disabled = kind === "ts";
    card.querySelector(".m_custnote").innerHTML = kind === "ts"
      ? "Time series models are built by a different AutoML path and do not take a custom model."
      : (usable.length ? "" : "No custom models installed for this kind &mdash; add one from <b>Custom models...</b>");
    if (preset && preset.customSlug) custSel.value = preset.customSlug;
  };

  const syncCols = async () => {
    const j = await mlPost("columns", { table: tableSel.value });
    const cols = j.columns || [];
    card.querySelector(".m_targets").innerHTML = cols.length
      ? cols.map(c2 => `<label style="display:inline-flex;align-items:center;gap:.3rem;margin:.1rem .7rem .1rem 0;font-size:.8rem">` +
          `<input type="checkbox" value="${esc(c2.name)}">${esc(c2.name)}` +
          `<span style="color:var(--ink-soft);font-size:.72rem">${esc(c2.type)}</span></label>`).join("")
      : "<i>no columns found</i>";
    const temporal = cols.filter(c2 => c2.temporal);
    card.querySelector(".m_by").innerHTML = temporal.length
      ? temporal.map(c2 => `<option>${esc(c2.name)}</option>`).join("")
      : `<option value="">(no date/time column on this table)</option>`;
    card.querySelector(".m_hint").textContent =
      (kindSel.value === "ts" && !temporal.length)
        ? "This table has no date/time column, so it cannot be used for a time-series model."
        : "";
  };

  const syncPreview = () => {
    try {
      card.querySelector(".m_preview").innerHTML =
        "Will send " + mlUsingPreview(mlBuildCreateUsing(card, kindSel.value, customs));
    } catch (e) { /* invalid raw JSON: leave the last good preview */ }
  };

  kindSel.onchange = () => {
    const isTs = kindSel.value === "ts";
    card.querySelector(".m_bywrap").style.display = isTs ? "" : "none";
    card.querySelector(".m_tsparams").style.display = isTs ? "" : "none";
    syncCustom(); syncPreview(); syncCols();
  };
  tableSel.onchange = syncCols;
  card.querySelectorAll("select, input, textarea").forEach(el => {
    el.addEventListener("change", syncPreview);
  });

  if (preset && preset.kind) kindSel.value = preset.kind;
  syncCustom();
  await syncCols();
  if (preset && preset.kind === "ts") kindSel.onchange();
  syncPreview();
}

// Assemble the CREATE-time USING: custom model selection, the problem type, the
// guided parameters, then the raw JSON last so it can override anything.
function mlBuildCreateUsing(card, kind, customs) {
  const using = {};
  const slug = card.querySelector(".m_cust") ? card.querySelector(".m_cust").value : "";
  if (slug) {
    const m = customs.find(x => x.slug === slug);
    if (m) {
      // the two keys the IntegratedML custom-models documentation defines
      using.model_name = m.modelName;
      using[m.pathKey] = m.dir;
    }
  }
  // IsRegression: 1 regression, 0 classification, omitted entirely when the user
  // wants AutoML to work it out (the documented behaviour for an absent value)
  if (kind === "regression") using.IsRegression = 1;
  else if (kind === "classification") using.IsRegression = 0;

  if (kind === "ts") Object.assign(using, mlReadUsing(card, ML_TS_PARAMS, "cts"));
  Object.assign(using, mlReadUsing(card, ML_TRAIN_PARAMS, "ccr"));
  Object.assign(using, mlReadRawUsing(card, "create"));
  return using;
}

// Step 2 - TRAIN. Always asynchronous: training outlives the gateway timeout,
// so we start a job and poll ML_TRAINING_RUNS.RUN_STATUS. Every model created in
// step 1 is trained, one after another.
async function mlStepTrain(existing) {
  const tables = await mlTables();
  const list = (ML.models && ML.models.length) ? ML.models : (ML.name ? [ML.name] : []);
  wguide("<b>Step 2 &middot; Train.</b> Training runs in the background &mdash; it can take " +
    "minutes on a real table, far longer than a request may stay open, so the status " +
    "below is polled from IRIS rather than held on one connection. The <code>USING</code> " +
    "settings were fixed in step 1 and are stored on the model definition, so there is " +
    "nothing to set again here &mdash; what each run will use is shown below." +
    (list.length > 1 ? ` All <b>${list.length}</b> models from step 1 are trained in turn.` : ""), "", "mltrain");
  const card = stepCard(
    `<label>Training table <select class="m_ttable">${tables.map(t =>
        `<option ${t === ML.table ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
     <div style="width:100%">
       <div style="font-variant:small-caps;letter-spacing:.12em;color:var(--ink-soft);font-size:.72rem;margin:.4rem 0 .15rem">USING &mdash; from the model definition</div>
       <div class="m_tusing w_details">reading...</div>
     </div>
     <div class="m_tstatus" style="width:100%;font-size:.8rem"></div>
     <span class="m_tmsg" style="font-size:.78rem;color:var(--ink-soft)"></span>`,
    "Train", async c => {
      const table = c.querySelector(".m_ttable").value;
      const msg = c.querySelector(".m_tmsg");
      const board = c.querySelector(".m_tstatus");
      // no USING is sent: TrainAsync merges the definition's own settings in, so
      // repeating them here would only be a chance to contradict step 1
      const state = {};
      const paint = () => {
        board.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:.8rem">` +
          list.map(n => `<tr><td style="padding:.1rem 0"><code>${esc(n)}</code></td>` +
            `<td style="color:var(--ink-soft)">${esc(state[n] || "waiting")}</td></tr>`).join("") +
          `</table>`;
      };
      paint();
      msg.classList.add("busyspin"); msg.textContent = "training";
      let lastOk = "";
      for (const name of list) {
        state[name] = "starting"; paint();
        // one model failing must not abandon the rest of the batch, so each is
        // wrapped: the row records what went wrong and the loop moves on
        try {
          await mlPost("train", { name, table });
          let done = false, missing = 0;
          for (let i = 0; i < 600 && !done; i++) {
            await new Promise(r => setTimeout(r, 2000));
            const s = await mlPost("status", { name });
            if (s.status === "completed") {
              state[name] = `trained ${s.trainedModel} in ${s.duration}s - ${s.modelInfo || ""}`;
              lastOk = name; done = true;
            } else if (s.status === "failed") {
              state[name] = "failed" + (s.error ? ": " + s.error : "");
              done = true;
            } else if (s.status.indexOf("terminated") >= 0) {
              // a killed run is terminal, and IRIS leaves no STATUS_CODE behind
              // for it - polling on for another 20 minutes only hides that the
              // run is already over. Status() supplies the explanation.
              state[name] = s.status + (s.error ? ": " + s.error : "");
              done = true;
            } else if (s.status === "none") {
              // the run row appears a moment after the job starts; if it never
              // shows up the job never ran, and polling for 20 minutes hides that
              state[name] = "starting";
              if (++missing > 15) { state[name] = "no training run appeared - the job did not start"; done = true; }
            } else {
              state[name] = s.status;
            }
            paint();
          }
          if (!done) state[name] = "still running - check back later";
        } catch (e) {
          state[name] = "error: " + (e && e.message ? e.message : e);
        }
        paint();
      }
      msg.classList.remove("busyspin"); msg.textContent = "";
      if (!lastOk) { throw new Error("no model trained"); }
      ML.name = lastOk;
      await mlDrawGraph(ML.name);
      mlStepValidate();
    });
  if (existing && existing.trained) {
    card.querySelector(".m_tmsg").textContent = "already trained - training again replaces it";
  }

  // what each model actually carries, read back from the definition rather than
  // from anything the page remembers - so a model picked off the list is right too
  (async () => {
    const box = card.querySelector(".m_tusing");
    if (!box) return;
    const seen = [];
    for (const name of list) {
      try {
        const j = await mlPost("settings", { name });
        seen.push({ name, using: j.settings || {} });
      } catch (e) { seen.push({ name, using: null }); }
    }
    box.innerHTML = seen.map(x =>
      `<div style="margin:.1rem 0"><code>${esc(x.name)}</code> ` +
      (x.using === null ? "<i>could not be read</i>" : mlUsingPreview(x.using)) + `</div>`).join("");
  })();
}

// Step 3 - VALIDATE, then show the numbers.
async function mlStepValidate() {
  const tables = await mlTables();
  const list = (ML.models && ML.models.length) ? ML.models : [ML.name];
  wguide("<b>Step 3 &middot; Validate.</b> Score a trained model against a table and " +
    "read the metrics back.", "", "mlvalidate");
  stepCard(
    `<label>Model <select class="m_vmodel">${list.map(n =>
        `<option ${n === ML.name ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
     <label>Validation table <select class="m_vtable">${tables.map(t =>
        `<option ${t === ML.table ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`,
    "Validate", async c => {
      const name = c.querySelector(".m_vmodel").value;
      const table = c.querySelector(".m_vtable").value;
      ML.name = name;
      const j = await mlPost("validate", { name, table });
      await mlDrawGraph(name);
      mlShowMetrics(j.metrics || [], j.excluded || 0);
      mlStepPredict();
    });
}

// Only the overall figures. Validation also returns one row per class (a
// TARGET_VALUE on the metric); those are dropped here deliberately - they turn
// a four-line summary into a wall of numbers on a many-class target.
function mlShowMetrics(metrics, excluded) {
  const overall = metrics.filter(m => !m.class);
  if (!overall.length) { wrecap("Validation produced no metrics."); return; }
  // Say when the metrics cover fewer rows than the table holds. Rows with no
  // target value cannot be scored and are dropped before validating; without
  // this line the figures cannot be reconciled against the table.
  const note = excluded
    ? `<div style="font-size:.74rem;color:var(--ink-soft);margin-top:.3rem">` +
      `${excluded.toLocaleString()} row(s) with no target value were excluded &mdash; ` +
      `they cannot be scored.</div>`
    : "";
  wmsg("wrecap", `<b>Metrics.</b><table style="width:100%;border-collapse:collapse;font-size:.82rem">` +
    overall.map(m => `<tr><td style="padding:.15rem 0">${esc(m.metric)}</td>` +
      `<td style="text-align:right"><b>${esc(m.value)}</b></td></tr>`).join("") +
    `</table>` + note);
}

// Step 4 - PREDICT / PROBABILITY preview.
async function mlStepPredict() {
  const tables = await mlTables();
  const list = (ML.models && ML.models.length) ? ML.models : [ML.name];
  wguide("<b>Last step &middot; Predictions.</b> Nothing is precomputed and no results " +
    "table is created &mdash; the grid below is a plain <code>SELECT</code> run against the " +
    "table you pick, with the model applied as two extra columns:" +
    "<br><code>SELECT TOP n *, PREDICT(model) AS ml_prediction, " +
    "PROBABILITY(model FOR 'class') AS ml_probability FROM &lt;table&gt;</code>" +
    "<br>IRIS scores each row as the query runs, so <code>ml_prediction</code> sits beside " +
    "the row it was computed from and you can compare it with the real value. " +
    "<code>PROBABILITY</code> is only defined for a classification model and needs the class " +
    "to score for &mdash; leave it blank for regression and time series. " +
    "<b>Rows</b> is the <code>TOP</code> clause: this reads the table, it does not write " +
    "anything. The exact statement used is shown above the results.", "", "mlpredict");
  stepCard(
    `<label>Model <select class="m_pmodel">${list.map(n =>
        `<option ${n === ML.name ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
     <label>Table <select class="m_ptable">${tables.map(t =>
        `<option ${t === ML.table ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
     <label>Probability for class <input class="m_pclass" size="10" placeholder="optional"></label>
     <label>Rows <input class="m_prows" size="4" value="10"></label>`,
    "Predict", async c => {
      const j = await mlPost("predict", {
        name: c.querySelector(".m_pmodel").value,
        table: c.querySelector(".m_ptable").value,
        forClass: c.querySelector(".m_pclass").value.trim(),
        maxRows: +c.querySelector(".m_prows").value || 10
      });
      const rows = j.rows || [];
      // show the statement that produced the grid, so the step explains itself
      const sql = j.sql
        ? `<div style="font-family:ui-monospace,Consolas,monospace;font-size:.72rem;` +
          `background:var(--wash-1);border:1px solid var(--rule);border-radius:6px;` +
          `padding:.4rem .55rem;margin:.3rem 0;overflow:auto">${esc(j.sql)}</div>`
        : "";
      // Same grid the transform step draws: renderPreviewTable() handles the
      // styling, the humanised headers and the number formatting, and redraws
      // itself when the audience view changes. Hand-rolling a <table> here meant
      // the last step of the ML flow was the one place showing raw text columns.
      const box = wmsg("wrecap", `<b>${rows.length} row(s)</b> &mdash; computed by this query:` +
        sql + `<div class="m_pgrid" style="width:100%"></div>`);
      // only the shape the grid needs: renderPreviewTable stashes what it is
      // given on the element to redraw on a view switch, and j also carries the
      // same rows again positionally (columns/rows) plus the SQL.
      renderPreviewTable(box.querySelector(".m_pgrid"),
        { columnDefs: j.columnDefs || "", sample: j.sample || { rows: [] } });
      offerMlMore();
    });
}

// Custom models. A Python file defining class IRISModel, installed into its own
// directory so CREATE MODEL can name it through model_name / path_to_classifiers.
const ML_TEMPLATE = `from sklearn.tree import DecisionTreeClassifier
import math


def time_complexity_fn(N):
    return N * math.log10(N)


class IRISModel:
    def __init__(self, **kwargs):
        self.model = DecisionTreeClassifier(
            random_state=kwargs.get('random_state', 0),
            class_weight="balanced",
            max_depth=6,
        )
        self.name = "my_decision_tree"
        self.time_complexity_fn = time_complexity_fn
        self.model_type = "Decision Tree"
        self.package = "sklearn"
        self.problem_type = "Classification"
`;

async function mlStepCustom() {
  const models = await mlCustomModels();
  wguide("<b>Custom models.</b> A custom model is a Python file defining class " +
    "<code>IRISModel</code>. Its <code>self.name</code> is the identifier " +

    "<code>path_to_classifiers</code> points at. Models live on the durable volume, so " +

    "<br><b>On the AutoML installed here (1.0.3), <code>model_name</code> is not yet " +
    "honoured</b> &mdash; it is an Early Access capability. The wizard emits the documented " +
    "clause anyway, and also installs the file where this build looks, so your model " +
    "<i>competes</i> against the built-in ones rather than being forced. Once an EAP " +
    "AutoML is installed the same clause selects it outright.");

  const rows = models.length
    ? models.map(m =>
        `<tr><td style="padding:.15rem .6rem .15rem 0"><code>${esc(m.modelName)}</code></td>` +
        `<td style="padding:.15rem .6rem .15rem 0;color:var(--ink-soft)">${esc(m.slug)}</td>` +
        `<td style="padding:.15rem .6rem .15rem 0;color:var(--ink-soft)">${esc(m.kind)}</td>` +
        `<td><button class="c_use" data-slug="${esc(m.slug)}" data-kind="${esc(m.kind)}" ` +

        `border:1.5px solid var(--rule);border-radius:6px;padding:.15rem .5rem;cursor:pointer">delete</button></td></tr>`).join("")

       <tr style="font-variant:small-caps;letter-spacing:.1em;color:var(--ink-soft);font-size:.72rem">
         <td>model_name</td><td>directory</td><td>kind</td><td></td></tr>
       ${rows}</table>
     <label>Name <input class="c_slug" size="18" value="my_model" title="Names the directory and the Python module. Letters, digits and underscores."></label>
     <label>Kind <select class="c_kind2"><option value="classification">Classification</option><option value="regression">Regression</option></select></label>
     <label style="width:100%">Python <textarea class="c_src" rows="12" style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:.74rem">${esc(ML_TEMPLATE)}</textarea></label>`,
    "Add model", async c => {

  card.querySelectorAll(".c_del").forEach(b => {
    b.onclick = async e => {

      if (!confirm(`Delete ${b.dataset.slug}?`)) return;
      await mlPost("custom/delete", { slug: b.dataset.slug, kind: b.dataset.kind });
      wrecap(`Deleted <b>${esc(b.dataset.slug)}</b>.`);
