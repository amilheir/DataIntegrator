<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Integrator &mdash; IRIS Data Pipelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
<style>
/* ============ Palette (day) — after the InterSystems editorial theme ============ */
:root {
  --font: "Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --paper: #eef3f9;
  --paper-deep: #e1eaf3;
  --ink: #2f2a95;
  --ink-soft: #5a5eb0;
  --teal: #00b2a9;
  --teal-bright: #00ccc2;
  --cyan: #00a9c7;
  --rule: rgba(17,43,77,.22);
  --card: #ffffff;
  --card-2: #f5f8fd;
  --shadow: 3px 3px 0 rgba(17,43,77,.26);
  --shadow-lg: 5px 5px 0 rgba(17,43,77,.24);
  --danger: #b3261e;
  --danger-soft: #7a1d16;
  --amber: #c77f00;
  --wash-1: rgba(0,169,199,.12);
  --wash-2: rgba(0,133,202,.12);
  --net: %230085ca;
  /* Accent variants for TEXT and for FILLED controls (IMPROVEMENTS_SPEC VD-3).
     Measured against WCAG AA on this palette:
       --teal  #00b2a9 as text on paper/card = 2.37-2.64:1  FAILS
       #fff on --teal (Save, primary buttons) = 2.64:1       FAILS
     --ink-soft, by contrast, passes everywhere (5.14-5.73 light, 6.2-7.6 dark)
     - the low-contrast secondary text the spec suspected is fine as it is.
     --teal itself is unchanged, so every border, wash and spinner keeps its
     colour; only text and filled controls move to these. */
  --teal-text: #007a74;   /* 4.66 / 5.20 / 4.89 on paper / card / card-2 */
  --teal-fill: #007a74;   /* white on it = 5.20 */
  --on-teal: #ffffff;
  --amber-text: #8a5900;  /* 5.36 on paper */
  --cyan-text: #00778c;   /* 4.69 on paper */
  color-scheme: light;
}
:root[data-theme="dark"] {
  --paper: #0d1019;
  --paper-deep: #121622;
  --ink: #d8def8;
  --ink-soft: #99a1cf;
  --teal: #2ad3c7;
  --teal-bright: #5cebe0;
  --cyan: #57c3e1;
  --rule: rgba(165,185,240,.20);
  --card: #171c2a;
  --card-2: #1d2334;
  --shadow: 3px 3px 0 rgba(0,0,0,.55);
  --shadow-lg: 5px 5px 0 rgba(0,0,0,.5);
  --danger: #ff6f61;
  --danger-soft: #ffb3ab;
  --amber: #f0b64a;
  --wash-1: rgba(42,211,199,.10);
  --wash-2: rgba(60,120,200,.14);
  --net: %2338d9cc;
  /* The dark palette's brighter accents already pass as text (8.4-10.2:1), so
     they are their own text colour here. The filled control flips instead:
     white on #2ad3c7 measures 1.87:1 - the Save button was very nearly
     illegible in dark theme - while dark ink on it measures 8.87:1. */
  --teal-text: #2ad3c7;
  --teal-fill: #2ad3c7;
  --on-teal: #06231f;
  --amber-text: #f0b64a;
  --cyan-text: #57c3e1;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background:
    radial-gradient(1200px 520px at 82% -10%, var(--wash-1), transparent 60%),
    radial-gradient(900px 620px at -10% 112%, var(--wash-2), transparent 55%),
    var(--paper);
  color: var(--ink);
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  transition: background-color .35s ease, color .35s ease;
}

/* ============ Header / masthead ============ */
/* grid items default to min-width:auto, so the single-line toolbar would push
   the whole page wider instead of scrolling inside itself */
header, main { min-width: 0; }
header {
  border-bottom: 1.5px solid var(--rule);
  background: var(--card);
  box-shadow: 0 2px 0 rgba(17,43,77,.10);
  z-index: 6;
}
/* the title leads the toolbar row; the margin keeps it from reading as a control */
.brand { display: flex; align-items: center; margin-right: 1rem; }
h1 {
  font-family: var(--font);
  font-weight: 700; font-size: clamp(1rem, 2.1vw, 1rem);
  letter-spacing: -.02em; line-height: 1;
  text-transform: uppercase;
}
h1 .t-etl { color: var(--teal-text); }
h1 .t-wiz { color: var(--ink); font-style: normal; font-weight: 700; }
.headerTools { display: inline-flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-left: auto; }

/* Model picker sits between the status pill and the theme toggle. The caps
   label matches the status text so the row reads as one band rather than a
   control bolted on. */
.modelPick { display: inline-flex; align-items: center; gap: .45rem; }
.modelPickLabel {
  font-variant: small-caps; letter-spacing: .18em; color: var(--ink-soft);
  font-size: .7rem;
}
#modelsel { min-width: 10.5rem; font-size: .8rem; padding: .3rem .45rem; }
#modelsel:disabled { opacity: .55; cursor: progress; }

.iconBtn {
  font-size: 1.15rem; line-height: 1; width: 2.5rem; height: 2.3rem;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card);
  color: var(--ink); cursor: pointer; box-shadow: var(--shadow);
  transition: transform .16s ease, background .18s ease, color .18s ease, box-shadow .16s ease;
}
.iconBtn:hover { background: var(--ink); color: var(--paper); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.iconBtn:active { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(17,43,77,.26); }

/* ============ Toolbar ============ */
.toolbar {
  /* flex, not inline-flex: as an inline-level box it shrank to fit the header
     and then CLIPPED its overflowing children rather than scrolling them.
     wrap, not nowrap + overflow-x: with nine controls in Technical view the row
     exceeds the viewport, and a clipped control is an invisible one. Wrapping
     to a second row keeps every control reachable at any window width. */
  display: flex; align-items: center; gap: .5rem .5rem; flex-wrap: wrap;
  justify-content: flex-start; padding: .8rem 1.4rem .75rem;
}
/* nothing inside collapses to fit; items move to the next row instead */
.toolbar > * { flex: 0 0 auto; }
/* the separators are meaningless at the start or end of a wrapped row */
.toolbar .tsep { align-self: stretch; }
.tgroup { display: inline-flex; align-items: center; gap: .4rem; }
.tsep { width: 1.5px; align-self: stretch; background: var(--rule); margin: .1rem .35rem; }

/* ---- tab row: Data Sources | ETL Interop --------------------------------
   Portal-style tabs ("Production | Host"): bold labels on a tinted band, the
   active one underlined rather than drawn as a folder tab. */
.tabbar {
  display: flex; gap: .2rem; padding: 0 1.4rem;
  background: var(--card-2); border-top: 1.5px solid var(--rule);
}
.tab {
  font-family: var(--font); font-weight: 600; font-size: .9rem;
  color: var(--ink-soft); cursor: pointer;
  background: transparent; border: 0; border-bottom: 3px solid transparent;
  border-radius: 0; padding: .5rem .85rem .4rem;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); font-weight: 700; border-bottom-color: var(--teal-text); }

input, select {
  font-family: var(--font); font-size: .9rem; color: var(--ink);
  background: var(--card); border: 1.5px solid var(--rule); border-radius: 7px;
  padding: .4rem .65rem; transition: border-color .18s ease, box-shadow .18s ease;
}
input::placeholder { color: var(--ink-soft); font-style: italic; }
input:focus, select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--wash-1); }
#runid { width: 5rem; }
#pipeid { width: 6.5rem; }

.btn {
  font-family: var(--font); font-weight: 700; font-size: .78rem;
  letter-spacing: .05em; color: var(--ink); background: var(--card);
  border: 1.5px solid var(--ink); border-radius: 7px; padding: .44rem .95rem;
  cursor: pointer; white-space: nowrap; box-shadow: var(--shadow);
  transition: transform .16s ease, background .18s ease, color .18s ease, box-shadow .16s ease;
}
.btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: 1px 1px 0 rgba(17,43,77,.26); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--teal-fill); color: var(--on-teal); border-color: var(--teal-fill); }
.btn.primary:hover:not(:disabled) { background: var(--teal-bright); color: #06231f; }
.btn.accent { background: var(--ink); color: var(--paper); }
.btn.accent:hover:not(:disabled) { background: var(--teal-fill); border-color: var(--teal-fill); color: var(--on-teal); }
.btn.danger { border-color: #b4552d; color: #b4552d; }
.btn.danger:hover:not(:disabled) { background: #b4552d; border-color: #b4552d; color: var(--paper); }
/* The bar carries nine controls in Technical view. These caps keep it to a
   SINGLE ROW at ordinary window widths; flex-wrap stays on as a safety net so
   an extreme width wraps rather than clipping something off the edge. */
#pipelist { min-width: 7.5rem; max-width: 10rem; }
#tablelist { min-width: 7.5rem; max-width: 10rem; }
#mlmodellist { min-width: 7.5rem; max-width: 10rem; }
#mcptoollist { min-width: 7.5rem; max-width: 10rem; }
#kglist { min-width: 7.5rem; max-width: 10rem; }

/* ---- Knowledge graph canvas + legend (ported from wikigraph) ------------
   The graph needs a box with a REAL height. Left to size itself inside a
   column-flex parent it collapsed to its minimum, the viewBox stayed large, and
   the whole constellation rendered as a few specks in a field of white.
   .kgwrap is that box; the SVG fills it and the drawing is fitted to it. */
.kgwrap {
  position: relative; width: 100%; align-self: stretch;
  /* Height comes from the pane, not from a vh guess. Guessing overshot by
     64px: the pane grew a scrollbar and the legend, anchored to the bottom of
     this box, sat below the fold. */
  height: 100%; min-height: 420px;
}

/* Knowledge Base: the pane is the graph. Everything that describes a pipeline
   run is hidden rather than left empty - an empty element still occupies its
   margins, which is the blank band that used to sit under the graph. */
#right.kgmode > h3,
#right.kgmode > #results,
#right.kgmode > #runhistory,
#right.kgmode > #log { display: none; }
#right.kgmode { padding-bottom: .9rem; }
#right.kgmode > #runbanner { margin-bottom: .4rem; flex: none; }

/* A flex column so #flow takes exactly the height left over after the banner -
   no arithmetic, and correct at any window size. overflow:hidden because there
   is nothing left to scroll to once the graph fits. */
#right.kgmode { display: flex; flex-direction: column; overflow: hidden; }
#right.kgmode > #flow { flex: 1 1 auto; min-height: 0; }

/* Chat & Knowledge graph only: the two panes swap grounds. Reading is the work
   on the left, so it gets the white; the constellation sits better on the
   paper tint. Expressed with the same two tokens the rest of the app uses, so
   the swap follows the day/night theme instead of pinning literal colours. */
body.kgchat #left { background: var(--card); }
body.kgchat #right { background-color: var(--paper); }
#kgsky { display: block; width: 100%; height: 100%; }

/* The constellation's visual language, ported from wikigraph.
   The load-bearing trick is `paint-order: stroke` with a paper-coloured
   stroke: it paints a halo the colour of the background behind every glyph, so
   a label crossing three edges stays readable instead of dissolving into them. */
#kgsky .kgnode { cursor: pointer; }
#kgsky .kgnode circle { stroke: var(--card); stroke-width: 1.5; }
#kgsky .kglabel {
  font-family: var(--font); font-size: 13px; font-weight: 600;
  fill: var(--ink); pointer-events: none; text-anchor: middle;
  paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round;
}
#kgsky .kglink { stroke: var(--ink-soft); stroke-opacity: .5; stroke-width: 1; }
#kgsky .kgpred {
  font-family: var(--font); font-style: italic; font-size: 11px;
  fill: var(--ink-soft); pointer-events: none; text-anchor: middle;
  paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round;
}

/* A focused node and its neighbours stay lit; everything else fades. The
   transition is what makes it read as "these, out of all of those" rather than
   as a redraw - wikigraph's .2s, on the same properties. */
#kgsky .kgnode, #kgsky .kglink, #kgsky .kgpred { transition: opacity .2s, stroke-opacity .2s; }
#kgsky .kglink.hot { stroke: var(--teal); stroke-width: 1.6; }

/* The info card: what this entity is, and every relation it takes part in.
   Anchored to the graph box (wikigraph anchors to the viewport, which here
   would put it over the chat pane) and slid in from the right edge. */
#kginfo {
  position: absolute; right: .7rem; top: .7rem; z-index: 6; width: 17rem;
  max-height: calc(100% - 1.4rem); overflow-y: auto;
  padding: .75rem .85rem; border: 1.5px solid var(--rule);
  border-radius: 8px; background: var(--card); box-shadow: var(--shadow);
  transform: translateX(calc(100% + 1.4rem));
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
#kginfo.open { transform: none; }
#kginfo .kgiclose {
  float: right; background: 0; border: 0; cursor: pointer; line-height: 1;
  font-size: 1.2rem; color: var(--ink-soft); padding: 0 0 0 .4rem;
}
#kginfo .kginm {
  font-family: var(--font); font-weight: 700; font-size: 1.15rem;
  color: var(--ink); line-height: 1.15; padding-right: 1.2rem;
}
#kginfo .kgity { font-size: .78rem; color: var(--ink-soft); margin: .3rem 0 .1rem; }
#kginfo .kgity .sw {
  display: inline-block; width: 10px; height: 10px; border-radius: 99px;
  margin-right: .35rem; box-shadow: 0 0 0 1.5px var(--card);
}
#kginfo .kgidesc { font-size: .78rem; color: var(--ink-soft); margin-top: .35rem; }
#kginfo h4 {
  font-variant: small-caps; letter-spacing: .12em; font-size: .72rem; font-weight: 400;
  color: var(--ink); margin: .7rem 0 .3rem; border-top: 1px solid var(--rule); padding-top: .55rem;
}
#kginfo .kgirel { font-size: .8rem; color: var(--ink); line-height: 1.5; padding: .1rem 0; }
#kginfo .kgirel .p { color: var(--amber-text); font-style: italic; }
#kginfo .kgirel .o { color: var(--teal-text); font-weight: 700; cursor: pointer; }
#kginfo .kgirel .o:hover { text-decoration: underline; }

/* Bottom-left, as in wikigraph - but anchored to the graph box rather than the
   viewport, so it cannot drift over the chat in the other pane. */
#kglegend:empty { display: none; }
#kglegend {
  position: absolute; left: .7rem; bottom: .7rem; z-index: 5;
  max-height: 70%; overflow-y: auto;
  padding: .6rem .75rem; border: 1.5px solid var(--rule);
  border-radius: 8px; background: var(--card); box-shadow: var(--shadow);
  /* Three quarters of full size. Scaling the whole card rather than shrinking
     each font and padding keeps every proportion - swatches, gaps, buttons -
     exactly as designed. The origin is the corner it is anchored to, so it
     shrinks toward the bottom-left instead of drifting away from it. */
  transform: scale(0.9);
  transform-origin: left bottom;
}
/* The label toggle sits under the title, above the swatches, rather than with
   the two actions at the foot of the card: it acts on the GRAPH, where those
   act on the selection. */
#kglegend .kglhact { margin: .15rem 0 .3rem; }
#kglegend .kglh {
  font-variant: small-caps; letter-spacing: .14em; font-size: .72rem; color: var(--ink);
}
#kglegend .kglhint { font-size: .72rem; color: var(--ink-soft); font-style: italic; margin-bottom: .4rem; }
#kglegend .kglbody { display: flex; flex-direction: column; gap: .05rem; }
.kgleg {
  display: flex; align-items: center; gap: .4rem; font-size: .78rem; color: var(--ink);
  padding: .2rem .4rem; cursor: pointer; border-radius: 6px; user-select: none;
}
.kgleg:hover { background: var(--paper-deep, rgba(0,0,0,.05)); }
.kgleg.sel { background: color-mix(in srgb, var(--teal, #00b2a9) 18%, transparent); font-weight: 700; }
.kgleg .sw { width: 12px; height: 12px; border-radius: 99px; flex: none; box-shadow: 0 0 0 1.5px var(--card); }
.kgleg .n { color: var(--ink-soft); font-variant-numeric: tabular-nums; }
#kglegend .kglacts { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin-top: .45rem; }
#kglegend .kglbtn {
  font-family: var(--font); font-size: .7rem; font-weight: 700; letter-spacing: .05em;
  color: var(--teal, #00b2a9); background: 0; border: 0; cursor: pointer; padding: .15rem 0;
}
#kglegend .kglbtn:hover { text-decoration: underline; }
#kglegend .kglclear { display: none; }
#kglegend .kglclear.show { display: inline; }

/* ---- Knowledge Base: section switcher, progress, pulse ------------------
   The switcher deliberately echoes the Technical/Executive control rather than
   inventing a second visual language for "pick one of two". */
.wmsg.kgnav { background: none; border: 0; box-shadow: none; padding: 0; align-self: stretch; }
.kgnavrow { display: flex; gap: .3rem; }
.kgnavbtn {
  font-family: var(--font); font-weight: 700; font-size: .76rem;
  letter-spacing: .04em; background: var(--card); color: var(--ink-soft);
  border: 1.5px solid var(--rule); border-radius: 7px; padding: .3rem .8rem; cursor: pointer;
}
.kgnavbtn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.kgnavbtn:hover { color: var(--ink); }
.kgnavbtn.on:hover { color: var(--paper); }

/* Embedding is silent server-side work with no intermediate output, so without
   motion a slow batch is indistinguishable from a hang. */
.kgbar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; position: relative; }
.kgbar::after {
  content: ""; position: absolute; inset: 0; width: 35%;
  background: linear-gradient(90deg, transparent, var(--accent, #00b2a9), transparent);
  animation: kgsweep 1.4s linear infinite;
}
.kgbar.kgdone::after { display: none; }
.kgbarfill { height: 100%; width: 0; background: var(--accent, #00b2a9); transition: width .4s ease; }
@keyframes kgsweep { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
.kgpulse { animation: kgblink 1.6s ease-in-out infinite; }
@keyframes kgblink { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
.chat.kgstatus { font-style: italic; }

/* A turn still being written. The caret is the only signal that the answer is
   arriving rather than finished - without it a model that pauses mid-sentence
   is indistinguishable from one that has stopped. */
.chat.agent .caret {
  display: inline-block; width: .5ch; height: 1em; margin-left: .1ch;
  vertical-align: text-bottom; background: var(--ink-soft);
  animation: caretBlink 1.1s step-end infinite;
}
@keyframes caretBlink { 50% { opacity: 0; } }

/* One exchange: question, answer, and the records it came from. */
.kgturn { display: contents; }

/* Rendered markdown inside an answer bubble. Tight margins - a chat bubble is
   not a document, and default list padding pushes the text off its own edge. */
.kgmd { margin-top: .15rem; }
.kgmd p { margin: 0 0 .45rem; }
.kgmd p:last-child { margin-bottom: 0; }
.kgmd ul, .kgmd ol { margin: .2rem 0 .45rem; padding-left: 1.15rem; }
.kgmd li { margin: .12rem 0; }
.kgmd li::marker { color: var(--ink-soft); }
.kgmd code {
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .86em;
  background: var(--paper-deep); border-radius: 4px; padding: .05rem .25rem;
}
.kgmd .kgmdh { display: block; margin: .3rem 0 .15rem; }
.toolbar { gap: .35rem; }
.toolbar .btn { padding: .36rem .6rem; }
.toolbar select { padding: .32rem .45rem; font-size: .82rem; }
.toolbar .tsep { margin: .1rem .15rem; }
.status {
  font-variant: small-caps; letter-spacing: .12em; white-space: nowrap;
  font-size: .8rem; font-style: italic; color: var(--ink-soft);
}

/* ============ Main two-pane ============ */
main { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }

/* ---- LEFT: conversation ---- */
#left {
  border-right: 1.5px solid var(--rule); display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
}
#convo {
  flex: 1 1 auto; overflow-y: auto; padding: 1.4rem 1.3rem;
  display: flex; flex-direction: column; gap: .7rem;
}
.section-tag {
  font-variant: small-caps; letter-spacing: .2em; font-size: .72rem;
  color: var(--ink-soft); padding: 0 1.3rem; margin-top: .3rem;
}

.wmsg { max-width: 94%; padding: .7rem .9rem; border-radius: 9px; font-size: .96rem;
  line-height: 1.5; animation: rise .35s ease both;
  /* previews carry unbroken strings (a JSON sample row, a long column list) —
     break them anywhere rather than letting them run past the card edge */
  overflow-wrap: anywhere; min-width: 0; }
.wmsg.guide {
  background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--teal);
  border-bottom-left-radius: 3px; box-shadow: var(--shadow);
}
.wmsg.guide b { color: var(--ink); }
.wmsg.guide i { color: var(--ink-soft); }
.wmsg.recap {
  align-self: flex-start; max-width: 90%; margin-left: 1.1rem;
  font-size: .86rem; color: var(--ink-soft);
  background: var(--card-2); border: 1px dashed var(--rule); border-radius: 8px;
  padding: .5rem .8rem;
}
.wmsg.recap b { color: var(--teal-text); font-style: normal; }
.wmsg.formcard {
  margin-left: 1.1rem; max-width: 92%;
  background: var(--card-2); border: 1.5px solid var(--rule); border-radius: 9px;
  box-shadow: var(--shadow); display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
  padding: .8rem .9rem;
}
.wmsg.formcard label {
  display: inline-flex; gap: .4rem; align-items: center;
  font-variant: small-caps; letter-spacing: .06em; font-size: .82rem; color: var(--ink-soft);
}
.wmsg.formcard input, .wmsg.formcard select { font-size: .86rem; max-width: 18rem; }
.wmsg.formcard.locked { opacity: .48; }
.wmsg .w_details { width: 100%; min-width: 0; max-width: 100%; font-size: .8rem;
  color: var(--ink-soft); font-style: italic; overflow-wrap: anywhere; }
/* flex/grid children default to min-width:auto, which lets a long token push the
   card wider than its parent instead of wrapping */
.wmsg code, .wmsg pre, .wmsg .w_details * { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.wmsg pre { white-space: pre-wrap; }
.wrow { width: 100%; min-width: 0; }
.wsave {
  font-family: var(--font); font-weight: 700; letter-spacing: .05em;
  font-size: .8rem; color: var(--on-teal); background: var(--teal-fill); border: 1.5px solid var(--teal-fill);
  border-radius: 7px; padding: .48rem 1.15rem; cursor: pointer; box-shadow: var(--shadow);
  transition: transform .16s ease, background .18s ease, box-shadow .16s ease;
}
.wsave:hover:not(:disabled) { background: var(--teal-bright); color: #06231f; transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.wsave:active:not(:disabled) { transform: translateY(1px); }
.wsave:disabled { opacity: .55; cursor: wait; }

/* chat bubbles */
.chat { max-width: 82%; padding: .7rem 1rem; line-height: 1.55; font-size: .98rem;
  border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: var(--shadow);
  animation: rise .35s ease both; }
.chat.user { align-self: flex-end; background: var(--ink); color: var(--paper);
  border-bottom-right-radius: 3px; }
.chat.agent { align-self: flex-start; background: var(--card); border: 1px solid var(--rule);
  border-left: 4px solid var(--teal); border-bottom-left-radius: 3px; }
.chat.agent .who { display: block; font-variant: small-caps; letter-spacing: .1em;
  font-size: .7rem; color: var(--teal-text); margin-bottom: .1rem; }

/* approval cards */
.approval { align-self: flex-start; max-width: 92%; margin-left: 1.1rem;
  background: var(--card); border: 1.5px solid var(--rule); border-left: 4px solid var(--amber);
  border-radius: 9px; box-shadow: var(--shadow); padding: .75rem .9rem; font-size: .9rem;
  animation: rise .35s ease both; }
.approval h4 { font-family: var(--font); font-weight: 700; font-size: .95rem; margin-bottom: .35rem; color: var(--ink); }
.approval pre { max-height: 8rem; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: .74rem; background: var(--card-2); border-radius: 6px; padding: .5rem .6rem;
  white-space: pre-wrap; word-break: break-all; }
.approval .actions { display: flex; gap: .5rem; margin-top: .5rem; }
.approval .actions input { flex: 1; }
.approval .ok { background: var(--teal-fill); color: var(--on-teal); border-color: var(--teal-fill); }
.approval .no { color: var(--danger); border-color: var(--danger); }
.approval .ok, .approval .no { font-family: var(--font); font-weight: 700; font-size: .78rem;
  letter-spacing: .04em; border-width: 1.5px; border-style: solid; border-radius: 7px;
  padding: .4rem .9rem; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s ease; }
.approval .ok:hover { transform: translateY(-1px); }
.approval .no:hover { background: var(--danger); color: #fff; }

/* ---- RIGHT: flowchart ---- */
#right {
  min-height: 0; min-width: 0; overflow-y: auto; padding: 1.4rem 1.3rem 3rem;
  position: relative;
  background-color: var(--card);
}
/* faint pipeline-constellation backdrop */
#right::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;

}
#right > * { position: relative; }
#right h3 {
  font-family: var(--font); font-weight: 700; font-size: 1.05rem;
  letter-spacing: -.01em; margin-bottom: .3rem;
}
#right h3 small { font-family: var(--font); font-variant: small-caps;
  letter-spacing: .14em; font-size: .68rem; font-weight: 400; color: var(--ink-soft); }
#runbanner { font-variant: small-caps; letter-spacing: .1em; font-size: .82rem;
  color: var(--ink-soft); font-style: italic; margin-bottom: 0rem; min-height: 1.1rem; }
#runbanner b { color: var(--teal-text); font-style: normal; }

#flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.fcempty { opacity: .6; font-style: italic; font-size: .95rem; padding: 3rem 1rem; text-align: center; max-width: 22rem; }
.fcnode {
  width: min(23rem, 92%); background: var(--card-2); border: 1.5px solid var(--rule);
  border-radius: 10px; padding: .55rem .85rem; text-align: center; box-shadow: var(--shadow);
  animation: rise .3s ease both; transition: border-color .25s ease, box-shadow .25s ease;
}
.fcnode .fckind { font-variant: small-caps; letter-spacing: .16em; font-size: .66rem;
  color: var(--teal-text); font-weight: 700; }
.fcnode .fcname { font-family: var(--font); font-weight: 600; font-size: .92rem;
  color: var(--ink); word-break: break-all; line-height: 1.2; margin: .1rem 0; }
.fcnode .fcstat { font-variant: small-caps; letter-spacing: .1em; font-size: .68rem; color: var(--ink-soft); }
.fcnode.configured, .fcnode.validated, .fcnode.generated, .fcnode.deployed { border-color: var(--cyan); }
.fcnode.running { border-color: var(--amber); box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 22%, transparent), var(--shadow); }
.fcnode.succeeded { border-color: var(--teal); }
.fcnode.failed { border-color: var(--danger); }
.fcconn { display: flex; flex-direction: column; align-items: center; line-height: 1; padding: .1rem 0; }
.fcarrow { font-size: 1.2rem; color: var(--ink-soft); opacity: .7; }
.fclbl { font-variant: small-caps; letter-spacing: .1em; font-size: .66rem; color: var(--teal-text);
  margin: -.05rem 0; text-align: center; max-width: 22rem; }
.fcnode .fcdetail, .fccluster .fcdetail { font-size: .7rem; color: var(--ink-soft); line-height: 1.35;
  margin-top: .15rem; word-break: break-word; }
.fccfg { display: grid; grid-template-columns: 1fr 1fr; gap: .1rem .9rem; text-align: left;
  font-size: .7rem; color: var(--ink-soft); margin-top: .2rem; }
.fccfg span { white-space: nowrap; }
/* a cluster of input tables that fan into one downstream node */
.fccluster {
  width: min(23rem, 92%); background: var(--card-2);
  border: 1.5px dashed var(--cyan); border-radius: 10px; padding: .5rem .7rem;
  box-shadow: var(--shadow); animation: rise .3s ease both;
  display: flex; flex-direction: column; gap: .35rem; text-align: center;
}
.fccluster .fckind { font-variant: small-caps; letter-spacing: .16em; font-size: .66rem;
  color: var(--teal-text); font-weight: 700; }
.fcsrc { background: var(--card); border: 1px solid var(--rule); border-radius: 6px;
  padding: .3rem .5rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .76rem;
  color: var(--ink); word-break: break-all; }
.fcsrc .fcdetail { font-family: var(--font); }
/* production hosts fan out horizontally under one header */
.fcprodwrap {
  width: min(34rem, 98%); background: var(--card-2);
  border: 1.5px dashed var(--cyan); border-radius: 10px; padding: .5rem .5rem;
  box-shadow: var(--shadow); animation: rise .3s ease both;
  display: flex; flex-direction: column; gap: .4rem; align-items: center;
}
.fcprodwrap > .fckind { font-variant: small-caps; letter-spacing: .16em; font-size: .66rem;
  color: var(--teal-text); font-weight: 700; }
.fcprod { display: flex; flex-wrap: nowrap; align-items: stretch; justify-content: center;
  gap: .25rem; width: 100%; }
.fcprod .fcnode { width: auto; min-width: 0; flex: 1 1 0; margin: 0; animation: none; padding: .4rem .45rem; }
.fcprod .fcnode .fcname { font-size: .78rem; }
.fcprodarrow { align-self: center; color: var(--ink-soft); opacity: .7; font-size: .95rem; }

#runhistory { font-size: .84rem; margin-top: 1.4rem; color: var(--ink-soft); line-height: 1.7; }
#runhistory b { font-variant: small-caps; letter-spacing: .1em; color: var(--ink); }
#runhistory a { color: var(--teal-text); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
details#log { margin-top: 1.4rem; }
details#log summary { font-variant: small-caps; letter-spacing: .12em; font-size: .74rem;
  color: var(--ink-soft); cursor: pointer; }
#events { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .72rem;
  white-space: pre-wrap; word-break: break-all; max-height: 14rem; overflow: auto; margin-top: .5rem; }
.ev { padding: .12rem 0; border-bottom: 1px dotted var(--rule); }
.ev .t { font-weight: 700; color: var(--ink); }
.ev.run-error .t { color: var(--danger); }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* SQLGen "the model is thinking" indicator */
@keyframes etlspin { to { transform: rotate(360deg); } }
@keyframes etldots { 0%, 20% { content: ""; } 40% { content: "."; } 60% { content: ".."; } 80%, 100% { content: "..."; } }
.w_amsg.busy { color: var(--teal-text); font-weight: 600; }
.w_amsg.busy::before {
  content: ""; display: inline-block; width: .78em; height: .78em; margin-right: .45em;
  vertical-align: -.08em; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--teal) 30%, transparent);
  border-top-color: var(--teal); animation: etlspin .7s linear infinite;
}
.w_amsg.busy::after { content: ""; animation: etldots 1.4s steps(1) infinite; }
.w_gen.busy { opacity: .6; cursor: progress; }
/* generic busy spinner (file upload/convert) */
.busyspin { color: var(--teal-text); font-weight: 600; }
.busyspin::before {
  content: ""; display: inline-block; width: .78em; height: .78em; margin-right: .45em;
  vertical-align: -.08em; border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--teal) 30%, transparent);
  border-top-color: var(--teal); animation: etlspin .7s linear infinite;
}
.busyspin::after { content: ""; animation: etldots 1.4s steps(1) infinite; }

/* the "not signed in" banner - deliberately loud, it blocks all work */
#signin {
  position: sticky; top: 0; z-index: 40; padding: .7rem 1.4rem;
  background: var(--card); border-bottom: 2px solid var(--danger);
  color: var(--ink); font-size: .9rem; box-shadow: var(--shadow);
}
#signin b { color: var(--danger); }
#signin button {
  font-family: var(--font); font-weight: 700; font-size: .78rem;
  margin-left: .6rem; padding: .3rem .8rem; cursor: pointer;
  background: var(--teal-fill); color: var(--on-teal);
  border: 1.5px solid var(--teal-fill); border-radius: 7px;
}
#signin .w_details { margin-top: .3rem; }

/* ============ Audience view: Technical / Executive ============
   One toggle, two views of the same application (IMPROVEMENTS_SPEC 1.1).
   Everything here is chrome: it re-renders instantly on a switch and never
   touches a wizard card that is already on screen. */
.viewToggle {
  display: inline-flex; align-items: stretch; border: 1.5px solid var(--ink);
  border-radius: 8px; overflow: hidden; box-shadow: var(--shadow);
}
.viewToggle button {
  font-family: var(--font); font-weight: 700; font-size: .76rem;
  letter-spacing: .06em; padding: .42rem .85rem; cursor: pointer;
  background: var(--card); color: var(--ink); border: 0; white-space: nowrap;
  transition: background .18s ease, color .18s ease;
}
.viewToggle button + button { border-left: 1.5px solid var(--ink); }
.viewToggle button[aria-pressed="true"] { background: var(--teal-fill); color: var(--on-teal); }
.viewToggle button:focus-visible { outline: 3px solid var(--cyan); outline-offset: -3px; }
/* Executive view hides engineering surfaces. Nothing is REMOVED - every rule
   here is display only, and switching back restores the control untouched. */
body[data-view="executive"] .techOnly { display: none !important; }
/* VD-3: projector legibility. The whole page steps up a little rather than
   individual rules being retuned, so nothing can drift out of proportion. */
body[data-view="executive"] { font-size: 1.08rem; }
body[data-view="executive"] .wmsg { font-size: 0.95rem; }
body[data-view="executive"] .wmsg .w_details,
body[data-view="executive"] #runhistory { font-size: .88rem; }
body[data-view="executive"] .fcdetail, body[data-view="executive"] .fcstat { font-size: .8rem; }

/* VD-2: flowchart focus mode. The chart is the most persuasive visual in the
   product and normally gets a third of the screen; for the deploy moment it
   takes the whole width. Purely CSS - the graph model is untouched and
   renderGraph() is never called, so nothing re-renders and nothing is lost. */
body[data-focus="1"] main { grid-template-columns: 1fr; }
body[data-focus="1"] #left { display: none; }
body[data-focus="1"] #right { border-left: 0; }
body[data-focus="1"] .fcnode { width: min(34rem, 70%); }
#focusBtn { font-size: .95rem; }

/* VD-3 (3): presentation zoom. Off by default - the base size is unchanged
   unless a presenter asks for it, so nothing about the normal layout moves.
   Scaling the root and letting the rem-based type follow keeps every
   proportion intact instead of retuning rules one at a time. */
:root[data-zoom="1"] { font-size: 112.5%; }
:root[data-zoom="2"] { font-size: 125%; }
:root[data-zoom="3"] { font-size: 140%; }

/* Presenter tools: the destructive three, one intentional gesture away (UX-7) */
/* A menu in both views: one click opens it, hovering a row flies out the
   things that row can delete. The hidden .ptbody keeps the real controls. */
.presenterTools { position: relative; }
.presenterTools > .ptbody { display: none !important; }
.ptCaret { font-size: .7em; margin-left: .2rem; }
.ptMenu, .ptSub {
  position: absolute; z-index: 50; min-width: 13rem;
  background: var(--card); color: var(--ink);
  border: 1.5px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow-lg);
  padding: .3rem 0; font-size: .86rem;
}
.ptMenu { top: calc(100% + .35rem); left: 0; }
.ptMenu[hidden] { display: none; }
.ptItem {
  position: relative; display: flex; align-items: center; justify-content: space-between;
  gap: 1.2rem; padding: .5rem .9rem; cursor: pointer; white-space: nowrap; outline: none;
}
.ptItem:hover, .ptItem:focus-visible, .ptItem.ptOpen { background: var(--paper-deep); }
.ptArrow { font-size: .8em; color: var(--ink-soft); }
.ptDanger { color: var(--danger); font-weight: 700; }
.ptSep { height: 1px; margin: .3rem 0; background: var(--rule); }
/* the flyout sits flush with its row; overlapping the border by a pixel means
   the pointer never crosses a gap on its way in and closes it */
.ptSub { display: none; top: -.3rem; left: calc(100% - 2px); max-height: 60vh; overflow-y: auto; max-width: 30rem; }
.ptItem:hover > .ptSub, .ptItem.ptOpen > .ptSub { display: block; }
.ptSub .ptItem { display: block; overflow: hidden; text-overflow: ellipsis; color: var(--ink); font-weight: 400; }
.ptSub .ptItem:hover, .ptSub .ptItem:focus-visible { background: var(--danger); color: var(--paper); }
.ptSub .ptEmpty { padding: .5rem .9rem; color: var(--ink-soft); font-style: italic; white-space: nowrap; }
/* narrow screens: no room to fly right, so the submenu drops in below */
@media (max-width: 640px) {
  .ptSub { position: static; box-shadow: none; border: 0; border-radius: 0; padding-left: .8rem; max-width: none; }
}

/* ============ Results panel (UX-3 / DM-1) ============
   Four questions an executive actually asks: how much, how fresh, did it
   work, what does it say. Every figure is read live - a field that cannot be
   read is omitted, never filled with a placeholder. */
#results { margin-bottom: 1.1rem; }
#results:empty { display: none; }
.rp {
  background: var(--card-2); border: 1.5px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); padding: .8rem .95rem; animation: rise .3s ease both;
}
.rphead {
  display: flex; align-items: baseline; justify-content: space-between; gap: .8rem;
  flex-wrap: wrap; margin-bottom: .7rem;
}
.rptitle { font-family: var(--font); font-weight: 800; font-size: 1rem; letter-spacing: -.01em; }
.rptitle small { font-variant: small-caps; letter-spacing: .16em; font-size: .66rem;
  color: var(--ink-soft); font-family: var(--font); font-weight: 400; display: block; }
.rpsched { font-size: .76rem; color: var(--ink-soft); font-style: italic; }
.rpfigs { display: flex; flex-wrap: wrap; gap: .9rem 1.6rem; }
.rpfig { min-width: 7.5rem; }
.rpfig .k { font-variant: small-caps; letter-spacing: .14em; font-size: .68rem; color: var(--ink-soft); }
.rpfig .v { font-family: var(--font); font-weight: 800; font-size: 1.35rem; line-height: 1.2; }
.rpfig .s { font-size: .74rem; color: var(--ink-soft); font-style: italic; }
/* status by colour AND shape - never colour alone */
.rpdot { font-size: .9rem; margin-right: .3rem; }
.rpok { color: var(--teal-text); }
.rpbad { color: var(--danger); }
.rpwarn { color: var(--amber-text); }
.rprun { color: var(--cyan-text); }
.rpstrip { margin-top: .8rem; font-size: .78rem; color: var(--ink-soft); }
.rpstrip .b { font-size: 1rem; letter-spacing: .1em; }
.rptable { margin-top: .8rem; overflow-x: auto; }
.rptable table { border-collapse: collapse; font-size: .76rem; width: 100%; }
.rptable th, .rptable td {
  border-bottom: 1px solid var(--rule); padding: .22rem .5rem; text-align: left;
  white-space: nowrap; max-width: 14rem; overflow: hidden; text-overflow: ellipsis;
}
.rptable th { font-variant: small-caps; letter-spacing: .1em; color: var(--ink-soft); font-weight: 400; }
.rpact { margin-top: .7rem; display: flex; gap: .5rem; flex-wrap: wrap; }
.rpact button {
  font-family: var(--font); font-weight: 700; font-size: .74rem;
  background: var(--card); color: var(--ink); border: 1.5px solid var(--rule);
  border-radius: 7px; padding: .3rem .7rem; cursor: pointer;
}
.rpact button:hover { border-color: var(--teal); color: var(--teal-text); }

/* ---- Transform preview: the SQL step's result table --------------------
   Two presentations of the same payload. Technical keeps every column and its
   SQL type, because that is what the target DDL is built from. Executive shows
   the ANSWER - humanised headers, aligned numbers, no type noise. */
.pvw { margin-top: .5rem; }
.pvwhead {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: .8rem; flex-wrap: wrap; margin-bottom: .35rem;
}
.pvwtitle { font-variant: small-caps; letter-spacing: .14em; font-size: .7rem; color: var(--ink-soft); }
.pvwcount { font-size: .72rem; color: var(--ink-soft); font-style: italic; }
.pvwrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 7px; background: var(--card); }
.pvw table { border-collapse: collapse; width: 100%; font-size: .76rem; }
.pvw th, .pvw td {
  padding: .3rem .55rem; text-align: left; border-bottom: 1px solid var(--rule);
  white-space: nowrap; max-width: 16rem; overflow: hidden; text-overflow: ellipsis;
}
.pvw thead th { background: var(--card-2); position: sticky; top: 0; }
.pvw tbody tr:last-child td { border-bottom: 0; }
.pvw .num { text-align: right; font-variant-numeric: tabular-nums; }
.pvw .nul { color: var(--ink-soft); font-style: italic; }
/* technical: the column name is the thing, its SQL type sits under it */
.pvw .cname { display: block; font-weight: 700; color: var(--ink); }
.pvw .ctype {
  display: block; font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: .64rem; font-weight: 400; color: var(--ink-soft); letter-spacing: 0;
}
.pvw td { font-family: ui-monospace, Menlo, Consolas, monospace; }
.pvw details { margin-top: .4rem; }
.pvw summary {
  cursor: pointer; font-variant: small-caps; letter-spacing: .1em;
  font-size: .68rem; color: var(--ink-soft);
}
.pvw details pre {
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .68rem;
  color: var(--ink-soft); margin-top: .3rem; white-space: pre-wrap;
}
/* executive: bigger, calmer, no monospace, no types */
body[data-view="executive"] .pvw table { font-size: .88rem; }
body[data-view="executive"] .pvw td { font-family: var(--font); }
body[data-view="executive"] .pvw th { font-family: var(--font); }
body[data-view="executive"] .pvw th, body[data-view="executive"] .pvw td { padding: .42rem .7rem; }
body[data-view="executive"] .pvwtitle { font-size: .74rem; color: var(--teal-text); }

/* ============ Narrative surfaces ============ */
/* BS-1: one business-outcome line above the existing procedural guidance */
.wmsg .outcome {
  display: block; font-family: var(--font); font-weight: 700;
  font-size: 0.95rem; line-height: 1.35; letter-spacing: -.01em;
  color: var(--teal-text); margin-bottom: .45rem;
}
/* While the opening card is up it is the ONLY thing in the conversation. The
   tab behind it has already rendered its guide and picker by then (the card is
   prepended after ensureOpt resolves), so they are hidden rather than deferred
   - that keeps the tab's own state intact and makes Start a pure reveal. */
#convo.openingOnly > *:not(.opening) { display: none; }

/* UX-1: the opening card - the business question before any mechanics */
.wmsg.opening {
  align-self: center; max-width: 96%; text-align: center;
  background: var(--card); border: 1.5px solid var(--teal); border-radius: 11px;
  box-shadow: var(--shadow-lg); padding: 1.5rem 1.6rem;
}
.wmsg.opening .oq {
  font-family: var(--font); font-weight: 800; letter-spacing: -.015em;
  font-size: clamp(1.15rem, 2.6vw, 1.7rem); line-height: 1.25; margin-bottom: .9rem;
}
.wmsg.opening ul { list-style: none; display: flex; flex-direction: column; gap: .3rem;
  margin: 0 0 1.1rem; font-size: .95rem; color: var(--ink-soft); }
.wmsg.opening .eap { font-size: .74rem; font-style: italic; color: var(--ink-soft); margin-top: 1rem; }
/* BS-2: the closing before/after */
.wmsg.closing { align-self: center; max-width: 96%; background: var(--card);
  border: 1.5px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); padding: 1rem 1.1rem; }
.closegrid { display: grid; grid-template-columns: 1fr 1fr; gap: .1rem 1.3rem; font-size: .88rem; }
.closegrid .h { font-variant: small-caps; letter-spacing: .12em; font-size: .74rem;
  color: var(--ink-soft); border-bottom: 1.5px solid var(--rule); padding-bottom: .3rem; margin-bottom: .4rem; }
.closegrid .h.now { color: var(--teal-text); }
.closegrid .c { padding: .18rem 0; }
.closegrid .c.now { color: var(--ink); }
.closegrid .c.was { color: var(--ink-soft); }
.closegrid .c.big { font-family: var(--font); font-weight: 800; font-size: 1.05rem; }
.wmsg.closing .qualifier { font-size: .74rem; font-style: italic; color: var(--ink-soft); margin-top: .7rem; }
@media (max-width: 620px) { .closegrid { grid-template-columns: 1fr; } }

/* EH-1: inline, non-blocking failure card - replaces alert() on the demo path */
.wmsg.errorcard {
  align-self: flex-start; max-width: 92%; margin-left: 1.1rem;
  background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--danger);
  border-radius: 8px; padding: .6rem .85rem; font-size: .9rem;
}
.wmsg.errorcard .ehead { font-weight: 700; color: var(--danger); }
.wmsg.errorcard details { margin-top: .35rem; }
.wmsg.errorcard summary { cursor: pointer; font-size: .76rem; color: var(--ink-soft);
  font-variant: small-caps; letter-spacing: .1em; }
.wmsg.errorcard pre { font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: .72rem; margin-top: .35rem; color: var(--ink-soft); }

/* scrollbars */
#convo::-webkit-scrollbar, #right::-webkit-scrollbar, #events::-webkit-scrollbar { width: 10px; }
#convo::-webkit-scrollbar-thumb, #right::-webkit-scrollbar-thumb, #events::-webkit-scrollbar-thumb {
  background: var(--rule); border-radius: 7px; }

@media (max-width: 720px) {
  main { grid-template-columns: 1fr; }
  #left { border-right: 0; border-bottom: 1.5px solid var(--rule); }
}
</style>
</head>
<body>
<header>
  <!-- one row: title, pipeline actions, then status and view controls -->
  <div class="toolbar">

      <h1><span class="t-etl">Data </span><span class="t-wiz">Integrator</span></h1>
    </div>
    <div class="tgroup">
      <select id="pipelist" title="ETLs created so far"></select>
      <button id="loadchart" class="btn" title="Show this pipeline's flowchart and run history">Flowchart</button>
      <button id="runpipe" class="btn accent" title="Execute the deployed pipeline (no LLM)">&#9654; Run</button>
    </div>
    <span class="tsep"></span>
    <!-- UX-7: every destructive control, and the pickers that ONLY feed them.
         In Technical view the whole group sits in the bar exactly as before; in
         Executive view the disclosure closes over it, so nothing destructive is
         one click away. Nothing is removed and the confirm() dialogs are
         untouched.
         The table and model pickers live in here because their only purpose is
         to choose what gets deleted - leaving them outside put a destructive
         control's argument in the main toolbar while hiding the verb. -->
    <!-- The menu is the only visible surface. The original pickers and buttons
         below stay in the DOM, hidden, because every refresh*() and delete
         handler reads them: a menu entry just selects the option and clicks
         the button, so the confirm() dialogs are exactly the ones they were. -->
    <div id="presenterTools" class="presenterTools">
      <button id="ptBtn" class="btn" type="button" aria-haspopup="menu" aria-expanded="false"
              title="Destructive actions - deleting a pipeline, dropping a table, an ML model, an MCP tool or a knowledge base, clearing everything">Presenter tools <span class="ptCaret">&#9662;</span></button>
      <div id="ptMenu" class="ptMenu" role="menu" hidden>
        <div class="ptItem" role="menuitem" aria-haspopup="menu" tabindex="-1" data-sel="pipelist" data-btn="delpipe" data-empty="No pipelines yet">Delete pipeline<span class="ptArrow">&#9656;</span><div class="ptSub" role="menu"></div></div>
        <div class="ptItem" role="menuitem" aria-haspopup="menu" tabindex="-1" data-sel="tablelist" data-btn="deltable" data-empty="No tables yet">Drop table<span class="ptArrow">&#9656;</span><div class="ptSub" role="menu"></div></div>
        <div class="ptItem" role="menuitem" aria-haspopup="menu" tabindex="-1" data-sel="mlmodellist" data-btn="delmodel" data-empty="No models yet">Delete ML model<span class="ptArrow">&#9656;</span><div class="ptSub" role="menu"></div></div>

        <div class="ptItem" role="menuitem" aria-haspopup="menu" tabindex="-1" data-sel="kglist" data-btn="delkg" data-empty="No knowledge bases yet">Clear knowledge base<span class="ptArrow">&#9656;</span><div class="ptSub" role="menu"></div></div>
        <div class="ptSep" role="separator"></div>

      </div>

    <!-- status, audience view and display controls share the action row,
         pushed to its right-hand end -->

           able to read the state from across the room, and an engineer has to

       (connections + mounted tables) and has no flowchart; ETL Interop builds
       one ETL at a time from tables that already exist, and owns the chart. -->
  <div class="tabbar" role="tablist">
    <button class="tab" id="tab_sources" data-tab="sources" role="tab">Data Sources</button>
    <button class="tab" id="tab_etl" data-tab="etl" role="tab">ETL Interop</button>

    <button class="tab" id="tab_mcp" data-tab="mcp" role="tab">MCP Tools</button>

<main>

  </section>
  <section id="right">
    <h3 id="charttitle">Pipeline flowchart <small>&middot; the logic you are building</small></h3>
    <div id="runbanner"></div>
    <!-- UX-3 / DM-1: the outcome panel, above the flowchart. Rendered in both
         views - it is a product improvement, not a demo prop. -->
    <div id="results"></div>
    <div id="flow"></div>
    <div id="runhistory"></div>
    <details id="log" class="techOnly"><summary>Event log (seq-replayed)</summary><div id="events"></div></details>
  </section>
