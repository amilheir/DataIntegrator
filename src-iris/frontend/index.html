/* ---- ETL Interop ------------------------------------------------------- */
// The ETL name is load-bearing: it names the pipeline in the picker and the
// flowchart, and transform-deploy derives the staging/target table names and
// the production host names from it. So it must be a legal SQL identifier.
function sqlSafeName(raw) {
  const out = String(raw || "").trim().replace(/[^A-Za-z0-9_]/g, "_").replace(/^_+|_+$/g, "");
  // An SQL identifier cannot start with a digit, so a file like
  // "2INMETSAOPAULO2025.CSV" yielded the base name "2INMETSAOPAULO2025" and the
  // server rejected the deploy with a bare "invalid baseName". Prefix it the
  // way SafeColumnName() does on the ObjectScript side.
  return /^[0-9]/.test(out) ? "t_" + out : out;
}
function defaultEtlName() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `etl_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}
// Apply the typed name to the pipeline created earlier by ensureEtlSession.
async function renameEtl(name) {
  if (!name || name === wiz.etlName) { wiz.etlName = name; return; }
  const pid = $("pipeid").value;
  if (pid) {
    const j = await (await fetch(api(`/pipeline/${pid}/rename`), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    })).json();
    if (j.error) { alert(j.error); throw new Error(j.error); }
    await refreshPipelines(pid);
  }
  wiz.etlName = name;
  wiz.pipelineName = name;
}
// Starts at table selection. The pipeline is created on the first action that
// needs one, so browsing this tab costs nothing.
async function ensureEtlSession() {
  if (wiz.etlRunId) { runId = wiz.etlRunId; $("runid").value = runId; return; }
  // Created on the first table tick, because profiling posts to
  // /wizard/:runId/transform-preview. Seed it with whatever is in the name box
  // now; the Save handler applies the final name via renameEtl().
  const typed = document.querySelector(".e_name");
  const name = sqlSafeName(typed && typed.value) || defaultEtlName();
  const j = await (await fetch(api("/wizard/session"), {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name })
  })).json();
  if (j.error) throw new Error(j.error);
  wiz.etlRunId = j.runId; wiz.etlName = name; wiz.pipelineName = name;
  // when this ETL was started, for the measured elapsed figure in the closing
  // panel (BS-2). Nothing is asserted that is not read from a real clock.
  wiz.startedMs = Date.now();
  runId = j.runId; $("runid").value = j.runId; $("pipeid").value = j.pipelineId;
  lastSeq = 0; nodes.clear(); edges.length = 0; $("events").innerHTML = "";
  streamTurns.clear();   // a half-written turn from the previous run is not this one's
  renderGraph();
  connect();
  await refreshPipelines(j.pipelineId);
}

/* ---- MCP Tools ---------------------------------------------------------
   Publishes the target tables this wizard built as MCP tools, so an external
   assistant can query them and chart the answers (mds/mcp-tab-plan.md).

   One fixed endpoint, one regenerated ToolSet: publishing rewrites the whole
   tool list rather than appending to it, so what the tab shows is always what
   the endpoint serves. The server owns validation - a published tool is
   reachable with no approval step in between, so the guard cannot live in a
   textarea. */
const MCP = { endpoint: "/mcp/irisaihub", specs: [], tables: [] };

async function mcpCall(path, payload) {
  const url = api("/mcp/" + path);
  const r = await fetch(url, payload === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const text = await r.text();
  if (!text.trim()) {
    const why = `The server returned an empty response (HTTP ${r.status}).`;
    wfail(why, `/mcp/${path} -> HTTP ${r.status}, empty body`); throw new Error(why);
  }
  let j;
  try { j = JSON.parse(text); }
  catch (e) {
    const why = `The server answered with something that is not JSON (HTTP ${r.status}).`;
    wfail(why, text.slice(0, 600)); throw new Error(why);
  }
  if (j.error) {
    wfail(j.error, j.detail ? `${j.detail}\n\n/mcp/${path} -> HTTP ${r.status}` : `/mcp/${path} -> HTTP ${r.status}`);
    throw new Error(j.error);
  }
  return j;
}

// esc() covers & < > - correct for text and textarea bodies. Attribute values
// need the quote escaped too, and every field in the tool editor is one the
// user can type into.
const escA = s => esc(s).replace(/"/g, "&quot;");

const MCPBTN = "font-family:var(--font);font-weight:700;font-size:.74rem;" +
  "background:var(--card);color:var(--ink);border:1.5px solid var(--rule);" +
  "border-radius:7px;padding:.32rem .7rem;cursor:pointer";

async function renderMcpTab() {
  await ensureOpt();
  wguide("<b>MCP Tools.</b> Publish the tables you have built as tools an AI " +
    "assistant can call over MCP. Each tool is one SQL query with a description; " +
    "the assistant reads the descriptions, picks a tool, and charts what comes " +
    "back. Nothing is copied &mdash; every call runs against this database, and " +
    "only SELECTs can be published.", "Ai Tools", "mcp");

  let pub = { tools: [], spec: [], endpoint: MCP.endpoint };
  try { pub = await mcpCall("published"); } catch (e) { /* wfail already drew */ }
  MCP.endpoint = pub.endpoint || MCP.endpoint;
  MCP.specs = Array.isArray(pub.spec) ? pub.spec : [];
  if (pub.tools && pub.tools.length) {
    mcpDrawGraph(MCP.specs, pub.tools);
    wrecap(`<b>${pub.tools.length}</b> tool${pub.tools.length === 1 ? " is" : "s are"} published at ` +
      `<code>${esc(MCP.endpoint)}</code>${pub.publishedAt ? " &middot; " + esc(pub.publishedAt) : ""}. ` +
      `Publishing again replaces the whole list.`);
  }

  let tables = [];
  try { tables = (await mcpCall("publishable")).tables || []; } catch (e) { return; }
  MCP.tables = tables;
  if (!tables.length) {
    wmsg("formcard", `<span class="w_details">No target tables yet. Build an ETL on the ` +
      `<b>ETL Interop</b> tab first &mdash; this tab publishes what that produces.</span>`);
    return;
  }

  const rows = tables.map((t, i) =>
    `<label style="display:flex;gap:.45rem;align-items:baseline">
       <input type="checkbox" class="mcp_t" value="${escA(t.full)}" ${i === 0 ? "checked" : ""}>
       <span><b>${esc(t.name)}</b>
         <span class="w_details">${t.rows === "" ? "" : esc(t.rows) + " rows &middot; "}${(t.columns || []).length} columns</span></span>
     </label>`).join("");

  stepCard(
    `<div style="width:100%"><b>Tables to expose</b>
       <div class="w_details">Each one gets a sample-rows tool, a schema tool, and a
       grouped-totals tool for every column worth grouping by.</div>
       <div style="display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem">${rows}</div>
     </div>`,
    "Propose tools", async c => {
      const picked = Array.from(c.querySelectorAll(".mcp_t:checked")).map(x => x.value);
      if (!picked.length) { wfail("Pick at least one table to publish."); throw new Error("none picked"); }
      const specs = [];
      for (const full of picked) {
        const j = await mcpCall("propose", { table: full });
        (j.tools || []).forEach(t => specs.push(t));
      }
      // Re-proposing a table replaces its previous specs; anything published
      // for a table NOT picked this time is kept, so one table can be revised
      // without silently unpublishing the others.
      const keep = MCP.specs.filter(s => picked.indexOf(s.table) < 0);
      MCP.specs = keep.concat(specs);
      wrecap(`Proposed <b>${specs.length}</b> tool${specs.length === 1 ? "" : "s"} ` +
        `for ${picked.length} table${picked.length === 1 ? "" : "s"}` +
        `${keep.length ? `, keeping ${keep.length} already published` : ""}.`);
      mcpStepTools();
    });
}

/* Step 2: the tools themselves, editable. Deliberately shows the SQL: the
   whole point of publishing from here rather than from a config file is that
   the person who built the pipeline can read what they are about to expose. */
function mcpStepTools() {
  wguide("<b>Review the tools.</b> The <i>description</i> is what the assistant " +
    "reads to decide which tool to call &mdash; it matters more than the SQL. Test " +
    "any tool before publishing; the test runs the same query the assistant would.",
    "", "mcptools");

  const body = MCP.specs.map((t, i) => mcpToolHtml(t, i)).join("");
  const card = stepCard(
    `<div class="mcp_list" style="width:100%;display:flex;flex-direction:column;gap:.55rem">${body}</div>
     <div class="wrow" style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
       <button class="mcp_add" style="${MCPBTN}">+ Add custom tool</button>
       <span class="w_details">a question the proposed tools do not answer &mdash;
         write the SELECT yourself</span>
     </div>`,
    `Publish ${MCP.specs.length} tool${MCP.specs.length === 1 ? "" : "s"}`,
    async c => {
      mcpHarvest(c);
      const keep = MCP.specs.filter((t, i) => {
        const cb = c.querySelector(`.mcp_keep[data-i="${i}"]`);
        return !cb || cb.checked;
      });
      if (!keep.length) { wfail("Nothing left to publish - tick at least one tool."); throw new Error("empty"); }
      const res = await mcpCall("publish", { tools: keep });
      MCP.specs = keep;
      mcpDrawGraph(keep, res.tools || []);
      wrecap(`Published <b>${res.count}</b> tool${res.count === 1 ? "" : "s"} at ` +
        `<code>${esc(res.endpoint)}</code>.`);
      // the Presenter tools picker lists what the endpoint serves; it just changed
      if (typeof refreshMcpTools === "function") await0(refreshMcpTools(""));
      mcpStepConnect(res);
    });

  // Test buttons act on the CURRENT textarea contents, not on what was
  // proposed: editing the SQL and then testing the old version would be a
  // convincing lie.
  const wireTest = b => {
    b.onclick = async e => {
      e.preventDefault();
      const i = +b.dataset.i;
      mcpHarvest(card);
      const out = card.querySelector(`.mcp_out[data-i="${i}"]`);
      out.innerHTML = `<span class="w_details">running...</span>`;
      try {
        // Send the spec, not the name: the server compiles it into a throwaway
        // single-tool ToolSet and runs it through the same %AI path a published
        // tool takes, so testing an edit tests the edit.
        const res = await mcpCall("test", { tool: MCP.specs[i], args: {} });
        mcpRenderRows(out, res);
      } catch (err) {
        out.innerHTML = "";   // wfail already drew the reason as a card
      }
    };
  };
  card.querySelectorAll(".mcp_test").forEach(wireTest);

  // A tool the proposer did not think of. The proposed set covers sample rows,
  // schema and grouped totals; anything else - a filter, a join, a ratio - had
  // to be got by editing one of those into something it was not, which loses
  // the tool it was. This appends a blank one instead, edited and tested
  // through exactly the same fields, and published in the same batch.
  const addBtn = card.querySelector(".mcp_add");
  if (addBtn) addBtn.onclick = e => {
    e.preventDefault();
    mcpHarvest(card);        // keep whatever is already typed on screen
    const last = MCP.specs[MCP.specs.length - 1];
    const table = (last && last.table) || ((MCP.tables || [])[0] || {}).full || "";
    // a default name that does not collide with one already in the list
    const taken = MCP.specs.map(t => (t.name || "").toLowerCase());
    let n = 1, name = "custom_tool_1";
    while (taken.indexOf(name) >= 0) { n++; name = "custom_tool_" + n; }
    const i = MCP.specs.length;
    MCP.specs.push({ name, table, custom: 1, description: "",
                     sql: table ? `SELECT TOP 100 * FROM ${table}` : "", arguments: "", maxRows: 200 });
    card.querySelector(".mcp_list").insertAdjacentHTML("beforeend", mcpToolHtml(MCP.specs[i], i));
    wireTest(card.querySelector(`.mcp_test[data-i="${i}"]`));
    mcpSyncPublishLabel(card);
    // the description is the one field with no sensible default, and the one
    // the assistant actually reads - so start there
    const desc = card.querySelector(`.mcp_desc[data-i="${i}"]`);
    if (desc) { desc.placeholder = "what question does this answer? the assistant reads this to decide when to call it"; desc.focus(); }
  };
}

/* The publish button counts the tools, so it goes stale the moment one is
   added. */
function mcpSyncPublishLabel(card) {
  const btn = card.querySelector(".wsave");
  if (btn) btn.textContent = `Publish ${MCP.specs.length} tool${MCP.specs.length === 1 ? "" : "s"}`;
}

function mcpToolHtml(t, i) {
  const ta = "width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;" +
    "background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:6px;padding:.35rem";
  return `<div style="border:1.5px solid var(--rule);border-radius:8px;padding:.55rem .65rem">
    <label style="display:flex;gap:.4rem;align-items:baseline">
      <input type="checkbox" class="mcp_keep" data-i="${i}" checked>
      <input class="mcp_name" data-i="${i}" value="${escA(t.name)}" size="28"
             style="font-weight:700;font-size:.8rem">
      ${t.custom
        ? `<select class="mcp_table w_details" data-i="${i}">${
            (MCP.tables || []).map(x => `<option value="${escA(x.full)}" ${x.full === t.table ? "selected" : ""}>${esc(x.full)}</option>`).join("")
          }</select>`
        : `<span class="w_details">${esc(t.table || "")}</span>`}
    </label>
    <div style="margin-top:.4rem"><span class="w_details">description &mdash; what the assistant reads</span>
      <textarea class="mcp_desc" data-i="${i}" rows="2" style="${ta}">${esc(t.description)}</textarea></div>
    <div style="margin-top:.35rem"><span class="w_details">SQL &mdash; SELECT only</span>
      <textarea class="mcp_sql" data-i="${i}" rows="3" style="${ta}">${esc(t.sql)}</textarea></div>
    <div class="wrow" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.35rem">
      <label class="w_details">arguments
        <input class="mcp_args" data-i="${i}" value="${escA(t.arguments || "")}" size="26"></label>
      <label class="w_details">max rows
        <input class="mcp_max" data-i="${i}" type="number" min="1" max="1000" value="${+t.maxRows || 200}" size="5"></label>
      <button class="mcp_test" data-i="${i}" style="${MCPBTN}">Test</button>
    </div>
    <div class="mcp_out" data-i="${i}" style="margin-top:.35rem"></div>
  </div>`;
}

/* Read every editable field back into MCP.specs. Called before publish AND
   before test, so both act on what is on screen. */
function mcpHarvest(card) {
  MCP.specs.forEach((t, i) => {
    const q = s => card.querySelector(`${s}[data-i="${i}"]`);
    const name = q(".mcp_name"), desc = q(".mcp_desc"), sql = q(".mcp_sql");
    const args = q(".mcp_args"), max = q(".mcp_max"), tbl = q(".mcp_table");
    if (tbl) t.table = tbl.value;
    if (name) t.name = name.value.trim();
    if (desc) t.description = desc.value.trim();
    if (sql) t.sql = sql.value.trim();
    if (args) t.arguments = args.value.trim();
    if (max) t.maxRows = +max.value || 200;
  });
}

/* The test result, in the same shape an MCP client receives it. truncated is
   surfaced loudly: a truncated payload presented as a complete one is the
   failure this whole feature has to avoid. */
function mcpRenderRows(el, res) {
  const cols = res.columns || [];
  const rows = res.rows || [];
  if (!cols.length) { el.innerHTML = `<span class="w_details">no columns returned</span>`; return; }
  const exec = EXEC();
  const head = cols.map(c => exec
    ? `<th>${esc(pvwLabel(c.name))}</th>`
    : `<th><span class="cname">${esc(c.name)}</span><span class="ctype">${esc(c.type || "")}</span></th>`).join("");
  const body = rows.length
    ? rows.slice(0, 12).map(r => "<tr>" + cols.map(c => {
        const v = r ? r[c.name] : undefined;
        return `<td class="${exec && pvwIsNum(v) ? "num" : ""}">${pvwCell(v, exec)}</td>`;
      }).join("") + "</tr>").join("")
    : `<tr><td colspan="${cols.length}"><span class="nul">the query is valid but returned no rows</span></td></tr>`;
  el.innerHTML =
    `<div class="pvw">
       <div class="pvwhead">
         <span class="pvwtitle">What the assistant receives</span>
         <span class="pvwcount">${res.row_count} row${res.row_count === 1 ? "" : "s"}` +
           `${res.truncated ? " &middot; TRUNCATED at the row cap" : ""}` +
           `${res.elapsed_ms === undefined ? "" : " &middot; " + res.elapsed_ms + " ms"}</span>
       </div>
       <div class="pvwrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
     </div>`;
}

/* Step 3: how to reach it. The snippets are the whole handover - a tool list
   nobody can connect to is not a feature. */
function mcpStepConnect(res) {
  const ep = res.endpoint || MCP.endpoint;
  const toml = `endpoints = [{ path = "${ep}" }]`;
  const cfg = JSON.stringify({
    mcpServers: {
      "iris-data-integrator": {
        command: "docker",
        args: ["exec", "-i", "irisetlwizard-iris-1", "/usr/irissys/bin/iris-mcp-server",
               "--transport=stdio", "--config=/opt/irisbuild/config.toml", "run"]
      }
    }
  }, null, 2);
  const pre = "background:var(--card);border:1.5px solid var(--rule);border-radius:6px;" +
    "padding:.4rem;font-size:.7rem;overflow-x:auto;white-space:pre";
  const card = wmsg("formcard",
    `<div style="width:100%">
       <b>Connect an assistant</b>
       <div class="w_details">1 &middot; add the endpoint to <code>src-iris/config.toml</code>:</div>
       <div style="${pre}" class="mcp_toml">${esc(toml)}</div>
       <div class="w_details" style="margin-top:.4rem">2 &middot; point the client at the MCP server:</div>
       <div style="${pre}" class="mcp_cfg">${esc(cfg)}</div>
       <div class="wrow" style="display:flex;gap:.5rem;margin-top:.45rem">
         <button class="mcp_copy1" style="${MCPBTN}">Copy endpoint line</button>
         <button class="mcp_copy2" style="${MCPBTN}">Copy client config</button>
       </div>
       <div class="w_details" style="margin-top:.5rem">
         The tool list is read when the MCP server connects, so after publishing again,
         reconnect the server in your client to pick up the change. If calls start
         failing with <code>Broken pipe</code> while the tool list still looks healthy,
         that is a stale pooled connection &mdash; reconnect and it clears.
       </div>
     </div>`);
  const copy = (btn, text) => {
    btn.onclick = e => {
      e.preventDefault();
      navigator.clipboard.writeText(text).then(
        () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = btn.dataset.lab; }, 1400); },
        () => { btn.textContent = "Copy failed"; });
    };
  };
  const b1 = card.querySelector(".mcp_copy1"), b2 = card.querySelector(".mcp_copy2");
  b1.dataset.lab = b1.textContent; b2.dataset.lab = b2.textContent;
  copy(b1, toml); copy(b2, cfg);

  wguide("Ask the assistant something like <i>&ldquo;chart revenue by country from " +
    "the Data Integrator tables&rdquo;</i>. It will call the schema tool first, then " +
    "the grouped-totals tool, and draw the chart from what comes back.");
}

/* The right pane: not a pipeline, an inventory. Each table fans out into the
   tools published over it, and every tool feeds the one endpoint. */
function mcpDrawGraph(specs, tools) {
  nodes.clear(); edges.length = 0;
  const byName = {};
  (specs || []).forEach(s => { byName[s.name] = s; });
  const tbls = new Set();
  const list = (tools && tools.length) ? tools.map(t => t.name) : (specs || []).map(s => s.name);

  list.forEach(name => {
    const spec = byName[name] || {};
    const tbl = spec.table || "";
    if (tbl) {
      const tid = "mcp:tbl:" + tbl;
      if (!tbls.has(tbl)) {
        tbls.add(tbl);
        nodes.set(tid, { nodeId: tid, name: tbl, kind: "target", status: "succeeded", order: 7 });
      }
      edges.push({ from: tid, to: "mcp:tool:" + name, label: "" });
    }
    nodes.set("mcp:tool:" + name, {
      nodeId: "mcp:tool:" + name, name: name, kind: "mcp_tool", status: "succeeded",
      detail: (spec.arguments || ""), order: 10
    });
    edges.push({ from: "mcp:tool:" + name, to: "mcp:endpoint", label: "" });
  });
  if (list.length) {
    nodes.set("mcp:endpoint", { nodeId: "mcp:endpoint", name: MCP.endpoint,
      kind: "mcp_endpoint", status: "succeeded", detail: "MCP", order: 11 });
  }
  graphFrozen = true; wizGraphActive = false;
  renderGraph();
  $("runbanner").innerHTML = list.length
    ? `<b>${list.length}</b> tool${list.length === 1 ? "" : "s"} at <b>${esc(MCP.endpoint)}</b>`
    : "Nothing published yet.";
}

/* ---- Knowledge Base -----------------------------------------------------
   Two sections behind one tab:
     Embedding          - turn a text column into vectors (+ optional graph)
     Chat / Knowledge graph - ask the embedded data; the graph draws on the right

   Ingestion is driven one BATCH per request from here rather than one long
   server call: a batch is seconds, a full run can be hours, and the webgateway
   gives up at ~60s. The loop below is therefore the progress bar, the stop
   button and the timeout protection all at once. The chat is asynchronous for
   the same reason - a question is a row the server works on and this polls. */
const KG = { section: "embed", corpusId: null, corpus: null, corpora: [],
             running: false, stop: false, info: null };

/* Is the newest-at-top thread on screen? The scroll behaviour of the whole
   conversation pane depends on it, so both places ask the same question. */
function kgChatOpen() {
  return activeTab === "kg" && KG.section === "chat";
}

async function kgCall(path, payload) {
  const r = await fetch(api("/kg/" + path), payload === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const text = await r.text();
  if (!text.trim()) {
    const why = `The server returned an empty response (HTTP ${r.status}).`;
    wfail(why, `/kg/${path} -> HTTP ${r.status}, empty body`); throw new Error(why);
  }
  let j;
  try { j = JSON.parse(text); }
  catch (e) {
    const why = `The server answered with something that is not JSON (HTTP ${r.status}).`;
    wfail(why, text.slice(0, 600)); throw new Error(why);
  }
  if (j.error) {
    wfail(j.error, j.detail ? `${j.detail}\n\n/kg/${path} -> HTTP ${r.status}` : `/kg/${path} -> HTTP ${r.status}`);
    throw new Error(j.error);
  }
  return j;
}

const KGBTN = "font-family:var(--font);font-weight:700;font-size:.74rem;" +
  "background:var(--card);color:var(--ink);border:1.5px solid var(--rule);" +
  "border-radius:7px;padding:.32rem .7rem;cursor:pointer";

/* The tab is a shell: a section switcher plus whichever section is active.
   Switching rebuilds #convo rather than caching both, because the two sections
   share the right-hand pane and a stale graph beside a live chat is worse than
   a redraw. */
async function renderKgTab() {
  await ensureOpt();
  try { KG.info = await kgCall("candidates"); } catch (e) { return; }
  try { KG.corpora = (await kgCall("corpus")).corpora || []; } catch (e) { KG.corpora = []; }
  if (!KG.corpusId && KG.corpora.length) {
    const ready = KG.corpora.find(c => c.chunksIngested > 0);
    if (ready) { KG.corpusId = ready.id; KG.corpus = ready; }
  }
  kgRenderSection();
}

function kgNav() {
  const tab = (id, label) =>
    `<button class="kgnavbtn${KG.section === id ? " on" : ""}" data-sec="${id}">${label}</button>`;
  const nav = wmsg("kgnav",
    `<div class="kgnavrow">${tab("embed", "Embedding")}${tab("chat", "Chat &amp; Knowledge graph")}</div>`);
  nav.querySelectorAll(".kgnavbtn").forEach(b => {
    b.onclick = e => {
      e.preventDefault();
      if (KG.running) { wfail("Embedding is still running - stop it first."); return; }
      KG.section = b.dataset.sec;
      kgRenderSection();
    };
  });
  return nav;
}

function kgRenderSection() {
  // scoped to this section, not the tab: the Embedding section keeps the
  // standard grounds
  document.body.classList.toggle("kgchat", KG.section === "chat");
  $("convo").replaceChildren();
  kgNav();
  if (KG.section === "chat") { kgSectionChat(); } else { kgSectionEmbed(); }
}

/* ---- section 1: Embedding ---------------------------------------------- */
function kgSectionEmbed() {
  wguide("<b>Embedding.</b> Point this at a table column holding free text &mdash; " +
    "product descriptions, feedback, log lines. Each row is embedded inside IRIS " +
    "and, optionally, mined for entities and relationships. Nothing is copied " +
    "anywhere: the vectors and the graph live in this database beside the data " +
    "they came from.", "", "kg");

  const cands = (KG.info && KG.info.tables) || [];
  if (!cands.length) {
    wmsg("formcard", `<span class="w_details">No target tables yet. Build an ETL on the ` +
      `<b>ETL Interop</b> tab first &mdash; this tab reads what that produces.</span>`);
    return;
  }

  const tableOpts = cands.map(t =>
    `<option value="${escA(t.full)}">${esc(t.full)} &middot; ${esc(t.rows)} rows</option>`).join("");
  const card = stepCard(
    `<div style="width:100%">
       <b>Text to embed</b>
       <div class="w_details">Pick the table and the column holding the prose. The
       label column prefixes each chunk before embedding, which separates senses
       in vector space &mdash; a product name or a ticket subject works well.</div>
       <div class="wrow" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.5rem">
         <label>Table <select class="kg_table">${tableOpts}</select></label>
         <label>Text column <select class="kg_text"></select></label>
         <label>Label column <select class="kg_label"></select></label>
       </div>
       <div class="kg_profile w_details" style="margin-top:.45rem"></div>
       <!-- Only appears once this column already HAS a knowledge base: with
            nothing to be incremental against the choice is not a choice. -->
       <div class="kg_mode" style="display:none;margin-top:.5rem">
         <div class="kgnavrow">
           <button class="kgnavbtn on" data-mode="incremental">Incremental</button>
           <button class="kgnavbtn" data-mode="redo">Redo</button>
         </div>
         <div class="kg_modenote w_details" style="margin-top:.3rem"></div>
       </div>
       <div class="wrow" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.35rem">
         <label>Rows <input class="kg_rows" type="number" min="1" max="100000" value="500" size="6"></label>
         <label style="display:flex;gap:.3rem;align-items:baseline">
           <input type="checkbox" class="kg_extract"> build the entity graph too</label>
       </div>
       <div class="kg_extractwarn w_details" style="margin-top:.3rem"></div>
     </div>`,
    "Start embedding", async c => {
      const spec = {
        table: c.querySelector(".kg_table").value,
        textColumn: c.querySelector(".kg_text").value,
        labelColumn: c.querySelector(".kg_label").value,
        rowLimit: +c.querySelector(".kg_rows").value || 500,
        extractGraph: c.querySelector(".kg_extract").checked ? 1 : 0,
        mode: mode
      };
      const started = await kgCall("start", spec);
      KG.corpusId = started.id; KG.corpus = started;
      wrecap(`${spec.mode === "incremental" ? "Updating" : "Embedding"} ` +
        `<b>${esc(spec.textColumn)}</b> from <b>${esc(spec.table)}</b>` +
        `${spec.extractGraph ? ", with graph extraction" : ""}.`);
      kgStepRun();
    });

  const tableSel = card.querySelector(".kg_table");
  const textSel = card.querySelector(".kg_text");
  const labelSel = card.querySelector(".kg_label");
  const profileBox = card.querySelector(".kg_profile");
  const warnBox = card.querySelector(".kg_extractwarn");
  const modeBox = card.querySelector(".kg_mode");
  const modeNote = card.querySelector(".kg_modenote");
  // Redo is the default only because it is the only thing that works on a column
  // nobody has embedded yet. As soon as there IS a knowledge base, runProfile
  // flips this to incremental - repeating work is never the sensible default.
  let mode = "redo", existing = null;

  const paintMode = () => {
    modeBox.querySelectorAll(".kgnavbtn").forEach(b =>
      b.classList.toggle("on", b.dataset.mode === mode));
    if (!existing) { modeNote.innerHTML = ""; return; }
    const have = `<b>${existing.docs}</b> row(s) and <b>${existing.chunksIngested}</b> chunk(s) ` +
      `already embedded as <b>${esc(existing.name)}</b>`;
    modeNote.innerHTML = mode === "incremental"
      ? `${have}. Rows it already holds are compared by content and skipped; only ` +
        `new rows, and rows whose text has changed, are embedded. Changed rows have ` +
        `their old chunks and facts replaced, not duplicated. <b>Rows</b> below caps ` +
        `how many NEW rows this pass will take.`
      : `${have} &mdash; and a redo builds a second knowledge base from scratch, ` +
        `embedding every row again. Use it when the text means something different ` +
        `now, or when you changed the chunk size or the label column.`;
  };
  modeBox.querySelectorAll(".kgnavbtn").forEach(b => {
    b.onclick = e => { e.preventDefault(); mode = b.dataset.mode; paintMode(); };
  });

  const fillColumns = () => {
    const t = cands.find(x => x.full === tableSel.value);
    if (!t) return;
    textSel.innerHTML = (t.textColumns || []).map(c =>
      `<option value="${escA(c.name)}">${esc(c.name)}</option>`).join("");
    labelSel.innerHTML = `<option value="">&mdash; none &mdash;</option>` +
      (t.columns || []).map(c => `<option value="${escA(c)}">${esc(c)}</option>`).join("");
    await0(runProfile());
  };
  // The profile MEASURES a real embedding round-trip, so the time estimate the
  // user reads is this machine's number and not a constant from a document.
  const runProfile = async () => {
    profileBox.innerHTML = `<span class="kgpulse">measuring on this machine...</span>`;
    try {
      const p = await kgCall("profile", {
        table: tableSel.value, column: textSel.value });
      existing = (p.existing && p.existing.id) ? p.existing : null;
      mode = existing ? "incremental" : "redo";
      modeBox.style.display = existing ? "" : "none";
      paintMode();
      const want = +card.querySelector(".kg_rows").value || 500;
      const ms = +p.msPerRow || 0;
      const est = ms ? kgDuration((ms * Math.min(want, p.embeddableRows)) / 1000) : "unknown";
      const all = ms ? kgDuration((ms * p.embeddableRows) / 1000) : "unknown";
      profileBox.innerHTML =
        `<b>${p.embeddableRows}</b> of ${p.rows} rows have text worth embedding &middot; ` +
        `average ${p.avgChars} characters &middot; measured <b>${ms} ms</b> per row here.<br>` +
        `${Math.min(want, p.embeddableRows)} rows &asymp; <b>${est}</b>. ` +
        `The whole column would be <b>${all}</b>.`;
    } catch (e) { profileBox.innerHTML = ""; }
  };
  tableSel.onchange = fillColumns;
  textSel.onchange = () => await0(runProfile());
  card.querySelector(".kg_rows").onchange = () => await0(runProfile());
  // Extraction is the expensive half by a wide margin and the user should see
  // that before ticking it, not after waiting.
  card.querySelector(".kg_extract").onchange = e => {
    warnBox.innerHTML = e.target.checked
      ? `Graph extraction calls <b>${esc((KG.info && KG.info.extractModel) || "the local model")}</b> once per chunk. ` +
        `Measured here at about <b>40 s per chunk</b> &mdash; roughly 1000&times; the cost of ` +
        `embedding, so keep the row count small while you judge the quality.`
      : "";
  };
  fillColumns();
}

function kgDuration(seconds) {
  if (!isFinite(seconds)) return "unknown";
  if (seconds < 90) return `${Math.round(seconds)} s`;
  if (seconds < 5400) return `${Math.round(seconds / 60)} min`;
  return `${(seconds / 3600).toFixed(1)} hours`;
}

/* The batch loop. Every iteration is one server call that commits, so Stop is
   instant and a failure costs one batch rather than the run. The animation is
   not decoration: embedding a batch is silent server-side work with no
   intermediate output, so without it a slow batch is indistinguishable from a
   hang. */
function kgStepRun() {
  const card = wmsg("formcard",
    `<div style="width:100%">
       <div class="kgbar"><div class="kgbarfill"></div></div>
       <div class="kg_prog" style="margin-top:.5rem"><b class="kgpulse">Starting...</b></div>
       <div class="wrow" style="display:flex;gap:.5rem;margin-top:.45rem">
         <button class="kg_stop" style="${KGBTN}">Stop</button>
       </div>
     </div>`);
  const prog = card.querySelector(".kg_prog");
  const bar = card.querySelector(".kgbar");
  const fill = card.querySelector(".kgbarfill");
  card.querySelector(".kg_stop").onclick = e => { e.preventDefault(); KG.stop = true; };

  KG.stop = false; KG.running = true;
  const started = Date.now();
  (async () => {
    try {
      for (;;) {
        if (KG.stop) {
          await kgCall(`corpus/${KG.corpusId}/cancel`, {});
          prog.innerHTML = "<b>Stopped.</b> What was embedded is kept.";
          break;
        }
        const s = await kgCall(`corpus/${KG.corpusId}/run`, {});
        KG.corpus = s;
        const secs = (Date.now() - started) / 1000;
        const rate = s.rowsIngested ? (s.rowsIngested / secs).toFixed(1) : "0";
        // An incremental pass has no meaningful denominator: it embeds however
        // many rows turn out to be new, and mostly scans. A bar filling towards
        // the row CAP would read as progress towards a number nobody wants to
        // reach, so there is no bar on that path.
        const inc = s.ingestMode === "incremental";
        bar.style.display = inc ? "none" : "";
        const pct = s.rowsRequested ? Math.min(100, (s.rowsIngested / s.rowsRequested) * 100) : 0;
        fill.style.width = pct + "%";
        prog.innerHTML =
          (inc ? `<b>${s.rowsIngested}</b> new or changed rows embedded &middot; `
               : `<b>${s.rowsIngested}</b> of ${s.rowsRequested} rows &middot; `) +
          `<b>${s.chunksIngested}</b> chunks` +
          `${s.entities ? ` &middot; <b>${s.entities}</b> entities, ${s.relationships} relationships` : ""}<br>` +
          `<span class="w_details"><span class="kgpulse">${esc(s.statusDetail || "")}</span> &middot; ` +
          `${rate} rows/sec &middot; ${kgDuration(secs)} elapsed</span>`;
        if (s.entities) await0(kgDrawGraph());
        if (s.done) {
          prog.innerHTML += `<br><b>${esc(s.status)}.</b>`;
          break;
        }
      }
    } catch (e) {
      prog.innerHTML += `<br><span class="w_details">stopped: ${esc(String(e.message || e))}</span>`;
    } finally {
      KG.running = false;
      bar.classList.add("kgdone");
      card.querySelector(".kg_stop").disabled = true;
      try { KG.corpora = (await kgCall("corpus")).corpora || []; } catch (e) {}
      await0(kgDrawGraph());
      const go = wmsg("formcard",
        `<div style="width:100%"><b>Embedded.</b>
           <div class="w_details">Ask it something, and see the graph it built.</div>
           <div class="wrow" style="margin-top:.45rem">
             <button class="kg_tochat" style="${KGBTN}">Open Chat &amp; Knowledge graph</button>
           </div></div>`);
      go.querySelector(".kg_tochat").onclick = e => {
        e.preventDefault(); KG.section = "chat"; kgRenderSection();
      };
      await0(kgRefreshPresenter());
    }
  })();
}

/* ---- section 2: Chat / Knowledge graph ---------------------------------- */
function kgSectionChat() {
  const ready = KG.corpora.filter(c => c.chunksIngested > 0);
  if (!ready.length) {
    wmsg("formcard", `<span class="w_details">Nothing is embedded yet. Use the ` +
      `<b>Embedding</b> section first.</span>`);
    return;
  }
  if (!KG.corpusId || !ready.some(c => String(c.id) === String(KG.corpusId))) {
    KG.corpusId = ready[0].id; KG.corpus = ready[0];
  }

  const opts = ready.map(c =>
    `<option value="${escA(c.id)}"${String(c.id) === String(KG.corpusId) ? " selected" : ""}>` +
    `${esc(c.name)} &middot; ${c.chunksIngested} chunks` +
    `${c.entities ? " &middot; " + c.entities + " entities" : ""}</option>`).join("");
  const picker = wmsg("formcard",
    `<div style="width:100%;display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap">
       <label>Answer from <select class="kg_corpus">${opts}</select></label>
     </div>`);
  picker.querySelector(".kg_corpus").onchange = async e => {
    KG.corpusId = e.target.value;
    KG.corpus = ready.find(c => String(c.id) === String(e.target.value));
    await0(kgDrawGraph());
  };

  wguide("<b>Ask the data.</b> This searches the vectors, not the words &mdash; " +
    "the match is on meaning, so a question phrased nothing like the text still " +
    "finds it. Answers are written from the records it retrieved, and the graph " +
    "on the right is what was mined from the same data.");

  const bar = wmsg("formcard",
    `<div style="width:100%;display:flex;gap:.5rem">
       <input class="kg_q" placeholder="ask a question..." style="flex:1">
       <button class="kg_go" style="${KGBTN}">Ask</button>
     </div>`);
  const input = bar.querySelector(".kg_q");
  const go = bar.querySelector(".kg_go");

  const ask = async () => {
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    go.disabled = true; input.disabled = true;
    // Each exchange is its own block inserted DIRECTLY BELOW the input, so the
    // newest answer is the one under your eyes and older turns move down. A
    // chat that appends downward buries the reply you are waiting for beneath
    // the fold the moment the thread is more than a screen long.
    const turn = document.createElement("div");
    turn.className = "kgturn";
    bar.after(turn);
    kgBubble("user", q, turn);
    // Show the turn that was just started, wherever the reader had scrolled to.
    $("convo").scrollTop = 0;
    // A live status bubble, replaced in place by the answer: the model takes
    // tens of seconds and silence reads as a hang.
    const status = kgBubble("status", "searching the embedded records...", turn);
    try {
      const started = await kgCall("ask", { corpusId: KG.corpusId, question: q });
      let last = "";
      // The bubble the answer is written into while the model writes it. The
      // server streams CUMULATIVELY - `answerSoFar` is always the whole answer
      // far - because a poll is not an ordered stream: it can miss a beat or
      // coalesce two, and deltas would leave a hole. So this re-renders rather
      // than appends, which is also what markdown needs: a ** opened in one
      // batch is closed in a later one.
      let live = null;
      for (;;) {
        const s = await (await fetch(api(`/kg/ask/${started.id}`))).json();
        if (s.error) throw new Error(s.error);
        if (s.statusDetail && s.statusDetail !== last) {
          last = s.statusDetail;
          status.innerHTML = `<span class="kgpulse">${esc(s.statusDetail)}</span>`;
        }
        if (!s.done && s.answerSoFar) {
          if (!live) {
            status.remove();
            live = kgBubble("agent", "", turn);
            live.classList.add("streaming");
            live.insertAdjacentHTML("beforeend", `<span class="caret"></span>`);
            $("convo").scrollTop = 0;
          }
          live.querySelector(".kgmd").innerHTML = kgMarkdown(s.answerSoFar);
        }
        if (s.done) {
          status.remove();
          if (s.status === "error") {
            if (live) live.remove();
            wfail("The answer could not be produced.", s.statusDetail);
          } else if (live) {
            // the whole answer replaces what was streamed into the same bubble
            live.querySelector(".kgmd").innerHTML = kgMarkdown(s.answer);
            live.classList.remove("streaming");
            const caret = live.querySelector(".caret");
            if (caret) caret.remove();
            kgSources(s.hits, turn);
          } else {
            kgBubble("agent", s.answer, turn);
            kgSources(s.hits, turn);
          }
          // The answer lands tens of seconds after the question, by which time
          // the reader may have scrolled off to read an older one. Bring them
          // back to what they asked for.
          $("convo").scrollTop = 0;
          break;
        }
        // The whole answer now lands in ~2s (thinking off, see KG.Chat), so a
        // 1.5s first poll was itself most of the perceived wait. While the model
        // is writing the poll also has to be quicker than the batches (~250ms)
        // or the batching buys nothing - the effective granularity is
        // max(batch interval, poll interval), the same arithmetic as the WS tick.
        await new Promise(r => setTimeout(r, (s.status === "answering" || s.answerSoFar) ? 400 : 600));
      }
    } catch (e) {
      status.remove();
    } finally {
      go.disabled = false; input.disabled = false; input.focus();
    }
  };
  go.onclick = e => { e.preventDefault(); await0(ask()); };
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); await0(ask()); } };
  input.focus();
  await0(kgDrawGraph());
}

/* The chat model answers in markdown - bold, bullet lists, the occasional
   numbered list - and escaping it wholesale printed the syntax at the reader:
   "*   **[Reading Floor Lamp]:**". This renders the small subset the model
   actually uses.

   Order matters: the text is HTML-escaped FIRST and the markup applied to the
   escaped text afterwards, so nothing the model writes can inject an element.
   Only the tags below ever reach the page. */
function kgMarkdown(raw) {
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>")
    .replace(/(^|[\s(])_([^_\n]+)_(?=[\s).,;:!?]|$)/g, "$1<i>$2</i>");

  const out = [];
  let list = null;                 // "ul" | "ol" | null
  let para = [];
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const closePara = () => {
    if (para.length) { out.push(`<p>${para.join("<br>")}</p>`); para = []; }
  };

  String(raw || "").split(/\r?\n/).forEach(line => {
    const bullet = line.match(/^\s*[*+-]\s+(.*)$/);
    const number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const head   = line.match(/^\s*(#{1,4})\s+(.*)$/);
    if (head) {
      closePara(); closeList();
      out.push(`<b class="kgmdh">${inline(head[2])}</b>`);
    } else if (bullet) {
      closePara();
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(bullet[1])}</li>`);
    } else if (number) {
      closePara();
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(number[1])}</li>`);
    } else if (!line.trim()) {
      closePara(); closeList();
    } else {
      closeList();
      para.push(inline(line.trim()));
    }
  });
  closePara(); closeList();
  return out.join("");
}

/* `into` is the turn container. Bubbles no longer go straight to #convo,
   because the newest turn sits at the TOP of the thread. */
function kgBubble(role, text, into) {
  const div = document.createElement("div");
  div.className = "chat " + (role === "user" ? "user" : "agent");
  if (role === "status") {
    div.className = "chat agent kgstatus";
    div.innerHTML = `<span class="kgpulse">${esc(text)}</span>`;
  } else if (role === "agent") {
    div.innerHTML = `<span class="who">knowledge base</span>` +
      `<div class="kgmd">${kgMarkdown(text)}</div>`;
  } else {
    div.innerHTML = esc(text);
  }
  (into || $("convo")).appendChild(div);
  return div;
}

/* What the answer was built from. An answer with no visible evidence is a
   claim; with its records beside it, it can be checked. */
function kgSources(hits, into) {
  const chunks = (hits && hits.chunks) || [];
  if (!chunks.length) return;
  const card = kgCard(into,
    `<details style="width:100%"><summary class="w_details">the ${chunks.length} records this was answered from</summary>
       <div class="rptable" style="margin-top:.4rem"><table><thead><tr><th>score</th><th>label</th><th>text</th></tr></thead><tbody>` +
       chunks.map(h => `<tr><td class="num">${esc(h.score)}</td><td>${esc(h.label)}</td>` +
         `<td>${esc(h.text)}</td></tr>`).join("") +
     `</tbody></table></div></details>`);
  return card;
}

/* wmsg() always appends to #convo; a turn needs its card inside itself. */
function kgCard(into, html) {
  const d = el(`<div class="wmsg formcard">${html}</div>`).firstElementChild;
  (into || $("convo")).appendChild(d);
  return d;
}

/* ---- the constellation, in the right pane -------------------------------
   Not a flowchart: renderGraph() is a ranked vertical chain and a knowledge
   graph rendered through it comes out as a ladder. This is its own D3 force
   layout in the same slot, vendored rather than loaded from a CDN so it still
   draws on a conference network with no internet. */
const KG_TYPE_COLOR = {
  Person: "#2f2a95", Organization: "#00a99d", Product: "#d98a00",
  Location: "#c8553d", Event: "#2e7d32", Issue: "#ad1457", Concept: "#7b3fb3"
};

async function kgDrawGraph() {
  if (!KG.corpusId) return;
  let g;
  try { g = await (await fetch(api(`/kg/corpus/${KG.corpusId}/graph?limit=200`))).json(); }
  catch (e) { return; }
  if (!g || g.error) return;
  const flow = $("flow");
  if (!g.nodes || !g.nodes.length) {
    flow.innerHTML = "";
    $("kglegend").innerHTML = "";
    $("runbanner").innerHTML = KG.corpus && KG.corpus.chunksIngested
      ? `<b>${KG.corpus.chunksIngested}</b> chunks embedded &middot; no entity graph yet ` +
        `<span class="w_details">(tick "build the entity graph too" when embedding to extract one)</span>`
      : "Nothing embedded yet.";
    return;
  }
  $("runbanner").innerHTML =
    `<b>${g.shown}</b> entities &middot; ${g.links.length} relationships` +
    (g.linksHidden ? ` <span class="w_details">(${g.linksHidden} further link(s) between ` +
      `already-connected pairs are not drawn)</span>` : "") +
    (g.trimmed ? ` <span class="w_details">(${g.trimmed} more entities not shown)</span>` : "");

  if (typeof d3 === "undefined") {
    flow.innerHTML = `<span class="w_details">the graph renderer did not load</span>`;
    return;
  }
  // Build the box FIRST, then measure it. Measuring `flow` before the wrapper
  // exists gave a height of whatever the previous content happened to be, so
  // the viewBox and the rendered box disagreed and the graph came out as specks
  // in a field of white.
  flow.innerHTML = `<div class="kgwrap"><svg id="kgsky"></svg><div id="kglegend"></div>` +
    `<div id="kginfo"><button class="kgiclose" title="Close">&times;</button>` +
    `<div class="kginm"></div><div class="kgity"></div><div class="kgidesc"></div>` +
    `<div class="kgibody"></div></div></div>`;
  const wrap = flow.querySelector(".kgwrap");
  const w = wrap.clientWidth || 600, h = wrap.clientHeight || 520;
  const svg = d3.select("#kgsky").attr("viewBox", `0 0 ${w} ${h}`)
    .attr("preserveAspectRatio", "xMidYMid meet");
  const root = svg.append("g");
  const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", ev => root.attr("transform", ev.transform));
  svg.call(zoom);

  const nodes = g.nodes.map(n => Object.assign({}, n));
  const links = g.links.map(l => Object.assign({}, l));

  // Adjacency over EVERY relation, not the deduplicated set that gets drawn:
  // one line on screen can stand for three facts, and the info card has to list
  // all three. wikigraph makes the same split - some links to draw, all of them
  // to read.
  const byId = {}, adj = {};
  nodes.forEach(n => { byId[n.id] = n; adj[n.id] = []; });
  (g.allLinks || g.links).forEach(l => {
    const src = (l.source && l.source.id) || l.source, tgt = (l.target && l.target.id) || l.target;
    if (!adj[src] || !adj[tgt]) return;
    adj[src].push({ id: tgt, predicate: l.predicate, dir: "out" });
    adj[tgt].push({ id: src, predicate: l.predicate, dir: "in" });
  });

  // What is currently singled out. Shared with the legend rather than kept in
  // two places, because the two ways of highlighting - by type, and by node -
  // write to the same opacities and would otherwise undo each other.
  const view = { focus: null, adj: adj };

  // A soft drop shadow lifts the nodes off the ground rather than letting them
  // sit flat among the edges - wikigraph's filter, values and all.
  const defs = svg.append("defs");
  const soft = defs.append("filter").attr("id", "kgsoft")
    .attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
  soft.append("feDropShadow").attr("dx", 0).attr("dy", 1).attr("stdDeviation", 1.4)
    .attr("flood-color", "#112b4d").attr("flood-opacity", .4);

  // Size by how often the entity is mentioned, on a square root - so something
  // mentioned 25 times is five times the radius of something mentioned once,
  // not twenty-five times. Same curve wikigraph uses on degree.
  const radius = d => 5 + Math.sqrt(d.mentions || 0) * 3.2;

  const link = root.append("g").selectAll("line").data(links).join("line")
    .attr("class", "kglink");
  const label = root.append("g").selectAll("text").data(links).join("text")
    .attr("class", "kgpred").text(d => d.predicate || "");

  const node = root.append("g").selectAll("g").data(nodes).join("g").attr("class", "kgnode");
  node.append("circle")
    .attr("r", radius)
    .attr("fill", d => KG_TYPE_COLOR[d.type] || "#888")
    .attr("filter", "url(#kgsoft)");
  // above the node and centred, so a label belongs to its own circle instead of
  // trailing into whatever happens to sit to the right of it
  node.append("text").attr("class", "kglabel")
    .attr("y", d => -radius(d) - 5).text(d => d.name);
  node.append("title").text(d => `${d.name} (${d.type}) - ${d.mentions} mention(s)\n${d.description || ""}`);

  // Fit the drawing to the box once the layout settles. A force layout spreads
  // to wherever its forces balance, which is not the shape of this pane - so
  // without this there is always either overflow or wasted space, and with 51
  // nodes it was mostly wasted space.
  const fitToBox = () => {
    const b = root.node().getBBox();
    if (!b.width || !b.height) return;
    const pad = 28;
    // Never shrink below what stays readable: a 10px label at 0.4 is 4px. If the
    // graph genuinely needs more room than that, it overflows and the user pans
    // - which is honest, where an unreadable fit is not.
    const k = Math.max(Math.min((w - pad * 2) / b.width, (h - pad * 2) / b.height, 1.6), .45);
    const t = d3.zoomIdentity
      .translate(w / 2, h / 2).scale(k)
      .translate(-(b.x + b.width / 2), -(b.y + b.height / 2));
    // applied directly, not through a transition: a transition is another rAF
    // dependency, and this runs once the layout is already final
    svg.call(zoom.transform, t);
  };

  const draw = () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    // ride the line, flipped where it would otherwise read upside down
    label.attr("transform", d => {
      const mx = (d.source.x + d.target.x) / 2, my = (d.source.y + d.target.y) / 2;
      let a = Math.atan2(d.target.y - d.source.y, d.target.x - d.source.x) * 180 / Math.PI;
      if (a > 90 || a < -90) { a += 180; }
      return `translate(${mx},${my}) rotate(${a}) translate(0,-3)`;
    });
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  };

  // Settle the layout SYNCHRONOUSLY instead of animating it.
  //
  // d3's force simulation is driven by requestAnimationFrame. Any context that
  // throttles rAF - a background tab, a hidden pane - runs zero ticks, and the
  // graph renders with every node still at the origin: 51 labels stacked in a
  // 153x26 box, which is exactly the "specks in a field of white" this looked
  // like. Ticking by hand makes the layout deterministic and instant, and the
  // graph arrives settled rather than wobbling into place.
  // forceCenter only moves the centre of mass; it does not stop the cloud
  // expanding. Left to itself this laid 51 nodes out over 2455x2294, which the
  // fit then had to shrink to 0.26 - legible labels became specks. forceX/forceY
  // pull every node gently toward the middle, so the layout settles at roughly
  // the size of the box it has to live in.
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id)
      .distance(d => 70 + (d.source.mentions || 0) * 3).strength(.5))
    .force("charge", d3.forceManyBody().strength(-220).distanceMax(400))
    .force("center", d3.forceCenter(w / 2, h / 2))
    .force("x", d3.forceX(w / 2).strength(.05))
    .force("y", d3.forceY(h / 2).strength(.08))
    // keep each node's own label clear of its neighbours
    .force("collide", d3.forceCollide().radius(d => radius(d) + 22))
    .stop();
  for (let i = 0; i < 320; i++) {
    sim.tick();
  }
  draw();
  fitToBox();
  // dragging still animates, where rAF is available
  sim.on("tick", draw);
  node.call(d3.drag()
    .on("start", (ev, d) => { if (!ev.active) sim.alphaTarget(.3).restart(); d.fx = d.x; d.fy = d.y; })
    // draw() on every drag event, not only on a tick: where rAF is throttled the
    // simulation never ticks and the node would stay under the cursor unmoved.
    .on("drag", (ev, d) => { d.fx = ev.x; d.fy = ev.y; d.x = ev.x; d.y = ev.y; draw(); })
    .on("end", (ev, d) => { if (!ev.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  const applyHighlight = kgBuildLegend(nodes, node, link, label, view);

  /* The info card. wikigraph's panel, same content and same reading order:
     the name, what it is, then every relation it takes part in, each written
     the way the fact runs - "trains -> Luke Skywalker", "<- portrayed Alec
     Guinness" - so an inbound fact is not silently reversed into an outbound
     one. Each other entity is clickable, which is how you walk the graph. */
  const info = flow.querySelector("#kginfo");
  const openInfo = d => {
    info.querySelector(".kginm").textContent = d.name;
    info.querySelector(".kgity").innerHTML =
      `<span class="sw" style="background:${KG_TYPE_COLOR[d.type] || "#888"}"></span>` +
      `${esc(d.type || "Unknown")} &middot; ${d.mentions} mention(s)`;
    info.querySelector(".kgidesc").textContent = d.description || "";
    const rels = adj[d.id] || [];
    let html = `<h4>${rels.length || "no"} relation${rels.length === 1 ? "" : "s"}</h4>`;
    rels.forEach(a => {
      const other = byId[a.id];
      html += `<div class="kgirel">` +
        (a.dir === "out" ? "" : "&larr; ") +
        `<span class="p">${esc(a.predicate || "related to")}</span>` +
        (a.dir === "out" ? " &rarr; " : " ") +
        `<span class="o" data-id="${escA(a.id)}">${esc(other ? other.name : a.id)}</span></div>`;
    });
    info.querySelector(".kgibody").innerHTML = html;
    info.querySelectorAll(".kgibody .o").forEach(el => {
      el.onclick = () => { const n = byId[+el.dataset.id]; if (n) focusNode(n); };
    });
    info.classList.add("open");
  };
  const closeInfo = () => info.classList.remove("open");
  const focusNode = d => { view.focus = d.id; applyHighlight(); openInfo(d); };
  const clearFocus = () => { view.focus = null; applyHighlight(); closeInfo(); };
  info.querySelector(".kgiclose").onclick = e => { e.preventDefault(); clearFocus(); };

  // Click a node to single it out with everything it is connected to; click it
  // again, or the empty canvas, to put the rest back. wikigraph's gesture, and
  // the reason it is worth having: on a constellation of fifty dots, "what is
  // this one connected to" is answered by looking rather than by tracing lines.
  node.style("cursor", "pointer").on("click", (ev, d) => {
    ev.stopPropagation();
    if (view.focus === d.id) { clearFocus(); } else { focusNode(d); }
  });
  // only a click on the canvas ITSELF - a click that lands on a node has
  // already been handled and stopped above
  svg.on("click", ev => {
    if (ev.target !== svg.node()) return;
    if (view.focus === null) return;
    clearFocus();
  });

  // The pane changes width with the focus toggle and the window; a graph fitted
  // to the old box is the same wasted-space problem again.
  clearTimeout(KG.resizeTimer);
  if (!KG.resizeWired) {
    KG.resizeWired = true;
    window.addEventListener("resize", () => {
      clearTimeout(KG.resizeTimer);
      KG.resizeTimer = setTimeout(() => { if (activeTab === "kg") await0(kgDrawGraph()); }, 300);
    });
  }
}

/* The legend, ported from wikigraph: a swatch per entity type, click to
   highlight, pick several. It doubles as the only place the type colours are
   explained - without it the constellation is a field of coloured dots whose
   colours mean nothing to the person looking at it. */
function kgBuildLegend(nodes, nodeSel, linkSel, labelSel, view) {
  const box = $("kglegend");
  view = view || { focus: null };
  const counts = new Map();
  nodes.forEach(n => counts.set(n.type || "Unknown", (counts.get(n.type || "Unknown") || 0) + 1));
  const types = [...counts.keys()].sort((a, b) => counts.get(b) - counts.get(a));
  if (!types.length) { box.innerHTML = ""; return () => {}; }

  box.innerHTML =
    `<div class="kglh">entity types</div>` +
    `<div class="kglhact"><button class="kglbtn kgllinks">hide labels</button></div>` +
    `<div class="kglbody">` +
    types.map(t => `<div class="kgleg" data-type="${escA(t)}">` +
      `<span class="sw" style="background:${KG_TYPE_COLOR[t] || "#888"}"></span>` +
      `${esc(t)} <span class="n">${counts.get(t)}</span></div>`).join("") +
    `</div>` +
    `<div class="kglacts">` +
      `<button class="kglbtn kglall">select all</button>` +
      `<button class="kglbtn kglclear">clear selection</button>` +
    `</div>`;

  const active = new Set();
  // The predicate TEXT is what crowds the view - dozens of small words lying
  // across each other between nodes. The connecting lines are what makes it a
  // graph, so they stay: turning the labels off leaves the structure readable
  // and drops the noise. Hidden with `display`, not opacity, so nothing
  // invisible is still catching the pointer.
  let labelsShown = true;
  const apply = () => {
    box.querySelectorAll(".kgleg").forEach(r => r.classList.toggle("sel", active.has(r.dataset.type)));
    box.querySelector(".kglclear").classList.toggle("show", active.size > 0 || view.focus !== null);
    // A focused node overrides the type selection outright rather than
    // intersecting with it: picking one node out of the field is a narrower
    // question than picking a type, and an intersection of the two can be
    // empty, which reads as a bug.
    //
    // "Lit" means the node AND everything it is connected to. A node alone,
    // with every edge it owns dimmed to nothing, answers "where is it" and not
    // "what is it about" - which is the question being asked by clicking it.
    const keep = (view.focus === null) ? null
      : new Set([view.focus].concat(((view.adj || {})[view.focus] || []).map(a => a.id)));
    const on = d => keep ? keep.has(d.id)
                         : (active.size === 0 || active.has(d.type || "Unknown"));
    nodeSel.style("opacity", d => on(d) ? 1 : .12);
    // An edge stays lit only while BOTH ends are, so a highlighted type shows
    // its own connections rather than half-edges into dimmed nodes. With a node
    // focused it is narrower still: only ITS OWN edges, never every edge among
    // its neighbours - that would light a second ring of facts that have
    // nothing to do with the thing that was clicked.
    const incident = d => (d.source.id === view.focus) || (d.target.id === view.focus);
    const edgeOn = d => keep ? incident(d)
                             : (active.size === 0 || (on(d.source) && on(d.target)));
    linkSel.classed("hot", d => keep !== null && incident(d))
           .style("opacity", d => edgeOn(d) ? (keep ? .85 : .6) : .05);
    labelSel.style("display", labelsShown ? null : "none")
            .style("opacity", d => edgeOn(d) ? 1 : .05);
    box.querySelector(".kgllinks").textContent =
      labelsShown ? "hide labels" : "show labels";
  };
  box.querySelectorAll(".kgleg").forEach(r => {
    r.onclick = () => {
      const t = r.dataset.type;
      // picking a type is a new question: drop any single node being focused,
      // or the click would look like it did nothing
      view.focus = null;
      if (active.has(t)) { active.delete(t); } else { active.add(t); }
      apply();
    };
  });
  box.querySelector(".kgllinks").onclick = e => { e.preventDefault(); labelsShown = !labelsShown; apply(); };
  box.querySelector(".kglall").onclick = e => {
    e.preventDefault(); view.focus = null; types.forEach(t => active.add(t)); apply();
  };
  box.querySelector(".kglclear").onclick = e => {
    e.preventDefault(); view.focus = null; active.clear(); apply();
  };
  // handed back so a node click can re-run exactly this, instead of a second
  // copy of the opacity rules drifting out of step with these
  return apply;
}

/* ---- masthead model picker ---------------------------------------------
   Switches the LLM behind all three agent steps (architect, SQL generation,
   index advisor). The server keeps the allowlist and moves both Config Store
   profiles together, so this posts an id and nothing else. The change lands on
   the next agent call — an in-flight one finishes on the old model. */
async function refreshModels() {
  const sel = $("modelsel");
  try {
    const j = await (await fetch(api("/models"))).json();
    const list = j.models || [];
    sel.innerHTML = list.map(m =>
      `<option value="${esc(m.id)}">${esc(m.label)}</option>`).join("");
    // dataset.active is the server's truth, used to roll the control back if a
    // switch fails — without seeding it here the first failed switch has
    // nothing to restore to
    if (j.active) { sel.value = j.active; sel.dataset.active = j.active; }
  } catch (e) {
    sel.innerHTML = `<option value="">unavailable</option>`;
    sel.disabled = true;
  }
}
$("modelsel").onchange = async (e) => {
  const sel = e.target, chosen = sel.value, previous = sel.dataset.active || "";
  sel.disabled = true;
  try {
    const j = await (await fetch(api("/models/select"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: chosen })
    })).json();
    if (j.error) throw new Error(j.error);
    sel.dataset.active = chosen;
    const label = sel.options[sel.selectedIndex].text;
    setStatus(`agents now on ${esc(label)}`);
  } catch (err) {
    // put the control back where it was — the server is still on the old model
    if (previous) sel.value = previous;
    alert(`Could not switch model: ${err.message}`);
  } finally {
    sel.disabled = false;
  }
};

/* Keep the conversation pinned to the newest message unless the user scrolled
   up. "Newest" is at the BOTTOM everywhere except the Knowledge Base chat,
   which inserts each turn at the top - there this observer would have hauled
   the view down to the oldest exchange every time an answer arrived. */
(function () {
  const c = $("convo");
  let stick = true;
  c.addEventListener("scroll", () => {
    stick = kgChatOpen()
      ? c.scrollTop <= 60
      : (c.scrollTop + c.clientHeight) >= (c.scrollHeight - 60);
  });
  new MutationObserver(() => {
    if (!stick) return;
    c.scrollTop = kgChatOpen() ? 0 : c.scrollHeight;
  }).observe(c, { childList: true, subtree: true, characterData: true });
})();

renderGraph();
showTab("sources");
</script>
